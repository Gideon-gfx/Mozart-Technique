<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tutor Dashboard - Mozart Techniques</title>
  <link rel="shortcut icon" href="/mozartLogo.jpg" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{'primary-red': '#cc0000'}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="/assets/redesign.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans">
  <header class="sticky top-0 z-50 bg-white shadow-sm">
    <nav class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between h-20">
      <a href="/home" class="flex items-center gap-3">
        <img src="/mozartLogo.jpg" alt="Mozart Techniques" class="w-10 h-10 rounded-full object-cover shadow-sm">
        <span class="hidden sm:inline text-xl font-bold text-primary-red">Mozart Techniques</span>
      </a>
      <div class="flex items-center gap-3">
        <a href="/notifications" id="tutor-notifications-link" class="relative p-2 text-gray-700 hover:text-primary-red" aria-label="Notifications" title="Notifications"><i class="fa-solid fa-bell text-xl"></i><span id="tutor-notification-badge" class="hidden absolute right-0 top-0 rounded-full bg-primary-red px-1 text-[10px] text-white">0</span></a>
        <button id="mobile-nav-toggle" class="sm:hidden p-2 rounded-md text-gray-700 hover:bg-gray-100" aria-label="Toggle navigation"><i class="fa-solid fa-bars text-xl"></i></button>
        <div id="auth-state"></div>
      </div>
    </nav>
    <div id="mobile-nav" class="sm:hidden bg-white border-t border-gray-100 hidden">
      <div class="px-4 py-3 space-y-2">
        <a href="/home" class="block text-gray-700">Home</a>
        <a href="/dashboard" class="block text-gray-700">Student Dashboard</a>
        <a href="/find-tutor" class="block text-gray-700">Find a Tutor</a>
        <a href="/search" class="block text-gray-700">Search</a>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-10">
    <div class="mb-6 flex flex-wrap items-center justify-between gap-3"><h1 class="text-2xl font-extrabold text-gray-900">Tutor Dashboard</h1><button id="create-group-chat-top-btn" class="rounded-lg bg-primary-red px-3 py-2 text-sm font-semibold text-white"><i class="fa-solid fa-user-group mr-2"></i>Create Group Chat</button></div>
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
      <aside class="lg:col-span-1">
        <div class="sticky top-24 bg-white rounded-xl p-4 shadow">
          <nav class="space-y-2">
            <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Navigation</div>
            <button data-section="overview" class="nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-gray-50 font-semibold bg-gray-50 text-primary-red">Overview</button>
            <button data-section="students" class="nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-gray-50 font-semibold">Students</button>
            <button data-section="classes" class="nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-gray-50 font-semibold">Classes</button>
            <button data-section="payments" class="nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-gray-50 font-semibold">Payments</button>
            <button data-section="settings" class="nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-gray-50 font-semibold">Settings</button>
          </nav>
        </div>
      </aside>

      <section class="lg:col-span-3 space-y-6">
        <div id="section-overview" class="bg-white rounded-2xl shadow p-6">
          <h2 class="text-lg font-bold mb-3">Overview</h2>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="rounded-2xl p-4 bg-gradient-to-br from-white to-gray-50 border border-gray-100 shadow"> <p class="text-xs text-gray-500">Active students</p><p id="tutor-active" class="text-2xl font-bold">0</p></div>
            <div class="rounded-2xl p-4 bg-gradient-to-br from-white to-gray-50 border border-gray-100 shadow"> <p class="text-xs text-gray-500">Open lessons</p><p id="tutor-open" class="text-2xl font-bold">0</p></div>
            <div class="rounded-2xl p-4 bg-gradient-to-br from-white to-gray-50 border border-gray-100 shadow"> <p class="text-xs text-gray-500">Wallet</p><p id="tutor-wallet" class="text-2xl font-bold">$0.00</p></div>
          </div>
        </div>

        <div id="section-students" class="hidden bg-white rounded-2xl shadow p-6">
          <div class="flex items-center justify-between gap-3 mb-4">
            <h2 class="text-lg font-bold">Students & Requests</h2>
            <button id="create-group-chat-btn" class="px-3 py-2 bg-primary-red text-white text-sm font-semibold rounded-lg">Create Group Chat</button>
          </div>
          <div id="tutor-students-list" class="space-y-3"></div>
          <div id="tutor-group-list" class="mt-6 space-y-3"></div>
        </div>

        <div id="section-classes" class="hidden bg-white rounded-2xl shadow p-6">
          <h2 class="text-lg font-bold mb-3">Classes</h2>
          <p class="text-sm text-gray-500">No classes scheduled.</p>
        </div>

        <div id="section-payments" class="hidden bg-white rounded-2xl shadow p-6">
          <h2 class="text-lg font-bold mb-3">Payments</h2>
          <p class="text-sm text-gray-500">No recent payments.</p>
        </div>

        <div id="section-settings" class="hidden bg-white rounded-2xl shadow p-6">
          <h2 class="text-lg font-bold mb-3">Settings</h2>
          <p class="text-sm text-gray-500">Update your tutor profile and availability.</p>
        </div>

      </section>
    </div>
  </main>

  <script>
    async function loadTutorDashboard(){
      try{
        const res = await fetch('/api/dashboard');
        if (res.status === 401) { window.location.href = '/login?redirect=' + encodeURIComponent('/tutor-dashboard.html'); return; }
        const data = await res.json();
        document.getElementById('tutor-active').textContent = (data.tutor && data.tutor.activeStudents) || 0;
        document.getElementById('tutor-open').textContent = (data.tutor && data.tutor.openLessons) || 0;
        document.getElementById('tutor-wallet').textContent = (data.tutor && data.tutor.wallet) || '$0.00';
        try {
          const notificationData = await fetch('/api/notifications').then((response) => response.json());
          const unread = (notificationData.notifications || []).filter((item) => !item.read).length;
          const badge = document.getElementById('tutor-notification-badge');
          badge.textContent = unread > 99 ? '99+' : String(unread);
          badge.classList.toggle('hidden', unread === 0);
        } catch (error) { console.warn('Could not load notifications', error); }
        const list = document.getElementById('tutor-students-list');
        if (data.tutor && data.tutor.students && data.tutor.students.length) {
          list.innerHTML = data.tutor.students.map(s => `
            <div class="p-3 bg-gray-50 rounded-lg">
              <div class="font-semibold">${escapeHtml(s.name)}</div>
              <div class="text-sm text-gray-500">${escapeHtml(s.email||'')}</div>
            </div>
          `).join('');
        } else {
          list.innerHTML = '<p class="text-sm text-gray-500">No students yet.</p>';
        }

        try {
          const groupRes = await fetch('/api/tutors/me/group-chats');
          const groupData = await groupRes.json();
          const groupList = document.getElementById('tutor-group-list');
          if (!groupList) return;
          if (!groupData.success || !groupData.chats || !groupData.chats.length) {
            groupList.innerHTML = '<p class="text-sm text-gray-500">No course groups created yet.</p>';
            return;
          }
          groupList.innerHTML = groupData.chats.map(chat => `
            <div class="rounded-lg border border-gray-200 p-3 bg-gray-50">
              <div class="font-semibold text-gray-900">${escapeHtml(chat.name || chat.course || 'Course group')}</div>
              <div class="text-xs text-gray-500 mt-1">${escapeHtml(chat.course || 'Mixed students')} • ${chat.studentCount || 0} students</div>
            </div>
          `).join('');
        } catch (error) {
          console.warn('No tutor group chats yet', error);
        }
      }catch(err){console.error(err);}
    }

    document.getElementById('create-group-chat-btn')?.addEventListener('click', async () => {
      try {
        const data = await fetch('/api/dashboard').then((res) => res.json());
        const students = Array.isArray(data.tutor && data.tutor.students) ? data.tutor.students : [];
        if (!students.length) {
          alert('You need at least one student assigned before creating a group chat.');
          return;
        }

        const modal = document.createElement('div');
        modal.className = 'fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4';
        modal.innerHTML = `
          <div class="w-full max-w-lg rounded-2xl bg-white p-5 shadow-2xl">
            <div class="mb-4 flex items-center justify-between gap-3">
              <h3 class="text-xl font-bold text-gray-900">Create group chat</h3>
              <button type="button" data-close-group-modal class="rounded-full p-2 text-gray-500 hover:bg-gray-100"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Course</label>
                <input id="group-course-input" type="text" value="Piano" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" maxlength="60">
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Group name</label>
                <input id="group-name-input" type="text" value="Piano students" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" maxlength="80">
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Students</label>
                <div class="max-h-52 space-y-2 overflow-y-auto rounded-lg border border-gray-200 p-2">
                  ${students.map((student) => `
                    <label class="flex items-center justify-between gap-3 rounded-md p-2 hover:bg-gray-50">
                      <span class="flex items-center gap-2">
                        <input type="checkbox" value="${student.id}" checked>
                        <span class="text-sm text-gray-700">${escapeHtml(student.name || 'Student')}</span>
                      </span>
                    </label>
                  `).join('')}
                </div>
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Group image (optional)</label>
                <input id="group-image-input" type="file" accept="image/*" class="w-full text-sm text-gray-600">
              </div>
            </div>
            <div class="mt-5 flex justify-end gap-2">
              <button type="button" data-close-group-modal class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700">Cancel</button>
              <button type="button" id="confirm-group-create" class="rounded-lg bg-primary-red px-4 py-2 text-sm font-semibold text-white">Create group</button>
            </div>
          </div>
        `;

        document.body.appendChild(modal);
        modal.classList.remove('hidden');
        modal.classList.add('flex');

        const close = () => modal.remove();
        modal.querySelectorAll('[data-close-group-modal]').forEach((node) => node.addEventListener('click', close));

        modal.querySelector('#confirm-group-create').addEventListener('click', async () => {
          const course = modal.querySelector('#group-course-input').value.trim();
          const groupName = modal.querySelector('#group-name-input').value.trim();
          const selectedStudentIds = Array.from(modal.querySelectorAll('input[type="checkbox"]:checked')).map((checkbox) => Number(checkbox.value)).filter(Boolean);

          if (!course || !groupName) {
            return alert('Course and group name are required.');
          }
          if (!selectedStudentIds.length) {
            return alert('Choose at least one student.');
          }

          let groupImageUrl = null;
          const file = modal.querySelector('#group-image-input').files[0];
          if (file) {
            const formData = new FormData();
            formData.append('media', file);
            const uploadResponse = await fetch('/api/organizations/upload-media?type=photo', { method: 'POST', body: formData });
            const uploadData = await uploadResponse.json();
            if (!uploadData.success) {
              return alert(uploadData.error || 'Could not upload the group image.');
            }
            groupImageUrl = uploadData.url;
          }

          const res = await fetch('/api/tutors/me/group-chats', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ groupName, course, studentIds: selectedStudentIds, groupImageUrl })
          });
          const result = await res.json();
          if (!result.success) {
            alert(result.error || 'Could not create group chat.');
            return;
          }
          modal.remove();
          window.location.href = `/messages/group?name=${encodeURIComponent(result.conversation.title || groupName)}`;
        });
      } catch (error) {
        console.error(error);
        alert('Could not create group chat.');
      }
    });
    document.getElementById('create-group-chat-top-btn')?.addEventListener('click', () => document.getElementById('create-group-chat-btn')?.click());
    function escapeHtml(t){return String(t).replace(/[&<>"']/g,(m)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
    document.addEventListener('DOMContentLoaded', loadTutorDashboard);
    // Sidebar nav behavior
    document.addEventListener('DOMContentLoaded', () => {
      const buttons = document.querySelectorAll('.nav-btn');
      function activate(section){
        document.querySelectorAll('[id^="section-"]').forEach(s => s.classList.add('hidden'));
        const el = document.getElementById('section-' + section);
        if (el) el.classList.remove('hidden');
        buttons.forEach(b => b.classList.remove('bg-gray-50','text-primary-red'));
        const activeBtn = Array.from(buttons).find(b => b.dataset.section === section);
        if (activeBtn) activeBtn.classList.add('bg-gray-50','text-primary-red');
      }
      buttons.forEach(b => {
        b.addEventListener('click', () => activate(b.dataset.section));
      });
      // default
      activate('overview');
    });
  </script>
  <script src="/assets/mobile-nav.js"></script>
    <script src="/assets/nav-auth.js"></script>
</body>
</html>
