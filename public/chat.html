        // --- Voice note playback: waveform bars, play/pause, speed toggle --
        // Only one clip plays at a time; re-rendering the message list (any
        // unrelated activity) doesn't stop these on its own since they're
        // plain JS Audio objects, not DOM elements - see loadMessages().
        const VOICE_BAR_COUNT = 32;
        const voiceWaveformCache = new Map(); // url -> number[] (bar heights, 0-1)
        const VOICE_SPEEDS = [1, 1.5, 2];
        let activeVoiceAudio = null;
        function formatVoiceTime(seconds) {
            if (!Number.isFinite(seconds) || seconds < 0) seconds = 0;
            const m = Math.floor(seconds / 60);
            const s = String(Math.floor(seconds % 60)).padStart(2, '0');
            return `${m}:${s}`;
        }
        function fallbackWaveform(seed) {
            let h = 0;
            for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
            const bars = [];
            for (let i = 0; i < VOICE_BAR_COUNT; i++) {
                h = (h * 1103515245 + 12345) >>> 0;
                bars.push(0.18 + (h % 1000) / 1000 * 0.75);
            }
            return bars;
        }
        async function getVoiceWaveform(url) {
            if (voiceWaveformCache.has(url)) return voiceWaveformCache.get(url);
            let bars = null;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) {
                    const buf = await fetch(url).then((r) => r.arrayBuffer());
                    const ctx = new AudioCtx();
                    const audioBuf = await ctx.decodeAudioData(buf);
                    const channel = audioBuf.getChannelData(0);
                    const blockSize = Math.max(1, Math.floor(channel.length / VOICE_BAR_COUNT));
                    const raw = [];
                    for (let i = 0; i < VOICE_BAR_COUNT; i++) {
                        let sum = 0;
                        const start = i * blockSize;
                        for (let j = 0; j < blockSize; j++) sum += Math.abs(channel[start + j] || 0);
                        raw.push(sum / blockSize);
                    }
                    const max = Math.max(...raw, 0.0001);
                    bars = raw.map((v) => Math.max(0.12, v / max));
                    ctx.close();
                }
            } catch { /* fall through to the seeded fallback below */ }
            if (!bars) bars = fallbackWaveform(url);
            voiceWaveformCache.set(url, bars);
            return bars;
        }
        function voiceNoteHtml(url) {
            return `<div class="voice-note" data-voice-url="${escapeHtml(url)}">
                <div class="voice-row">
                    <button type="button" class="voice-play" data-voice-toggle aria-label="Play voice note"><i class="fa-solid fa-play"></i></button>
                    <div class="voice-wave" data-voice-wave></div>
                    <button type="button" class="voice-speed" data-voice-speed title="Playback speed">1x</button>
                </div>
                <span class="voice-time" data-voice-time>--:--</span>
            </div>`;
        }
        function hydrateVoiceNotes(container) {
            container.querySelectorAll('[data-voice-url]').forEach((el) => {
                if (el.dataset.voiceReady) return;
                el.dataset.voiceReady = '1';
                const url = el.dataset.voiceUrl;
                const playBtn = el.querySelector('[data-voice-toggle]');
                const waveEl = el.querySelector('[data-voice-wave]');
                const speedBtn = el.querySelector('[data-voice-speed]');
                const timeEl = el.querySelector('[data-voice-time]');
                const audio = new Audio(url);
                let speedIndex = 0;
                // Drawn synchronously first (no network round-trip to wait
                // on) so the wave is never just blank while
                // getVoiceWaveform's fetch+decode is in flight - or if it
                // never settles at all - then swapped for the real decoded
                // shape once/if that resolves.
                let bars = fallbackWaveform(url);
                const paintBars = () => { waveEl.innerHTML = bars.map((v) => `<span style="height:${Math.max(3, Math.round(v * 22))}px"></span>`).join(''); };
                paintBars();
                getVoiceWaveform(url).then((resolvedBars) => { bars = resolvedBars; paintBars(); });

                function paintProgress() {
                    if (!bars || !audio.duration) return;
                    const ratio = audio.currentTime / audio.duration;
                    const playedCount = Math.round(ratio * VOICE_BAR_COUNT);
                    waveEl.querySelectorAll('span').forEach((bar, i) => bar.classList.toggle('played', i < playedCount));
                }
                function setIcon(playing) {
                    playBtn.innerHTML = playing ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
                }
                function updateTime() {
                    if (audio.currentTime > 0 && !audio.paused) timeEl.textContent = formatVoiceTime(audio.currentTime);
                    else if (audio.duration) timeEl.textContent = formatVoiceTime(audio.duration);
                }

                audio.addEventListener('loadedmetadata', updateTime);
                audio.addEventListener('timeupdate', () => { updateTime(); paintProgress(); });
                audio.addEventListener('ended', () => { setIcon(false); paintProgress(); if (activeVoiceAudio === audio) activeVoiceAudio = null; });
                audio.addEventListener('pause', () => setIcon(false));
                audio.addEventListener('play', () => setIcon(true));

                function startPlayback() {
                    if (activeVoiceAudio && activeVoiceAudio !== audio) activeVoiceAudio.pause();
                    activeVoiceAudio = audio;
                    audio.play().catch(() => {});
                }
                function toggle() {
                    if (audio.paused) startPlayback();
                    else audio.pause();
                }
                // Tapping the waveform seeks to that point (and starts/resumes
                // playing from there) instead of just toggling play/pause.
                function seekTo(e) {
                    if (!audio.duration) return toggle();
                    const rect = waveEl.getBoundingClientRect();
                    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
                    audio.currentTime = ratio * audio.duration;
                    paintProgress();
                    if (audio.paused) startPlayback();
                }
                playBtn.addEventListener('click', toggle);
                waveEl.addEventListener('click', seekTo);
                speedBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    speedIndex = (speedIndex + 1) % VOICE_SPEEDS.length;
                    audio.playbackRate = VOICE_SPEEDS[speedIndex];
                    speedBtn.textContent = `${VOICE_SPEEDS[speedIndex]}x`;
                });
            });
        }

        function quoteSnippet(message) {
            if (!message) return 'Original message unavailable';
            if (message.deleted) return 'This message was deleted';
            if (message.text) return message.text;
            if (message.attachment) return ({ image: 'Photo', video: 'Video', audio: 'Voice note' }[message.attachment.kind] || message.attachment.name || 'Attachment');
            if (message.poll) return `Poll: ${message.poll.question}`;
            if (message.location) return 'Location';
            if (message.libraryItem) return `Clip: ${message.libraryItem.title}`;
            return 'Message';
        }

        function reactionsHtml(m) {
            const reactions = m.reactions || [];
            if (!reactions.length) return '';
            const byEmoji = {};
            reactions.forEach((r) => { byEmoji[r.emoji] = (byEmoji[r.emoji] || 0) + 1; });
            return `<div class="msg-reactions">${Object.entries(byEmoji).map(([emoji, count]) => `<span class="msg-reaction-pill">${emoji}${count > 1 ? `<span class="count">${count}</span>` : ''}</span>`).join('')}</div>`;
        }

        function pollHtml(m, mine) {
            if (!m.poll) return '';
            const votes = m.poll.votes || [];
            const total = votes.length;
            const myVote = votes.find((v) => v.userId === myUserId);
            return `
                <div class="poll-block" data-poll-id="${m.id}">
                    <p class="poll-question">${escapeHtml(m.poll.question)}</p>
                    ${m.poll.options.map((option) => {
                        const optionVotes = votes.filter((v) => v.optionId === option.id).length;
                        const pct = total ? Math.round((optionVotes / total) * 100) : 0;
                        const voted = myVote && myVote.optionId === option.id;
                        return `<div class="poll-option${voted ? ' voted' : ''}" data-poll-option="${option.id}" data-message-id="${m.id}"><div class="poll-bar" style="width:${pct}%"></div><span class="poll-option-label"><span>${voted ? '<i class="fa-solid fa-check mr-1"></i>' : ''}${escapeHtml(option.text)}</span><span>${pct}%</span></span></div>`;
                    }).join('')}
                    <p class="poll-meta">${total} vote${total === 1 ? '' : 's'}</p>
                </div>
            `;
        }

        function locationHtml(m) {
            if (!m.location) return '';
            const { lat, lng } = m.location;
            const bbox = `${lng - 0.01},${lat - 0.008},${lng + 0.01},${lat + 0.008}`;
            return `
                <a class="loc-block" href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=16/${lat}/${lng}" target="_blank" rel="noopener">
                    <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&marker=${lat},${lng}&layer=mapnik" loading="lazy"></iframe>
                    <span><i class="fa-solid fa-location-dot mr-1"></i>Open in Maps</span>
                </a>
            `;
        }

        function messageBubbleHtml(m) {
            const mine = m.senderRole === myRole;
            if (m.deleted) {
                return `
                    <div class="msg-row ${mine ? 'justify-end' : 'justify-start'}" data-id="${m.id}">
                        <div class="bubble ${mine ? 'bg-primary-red text-white' : 'bg-gray-100 text-gray-800'}" style="opacity:.65; font-style:italic;">
                            <i class="fa-solid fa-ban mr-1"></i>This message was deleted
                        </div>
                    </div>
                `;
            }
            const replyTo = m.replyToId ? findMessage(m.replyToId) : null;
            const quoteHtml = m.replyToId ? `<div class="msg-quote" data-goto="${m.replyToId}"><span class="quote-name">${escapeHtml(replyTo && replyTo.senderRole === myRole ? 'You' : (replyTo ? (replyTo.senderRole === 'tutor' ? 'Tutor' : 'Student') : ''))}</span><span class="quote-text">${escapeHtml(quoteSnippet(replyTo))}</span></div>` : '';
            const clip = m.libraryItem ? (() => {
                const mediaUrl = escapeHtml(m.libraryItem.url);
                const libraryUrl = escapeHtml(m.libraryItem.href || `/library?item=${encodeURIComponent(String(m.libraryItem.title || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''))}`);
                const isVideo = /\.(mp4|webm|ogg|mov|m4v|m3u8)(?:[?#]|$)/i.test(m.libraryItem.url || '');
                const youtube = (m.libraryItem.url || '').match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]{11})/i);
                const vimeo = (m.libraryItem.url || '').match(/vimeo\.com\/(?:video\/)?(\d+)/i);
                const player = isVideo
                    ? `<video src="${mediaUrl}" controls preload="metadata" class="library-clip"></video>`
                    : youtube
                        ? `<iframe src="https://www.youtube-nocookie.com/embed/${youtube[1]}" title="${escapeHtml(m.libraryItem.title)}" class="library-clip aspect-video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`
                        : vimeo
                            ? `<iframe src="https://player.vimeo.com/video/${vimeo[1]}" title="${escapeHtml(m.libraryItem.title)}" class="library-clip aspect-video" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`
                            : '';
                return `${player}<a href="${libraryUrl}" class="library-clip-link ${mine ? 'text-red-100' : 'text-primary-red'} hover:underline"><i class="fa-solid fa-clapperboard mr-1"></i>${escapeHtml(m.libraryItem.title)}</a>`;
            })() : '';
            const a = m.attachment;
            let attachmentHtml = '';
            if (a) {
                const url = escapeHtml(a.url);
                const name = escapeHtml(a.name || 'file');
                if (a.kind === 'image') {
                    attachmentHtml = `<a href="${url}"><img src="${url}" alt="${name}" class="att-img"></a>`;
                } else if (a.kind === 'video') {
                    attachmentHtml = `<video src="${url}" controls preload="metadata" class="att-video"></video>`;
                } else if (a.kind === 'audio') {
                    attachmentHtml = voiceNoteHtml(a.url);
                } else {
                    attachmentHtml = `<a href="${url}" download class="att-file ${mine ? 'text-white' : 'text-gray-700'}"><i class="fa-regular fa-file-lines"></i>${name}</a>`;
                }
            }
            const stamp = new Date(m.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const editedTag = m.editedAt ? '<span class="msg-edited-tag">(edited)</span>' : '';
            const pinBadge = m.pinned ? '<i class="fa-solid fa-thumbtack msg-pin-badge"></i>' : '';
            const trigger = `<button type="button" class="msg-trigger" data-msg-trigger data-id="${m.id}" aria-label="Message options"><i class="fa-solid fa-ellipsis-vertical"></i></button>`;
            const reactTrigger = `<button type="button" class="react-trigger" data-react-trigger data-id="${m.id}" aria-label="React"><i class="fa-regular fa-face-smile"></i></button>`;
            const hasBody = m.text || attachmentHtml || clip || m.poll || m.location;
            const bubble = `
                <div class="bubble ${mine ? 'bg-primary-red text-white' : 'bg-gray-100 text-gray-800'}" data-bubble>
                    ${quoteHtml}
                    ${attachmentHtml}
                    ${pollHtml(m, mine)}
                    ${locationHtml(m)}
                    ${m.text ? `<p class="whitespace-pre-wrap">${pinBadge}${linkifyHtml(m.text)}${editedTag}<span class="stamp">${stamp}</span></p>` : hasBody ? `<span class="stamp" style="float:none;top:0;display:block;margin:2px 0 0">${pinBadge}${editedTag} ${stamp}</span>` : ''}
                    ${clip}
                    ${reactionsHtml(m)}
                </div>
            `;
            return `
                <div class="msg-row ${mine ? 'justify-end' : 'justify-start'}" data-id="${m.id}">
                    <span class="swipe-reply-icon"><i class="fa-solid fa-reply"></i></span>
                    ${mine ? trigger + reactTrigger + bubble : bubble + reactTrigger + trigger}
                </div>
            `;
        }

        // --- Message action menu (hover trigger on desktop, long-press on touch) ---
        const msgMenu = document.getElementById('msg-menu');
        const reactPicker = document.getElementById('react-picker');
        const deletePopover = document.getElementById('delete-popover');
        let openMenuMessageId = null;
        let reactPickerMessageId = null;
        let deletePopoverMessageId = null;

        function findMessage(id) {
            return currentMessages.find((m) => String(m.id) === String(id));
        }

        function positionPopover(el, anchorRect, width, height) {
            let left = anchorRect.left;
            let top = anchorRect.bottom + 6;
            if (left + width > window.innerWidth - 8) left = window.innerWidth - width - 8;
            if (top + height > window.innerHeight - 8) top = anchorRect.top - height - 6;
            el.style.left = `${Math.max(8, left)}px`;
            el.style.top = `${Math.max(8, top)}px`;
        }

        const EDIT_WINDOW_MS = 30 * 60 * 1000;
        const DELETE_EVERYONE_WINDOW_MS = 10 * 60 * 1000;
        function messageAgeMs(message) { return Date.now() - new Date(message.createdAt).getTime(); }

        function openMenuForMessage(id, anchorRect) {
            const message = findMessage(id);
            if (!message || message.deleted) return;
            openMenuMessageId = id;
            const mine = message.senderRole === myRole;
            msgMenu.querySelectorAll('.mine-only').forEach((btn) => btn.classList.toggle('hidden', !mine));
            // Editing closes after 30 minutes even for your own messages -
            // the server enforces this too, this just avoids a round trip
            // to find out.
            const editBtn = msgMenu.querySelector('[data-action="edit"]');
            if (editBtn) editBtn.classList.toggle('hidden', !mine || messageAgeMs(message) > EDIT_WINDOW_MS);
            document.getElementById('msg-menu-pin-label').textContent = message.pinned ? 'Unpin' : 'Pin';
            positionPopover(msgMenu, anchorRect, 190, 230);
            msgMenu.hidden = false;
        }
        function closeMsgMenu() { msgMenu.hidden = true; openMenuMessageId = null; }

        const REACTION_EMOJI = ['👍', '❤️', '😂', '😢', '🙏'];
        reactPicker.innerHTML = REACTION_EMOJI.map((e) => `<button type="button" data-emoji="${e}">${e}</button>`).join('');
        function openReactPicker(id, anchorRect) {
            const message = findMessage(id);
            if (!message || message.deleted) return;
            reactPickerMessageId = id;
            const mine = (message.reactions || []).find((r) => r.userId === myUserId);
            reactPicker.querySelectorAll('button').forEach((btn) => btn.classList.toggle('active', Boolean(mine) && mine.emoji === btn.dataset.emoji));
            positionPopover(reactPicker, anchorRect, 210, 40);
            reactPicker.hidden = false;
        }
        function closeReactPicker() { reactPicker.hidden = true; reactPickerMessageId = null; }
        async function reactToMessage(id, emoji) {
            const res = await fetch(`/api/assignments/${assignmentId}/messages/${id}/react`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ emoji }) });
            const data = await res.json();
            if (!data.success) return showAlert(data.error || 'Could not react.', 'error');
            loadMessages(false);
        }
        reactPicker.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-emoji]');
            if (!btn) return;
            const id = reactPickerMessageId;
            closeReactPicker();
            if (id) reactToMessage(id, btn.dataset.emoji);
        });

        function openDeletePopover(id, anchorRect) {
            const message = findMessage(id);
            if (!message) return;
            deletePopoverMessageId = id;
            const everyoneBtn = document.getElementById('delete-everyone-btn');
            const mine = message.senderRole === myRole;
            const seen = recipientHasSeenLocally(message);
            const tooOld = messageAgeMs(message) > DELETE_EVERYONE_WINDOW_MS;
            everyoneBtn.disabled = !mine || seen || tooOld;
            document.getElementById('delete-hint').textContent = !mine
                ? 'Only the sender can delete this for everyone.'
                : tooOld ? 'This message is more than 10 minutes old, so this can only be deleted for you.'
                : seen ? 'Already seen, so this can only be deleted for you.' : 'Deleting for everyone removes it for both of you.';
            positionPopover(deletePopover, anchorRect, 208, 96);
            deletePopover.hidden = false;
        }
        function closeDeletePopover() { deletePopover.hidden = true; deletePopoverMessageId = null; }
        // Mirrors the server's own check (server.js recipientHasSeenMessage) so
        // "Delete for everyone" is disabled up front instead of failing after
        // a round trip - the server still re-checks and is the real gate.
        function recipientHasSeenLocally(message) {
            const recipientField = message.senderRole === 'student' ? 'readByTutor' : 'readByStudent';
            return Boolean(message[recipientField]);
        }
        deletePopover.addEventListener('click', async (e) => {
            const btn = e.target.closest('button[data-delete]');
            if (!btn || btn.disabled) return;
            const id = deletePopoverMessageId;
            const mode = btn.dataset.delete;
            closeDeletePopover();
            if (!id) return;
            const url = mode === 'me' ? `/api/assignments/${assignmentId}/messages/${id}/delete-for-me` : `/api/assignments/${assignmentId}/messages/${id}`;
            const res = await fetch(url, { method: mode === 'me' ? 'POST' : 'DELETE' });
            const data = await res.json();
            if (!data.success) return showAlert(data.error || 'Could not delete message.', 'error');
            if (editingMessageId === id) cancelEditingMessage();
            loadMessages(false);
        });

        document.addEventListener('click', (e) => {
            const trigger = e.target.closest('[data-msg-trigger]');
            if (trigger) {
                e.stopPropagation();
                const id = trigger.dataset.id;
                if (openMenuMessageId === id && !msgMenu.hidden) { closeMsgMenu(); return; }
                closeReactPicker(); closeDeletePopover();
                openMenuForMessage(id, trigger.getBoundingClientRect());
                return;
            }
            const reactTrigger = e.target.closest('[data-react-trigger]');
            if (reactTrigger) {
                e.stopPropagation();
                const id = reactTrigger.dataset.id;
                if (reactPickerMessageId === id && !reactPicker.hidden) { closeReactPicker(); return; }
                closeMsgMenu(); closeDeletePopover();
                openReactPicker(id, reactTrigger.getBoundingClientRect());
                return;
            }
            const quote = e.target.closest('.msg-quote');
            if (quote && quote.dataset.goto) {
                const row = document.querySelector(`.msg-row[data-id="${quote.dataset.goto}"]`);
                if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }
            if (!e.target.closest('#msg-menu')) closeMsgMenu();
            if (!e.target.closest('#react-picker')) closeReactPicker();
            if (!e.target.closest('#delete-popover')) closeDeletePopover();
        });
        window.addEventListener('scroll', () => { closeMsgMenu(); closeReactPicker(); closeDeletePopover(); }, true);

        // Touch devices hide the hover triggers (see the `@media (hover: none)`
        // rules) and use gestures instead, matching the mobile pattern of most
        // chat apps: hold opens one combined popover (reactions above, actions
        // below), a rightward swipe on the bubble jumps straight into reply.
        let longPressTimer = null;
        let swipeStartX = null, swipeRow = null, swipeBubble = null, swipeIcon = null, swipeTriggered = false;
        const chatBodyEl = document.getElementById('chat-body');
        chatBodyEl.addEventListener('touchstart', (e) => {
            const row = e.target.closest('.msg-row');
            if (!row) return;
            clearTimeout(longPressTimer);
            longPressTimer = setTimeout(() => {
                const touch = e.touches[0];
                const point = { left: touch.clientX, right: touch.clientX, top: touch.clientY, bottom: touch.clientY };
                openMenuForMessage(row.dataset.id, point);
                openReactPicker(row.dataset.id, { left: point.left, right: point.left, top: point.top - 190, bottom: point.top - 190 });
                if (navigator.vibrate) navigator.vibrate(15);
            }, 500);
            swipeRow = row;
            swipeBubble = row.querySelector('[data-bubble]');
            swipeIcon = row.querySelector('.swipe-reply-icon');
            swipeStartX = e.touches[0].clientX;
            swipeTriggered = false;
        }, { passive: true });
        chatBodyEl.addEventListener('touchmove', (e) => {
            clearTimeout(longPressTimer);
            if (swipeStartX == null || !swipeBubble) return;
            const dx = e.touches[0].clientX - swipeStartX;
            const clamped = Math.max(0, Math.min(dx, 70));
            if (clamped > 8) {
                swipeBubble.classList.add('no-transition');
                swipeBubble.style.transform = `translateX(${clamped}px)`;
                if (swipeIcon) swipeIcon.style.opacity = String(Math.min(1, clamped / 55));
                swipeTriggered = clamped > 55;
            }
        }, { passive: true });
        chatBodyEl.addEventListener('touchend', () => {
            clearTimeout(longPressTimer);
            if (swipeBubble) { swipeBubble.classList.remove('no-transition'); swipeBubble.style.transform = ''; }
            if (swipeIcon) swipeIcon.style.opacity = '0';
            if (swipeTriggered && swipeRow) startReplyingToMessage(swipeRow.dataset.id);
            swipeStartX = null; swipeBubble = null; swipeIcon = null; swipeRow = null; swipeTriggered = false;
        });
        chatBodyEl.addEventListener('contextmenu', (e) => { if (e.target.closest('.msg-row')) e.preventDefault(); });

        async function togglePinMessage(id) {
            const res = await fetch(`/api/assignments/${assignmentId}/messages/${id}/pin`, { method: 'POST' });
            const data = await res.json();
            if (!data.success) return showAlert(data.error || 'Could not update pin.', 'error');
            loadMessages(false);
        }

        function startEditingMessage(id) {
            const message = findMessage(id);
            if (!message) return;
            editingMessageId = id;
            input.value = message.text || '';
            autoGrow();
            refreshSendButton();
            document.getElementById('edit-banner').classList.remove('hidden');
            input.focus();
        }
        function cancelEditingMessage() {
            editingMessageId = null;
            input.value = '';
            autoGrow();
            refreshSendButton();
            document.getElementById('edit-banner').classList.add('hidden');
        }
        document.getElementById('cancel-edit-btn').addEventListener('click', cancelEditingMessage);

        function startReplyingToMessage(id) {
            const message = findMessage(id);
            if (!message || message.deleted) return;
            replyingToId = id;
            const mine = message.senderRole === myRole;
            document.getElementById('reply-banner-name').textContent = mine ? 'You' : (message.senderRole === 'tutor' ? 'Tutor' : 'Student');
            document.getElementById('reply-banner-text').textContent = quoteSnippet(message);
            document.getElementById('reply-banner').classList.remove('hidden');
            input.focus();
        }
        function cancelReplying() {
            replyingToId = null;
            document.getElementById('reply-banner').classList.add('hidden');
        }
        document.getElementById('cancel-reply-btn').addEventListener('click', cancelReplying);

        msgMenu.addEventListener('click', async (e) => {
            const btn = e.target.closest('button[data-action]');
            if (!btn) return;
            // The "delete" action below opens a NEW popover as a side
            // effect - without stopping this click here, it bubbles up to
            // the document-level handler that closes any popover the click
            // didn't land inside, immediately undoing the open.
            e.stopPropagation();
            const id = openMenuMessageId;
            const message = findMessage(id);
            closeMsgMenu();
            if (!message) return;
            const action = btn.dataset.action;
            if (action === 'reply') {
                startReplyingToMessage(id);
            } else if (action === 'copy') {
                try { await navigator.clipboard.writeText(message.text || ''); showAlert('Message copied.', 'success'); }
                catch { showAlert('Could not copy message.', 'error'); }
            } else if (action === 'share') {
                if (navigator.share) {
                    try { await navigator.share({ text: message.text || '' }); } catch { /* user cancelled the share sheet */ }
                } else {
                    try { await navigator.clipboard.writeText(message.text || ''); showAlert('Copied - paste it anywhere to share.', 'success'); }
                    catch { showAlert('Could not share message.', 'error'); }
                }
            } else if (action === 'pin') {
                togglePinMessage(id);
            } else if (action === 'edit') {
                startEditingMessage(id);
            } else if (action === 'delete') {
                const trigger = document.querySelector(`.msg-row[data-id="${id}"] [data-msg-trigger]`);
                const rect = trigger ? trigger.getBoundingClientRect() : null;
                const anchor = rect && (rect.width || rect.height) ? rect : { left: window.innerWidth / 2 - 100, right: window.innerWidth / 2 - 100, top: window.innerHeight / 2, bottom: window.innerHeight / 2 };
                openDeletePopover(id, anchor);
            }
        });

        function dateLabel(dateStr) {
            const date = new Date(dateStr);
            const today = new Date();
            const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
            const sameDay = (a, b) => a.toDateString() === b.toDateString();
            if (sameDay(date, today)) return 'Today';
            if (sameDay(date, yesterday)) return 'Yesterday';
            return date.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric', year: date.getFullYear() === today.getFullYear() ? undefined : 'numeric' });
        }

        // Sticky "Today" / "Yesterday" / date pills - each date group carries
        // its own sticky label so the one for whatever's currently in view
        // stays pinned to the top of the scroll area with no scroll listener.
        function renderMessageList(messages) {
            let html = '';
            let lastDateKey = null;
            messages.forEach((m) => {
                const dateKey = new Date(m.createdAt).toDateString();
                if (dateKey !== lastDateKey) {
                    html += `<div class="date-sep"><span>${dateLabel(m.createdAt)}</span></div>`;
                    lastDateKey = dateKey;
                }
                html += messageBubbleHtml(m);
            });
            return html;
        }

        let messagesLoading = false;
        async function loadMessages(scroll) {
            if (messagesLoading) return;
            messagesLoading = true;
            try {
                const res = await fetch(`/api/assignments/${assignmentId}/messages`);
                const data = await res.json();
                if (!data.success) return;
                myRole = data.role;
                if (myRole === 'tutor') document.getElementById('clip-library-btn').classList.remove('hidden');
                // Messages the current user deleted "for me" stay on the server
                // (the sender and anyone else still sees them) but never render
                // in this client.
                const visibleMessages = data.messages.filter((m) => !(m.deletedForUserIds || []).includes(myUserId));
                currentMessages = visibleMessages;
                renderPinnedBar();
                // Covers new messages as well as an edit/delete/pin/react/vote on
                // any existing one (not just the latest) - a plain last-id check
                // would miss those and leave the bubble stale.
                const signature = visibleMessages.map((m) => `${m.id}:${m.text}:${m.deleted ? 1 : 0}:${m.pinned ? 1 : 0}:${m.editedAt || ''}:${(m.reactions || []).map((r) => r.userId + r.emoji).join(',')}:${m.poll ? m.poll.votes.length : ''}`).join('|');
                if (signature === lastMessagesSignature) return; // nothing new
                lastMessagesSignature = signature;

                // The voice note <audio> objects live only in JS, not
                // attached to the document, so replacing this markup
                // doesn't stop them on its own - without this a playing
                // clip would keep going, inaudibly orphaned, the moment any
                // unrelated message activity re-rendered the list.
                if (activeVoiceAudio) { activeVoiceAudio.pause(); activeVoiceAudio = null; }
                const body = document.getElementById('chat-body');
                body.innerHTML = visibleMessages.length
                    ? renderMessageList(visibleMessages)
                    : '<p class="text-center text-gray-400 text-sm py-10">No messages yet - say hello!</p>';
                hydrateVoiceNotes(body);
                if (scroll !== false) body.scrollTop = body.scrollHeight;
            } catch (error) {
                console.error('Could not refresh chat messages:', error);
            } finally {
                messagesLoading = false;
            }
        }

        function renderPinnedBar() {
            const bar = document.getElementById('pinned-bar');
            const pinned = currentMessages.filter((m) => m.pinned && !m.deleted);
            const latest = pinned[pinned.length - 1];
            if (!latest) { bar.classList.add('hidden'); return; }
            document.getElementById('pinned-bar-text').textContent = latest.text || '(attachment)';
            bar.classList.remove('hidden');
            bar.dataset.id = latest.id;
        }
        document.getElementById('pinned-bar').addEventListener('click', (e) => {
            const id = document.getElementById('pinned-bar').dataset.id;
            if (e.target.closest('#pinned-bar-unpin')) { togglePinMessage(id); return; }
            const row = document.querySelector(`.msg-row[data-id="${id}"]`);
            if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });


        // --- Composer ---------------------------------------------------
        const input = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const sendIcon = document.getElementById('send-icon');
        let pendingAttachment = null;
        let composerMode = 'idle'; // 'idle' | 'recording' | 'ready' - see setComposerMode

        // The trailing button is a microphone until there's something to
        // send, then it becomes the send button - so one control covers both
        // without taking extra width in a slim bar.
        function refreshSendButton() {
            if (composerMode !== 'idle') return;
            const hasContent = Boolean(input.value.trim()) || Boolean(pendingAttachment) || Boolean(pickedLibraryItem);
            sendIcon.className = hasContent ? 'fa-solid fa-paper-plane' : 'fa-solid fa-microphone';
            sendBtn.title = hasContent ? 'Send' : 'Record a voice note';
        }

        function autoGrow() {
            input.style.height = 'auto';
            input.style.height = `${Math.min(input.scrollHeight, 96)}px`;
        }

        input.addEventListener('input', () => { refreshSendButton(); autoGrow(); });

        function showAttachPreview() {
            const box = document.getElementById('attach-preview');
            const selected = pendingAttachment || pickedLibraryItem;
            if (!selected) { box.classList.add('hidden'); box.innerHTML = ''; return; }
            const isLibrary = Boolean(pickedLibraryItem && !pendingAttachment);
            const thumb = selected.kind === 'image' ? `<img src="${escapeHtml(selected.url)}" alt="">` : isLibrary ? '<i class="fa-solid fa-photo-film text-primary-red"></i>' : `<i class="fa-solid ${selected.kind === 'video' ? 'fa-film' : selected.kind === 'audio' ? 'fa-microphone' : 'fa-file-lines'} text-gray-400"></i>`;
            box.innerHTML = `${thumb}<span>${escapeHtml(selected.title || selected.name || 'Selected video')}</span><button type="button" class="drop" title="Remove attachment"><i class="fa-solid fa-xmark"></i></button>`;
            box.classList.remove('hidden');
            box.querySelector('.drop').addEventListener('click', () => { pendingAttachment = null; pickedLibraryItem = null; showAttachPreview(); refreshSendButton(); });
        }
        async function uploadFile(file) {
            if (!file) return;
            const body = new FormData();
            body.append('file', file);
            try {
                const res = await fetch('/api/chat/upload', { method: 'POST', body });
                const data = await res.json();
                if (!data.success) return showAlert(data.error || 'Upload failed.', 'error');
                pendingAttachment = data.attachment;
                showAttachPreview();
                refreshSendButton();
            } catch (e) {
                showAlert('Upload failed.', 'error');
            }
        }

        // Each file-backed clip-menu item just opens its matching hidden
        // picker. Using the file input's own capture attribute for the
        // camera means the OS camera app handles it on phones without any
        // getUserMedia permission dance; desktops fall back to the live
        // in-page camera below.
        [['doc', 'doc-input'], ['media', 'media-input'], ['audio', 'audio-input']]
            .forEach(([clip, inputId]) => {
                const picker = document.getElementById(inputId);
                picker.addEventListener('change', () => { uploadFile(picker.files[0]); picker.value = ''; });
            });

        // --- Clip / attachment menu ---------------------------------------
        const clipMenu = document.getElementById('clip-menu');
        const clipBtn = document.getElementById('clip-btn');
        function openClipMenu() {
            closeMsgMenu(); closeReactPicker(); closeDeletePopover();
            const rect = clipBtn.getBoundingClientRect();
            clipMenu.style.left = `${Math.max(8, rect.left)}px`;
            clipMenu.hidden = false;
            clipMenu.style.maxHeight = `${Math.max(120, window.innerHeight - 24)}px`;
            clipMenu.style.overflowY = 'auto';
            clipMenu.style.top = `${Math.max(8, rect.top - clipMenu.offsetHeight - 8)}px`;
        }
        function closeClipMenu() { clipMenu.hidden = true; }
        clipBtn.addEventListener('click', (e) => { e.stopPropagation(); clipMenu.hidden ? openClipMenu() : closeClipMenu(); });
        document.addEventListener('click', (e) => { if (!clipMenu.hidden && !e.target.closest('#clip-menu') && !e.target.closest('#clip-btn')) closeClipMenu(); });
        clipMenu.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-clip]');
            if (!btn) return;
            closeClipMenu();
            const clip = btn.dataset.clip;
            if (clip === 'teaching-tools') { window.MozartTeachingTools.open(); return; }
            if (clip === 'doc') document.getElementById('doc-input').click();
            else if (clip === 'media') document.getElementById('media-input').click();
            else if (clip === 'audio') document.getElementById('audio-input').click();
            else if (clip === 'camera') openCamera();
            else if (clip === 'library') { const panel = document.getElementById('tutor-library-panel'); panel.classList.toggle('hidden'); if (!panel.classList.contains('hidden')) loadTutorLibraryPicker(); }
            else if (clip === 'poll') openPollModal();
            else if (clip === 'location') shareLocation();
        });

        // --- Camera -------------------------------------------------------
        // Opens a live preview and grabs a frame, rather than relying on the
        // file input's capture attribute, which desktop browsers ignore.
        // Falls back to that input if the camera can't be opened at all.
        const cameraInput = document.getElementById('camera-input');
        cameraInput.addEventListener('change', () => { uploadFile(cameraInput.files[0]); cameraInput.value = ''; });

        let camStream = null;

        function closeCamera() {
            if (camStream) { camStream.getTracks().forEach((t) => t.stop()); camStream = null; }
            const modal = document.getElementById('cam-modal');
            if (modal) modal.remove();
        }

        async function openCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                return cameraInput.click(); // very old browser - use the OS picker
            }
            try {
                camStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }, audio: false,
                });
            } catch (err) {
                // Denied, no camera, or blocked by an insecure origin. On
                // phones the capture input still reaches the camera app, so
                // it's a genuinely useful fallback rather than a dead end.
                if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) {
                    showAlert('Camera permission is needed to take a photo.', 'error');
                    return;
                }
                return cameraInput.click();
            }

            const modal = document.createElement('div');
            modal.id = 'cam-modal';
            modal.className = 'cam-modal';
            modal.innerHTML = `
                <div class="cam-inner">
                    <video id="cam-video" autoplay playsinline muted></video>
                    <div class="cam-actions">
                        <button type="button" id="cam-cancel">Cancel</button>
                        <button type="button" id="cam-shot" class="cam-shutter" title="Take photo"><i class="fa-solid fa-camera"></i></button>
                        <button type="button" id="cam-flip" title="Switch camera"><i class="fa-solid fa-camera-rotate"></i></button>
                    </div>
                </div>`;
            document.body.appendChild(modal);
            const video = document.getElementById('cam-video');
            video.srcObject = camStream;

            document.getElementById('cam-cancel').addEventListener('click', closeCamera);
            modal.addEventListener('click', (e) => { if (e.target === modal) closeCamera(); });

            document.getElementById('cam-flip').addEventListener('click', async () => {
                const current = camStream.getVideoTracks()[0].getSettings().facingMode;
                camStream.getTracks().forEach((t) => t.stop());
                try {
                    camStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: current === 'environment' ? 'user' : 'environment' }, audio: false,
                    });
                    video.srcObject = camStream;
                } catch (e) { showAlert('Could not switch camera.', 'error'); closeCamera(); }
            });

            document.getElementById('cam-shot').addEventListener('click', () => {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                canvas.toBlob((blob) => {
                    closeCamera();
                    if (!blob) return showAlert('Could not capture the photo.', 'error');
                    uploadFile(new File([blob], `photo-${Date.now()}.jpg`, { type: 'image/jpeg' }));
                }, 'image/jpeg', 0.9);
            });
        }

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCamera(); });

        // --- Poll -----------------------------------------------------------
        const pollBackdrop = document.getElementById('poll-modal-backdrop');
        function pollOptionRowHtml(value) {
            return `<div class="poll-option-row"><input type="text" class="poll-option-input" maxlength="80" value="${value ? escapeHtml(value) : ''}" placeholder="Option"></div>`;
        }
        function openPollModal() {
            document.getElementById('poll-question-input').value = '';
            document.getElementById('poll-options-list').innerHTML = pollOptionRowHtml('') + pollOptionRowHtml('');
            pollBackdrop.hidden = false;
        }
        function closePollModal() { pollBackdrop.hidden = true; }
        document.getElementById('poll-cancel-btn').addEventListener('click', closePollModal);
        pollBackdrop.addEventListener('click', (e) => { if (e.target === pollBackdrop) closePollModal(); });
        document.getElementById('poll-add-option').addEventListener('click', () => {
            const list = document.getElementById('poll-options-list');
            if (list.children.length >= 6) return showAlert('A poll can have up to 6 options.', 'info');
            list.insertAdjacentHTML('beforeend', pollOptionRowHtml(''));
        });
        document.getElementById('poll-submit-btn').addEventListener('click', async () => {
            const question = document.getElementById('poll-question-input').value.trim();
            const options = [...document.querySelectorAll('.poll-option-input')].map((el) => el.value.trim()).filter(Boolean);
            if (!question || options.length < 2) return showAlert('Add a question and at least 2 options.', 'error');
            closePollModal();
            const res = await fetch(`/api/assignments/${assignmentId}/messages`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ poll: { question, options }, replyToId: replyingToId || undefined }),
            });
            const data = await res.json();
            if (!data.success) return showAlert(data.error || 'Could not send poll.', 'error');
            cancelReplying();
            loadMessages();
        });
        document.getElementById('chat-body').addEventListener('click', async (e) => {
            const option = e.target.closest('.poll-option');
            if (!option) return;
            const res = await fetch(`/api/assignments/${assignmentId}/messages/${option.dataset.messageId}/poll-vote`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ optionId: Number(option.dataset.pollOption) }),
            });
            const data = await res.json();
            if (!data.success) return showAlert(data.error || 'Could not vote.', 'error');
            loadMessages(false);
        });

        // --- Location ---------------------------------------------------------
        // Only offered for in-person lessons (clip-location-btn stays hidden
        // otherwise, set in loadLessonStrip), and sent immediately rather than
        // staged in the composer - a location doesn't naturally pair with a
        // still-being-typed draft the way a photo or file does.
        function shareLocation() {
            if (!navigator.geolocation) return showAlert('Location is not supported in this browser.', 'error');
            showAlert('Getting your location…', 'info');
            navigator.geolocation.getCurrentPosition(async (position) => {
                const res = await fetch(`/api/assignments/${assignmentId}/messages`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ location: { lat: position.coords.latitude, lng: position.coords.longitude }, replyToId: replyingToId || undefined }),
                });
                const data = await res.json();
                if (!data.success) return showAlert(data.error || 'Could not share location.', 'error');
                cancelReplying();
                loadMessages();
            }, () => showAlert('Could not get your location. Check location permission.', 'error'));
        }

        // --- Header: more menu, search, select mode -----------------------
        const moreMenu = document.getElementById('chat-more-menu');
        const muteSubmenu = document.getElementById('chat-mute-submenu');
        function openMoreMenu() {
            closeMsgMenu(); closeReactPicker(); closeDeletePopover();
            const rect = document.getElementById('chat-more-btn').getBoundingClientRect();
            moreMenu.style.left = `${Math.max(8, rect.right - 220)}px`;
            moreMenu.style.top = `${rect.bottom + 6}px`;
            moreMenu.hidden = false;
        }
        function closeMoreMenu() { moreMenu.hidden = true; muteSubmenu.hidden = true; }
        document.getElementById('chat-more-btn').addEventListener('click', (e) => { e.stopPropagation(); moreMenu.hidden ? openMoreMenu() : closeMoreMenu(); });
        document.addEventListener('click', (e) => {
            if (!moreMenu.hidden && !e.target.closest('#chat-more-menu') && !e.target.closest('#chat-more-btn')) closeMoreMenu();
        });

        function refreshMoreMenuState() {
            document.getElementById('chat-favorite-icon').className = threadPrefs.favorite ? 'fa-solid fa-star' : 'fa-regular fa-star';
            document.getElementById('chat-favorite-label').textContent = threadPrefs.favorite ? 'Remove from Favorite' : 'Add to Favorite';
            document.getElementById('chat-mute-label').textContent = threadPrefs.muted ? 'Muted (tap to unmute)' : 'Notifications';
            document.getElementById('chat-block-label').textContent = threadPrefs.blocked ? 'Unblock' : 'Block';
        }

        document.getElementById('chat-mute-toggle').addEventListener('click', (e) => {
            e.stopPropagation();
            if (threadPrefs.muted) { setThreadMute(null); return; }
            const rect = e.currentTarget.getBoundingClientRect();
            muteSubmenu.style.left = `${rect.right + 4}px`;
            muteSubmenu.style.top = `${rect.top}px`;
            muteSubmenu.hidden = !muteSubmenu.hidden;
        });
        muteSubmenu.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-mute]');
            if (!btn) return;
            setThreadMute(btn.dataset.mute);
        });
        async function setThreadMute(duration) {
            closeMoreMenu();
            const res = await fetch(`/api/threads/assignment/${assignmentId}/mute`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ duration }) }).then((r) => r.json());
            if (!res.success) return showAlert(res.error || 'Could not update notifications.', 'error');
            threadPrefs.muted = Boolean(res.muted);
            showAlert(duration ? 'Notifications muted.' : 'Notifications unmuted.', 'success');
            refreshMoreMenuState();
        }

        function quoteSnippetPlain(m) {
            if (!m || m.deleted) return '';
            if (m.text) return m.text;
            if (m.attachment) return `[${m.attachment.kind || 'file'}]`;
            if (m.poll) return `[Poll: ${m.poll.question}]`;
            if (m.location) return '[Location]';
            return '';
        }

        moreMenu.addEventListener('click', async (e) => {
            const btn = e.target.closest('button[data-more]');
            if (!btn) return;
            const action = btn.dataset.more;
            if (action === 'mute-toggle') return; // handled above
            closeMoreMenu();
            if (action === 'search') { openSearch(); }
            else if (action === 'select') { enterSelectMode(); }
            else if (action === 'favorite') {
                const res = await fetch(`/api/threads/assignment/${assignmentId}/favorite`, { method: 'POST' }).then((r) => r.json());
                if (!res.success) return showAlert(res.error || 'Could not update favorite.', 'error');
                threadPrefs.favorite = res.favorite;
                refreshMoreMenuState();
                showAlert(res.favorite ? 'Added to favorites.' : 'Removed from favorites.', 'success');
            } else if (action === 'export') {
                exportChatTranscript();
            } else if (action === 'close') {
                window.location.href = '/messages';
            } else if (action === 'send-call-link') {
                const link = currentAssignmentRecord && currentAssignmentRecord.meetingLink;
                if (!link) return showAlert('Set a meeting link first using the call icon.', 'info');
                const res = await fetch(`/api/assignments/${assignmentId}/messages`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: `📹 Join our call: ${link}` }) }).then((r) => r.json());
                if (!res.success) return showAlert(res.error || 'Could not send call link.', 'error');
                loadMessages();
            } else if (action === 'report') {
                document.getElementById('report-reason-input').value = '';
                document.getElementById('report-modal-backdrop').hidden = false;
            } else if (action === 'block') {
                const verb = threadPrefs.blocked ? 'unblock' : 'block';
                if (!confirm(`Are you sure you want to ${verb} this person?`)) return;
                const res = await fetch(`/api/threads/assignment/${assignmentId}/block`, { method: 'POST' }).then((r) => r.json());
                if (!res.success) return showAlert(res.error || 'Could not update block status.', 'error');
                threadPrefs.blocked = res.blocked;
                refreshMoreMenuState();
                showAlert(res.blocked ? 'Blocked.' : 'Unblocked.', 'success');
            } else if (action === 'clear') {
                if (!confirm('Clear this chat? This removes all messages for you only.')) return;
                const res = await fetch(`/api/threads/assignment/${assignmentId}/clear`, { method: 'POST' }).then((r) => r.json());
                if (!res.success) return showAlert(res.error || 'Could not clear chat.', 'error');
                loadMessages();
            } else if (action === 'delete-chat') {
                if (!confirm('Delete this chat? It will disappear from your messages list until a new message arrives.')) return;
                const res = await fetch(`/api/threads/assignment/${assignmentId}/delete`, { method: 'POST' }).then((r) => r.json());
                if (!res.success) return showAlert(res.error || 'Could not delete chat.', 'error');
                window.location.href = '/messages';
            }
        });

        document.getElementById('report-cancel-btn').addEventListener('click', () => { document.getElementById('report-modal-backdrop').hidden = true; });
        document.getElementById('report-modal-backdrop').addEventListener('click', (e) => { if (e.target.id === 'report-modal-backdrop') e.target.hidden = true; });
        document.getElementById('report-submit-btn').addEventListener('click', async () => {
            const reason = document.getElementById('report-reason-input').value.trim();
            if (!reason) return showAlert('Tell us what happened.', 'error');
            document.getElementById('report-modal-backdrop').hidden = true;
            const res = await fetch('/api/reports', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ threadKey: `assignment:${assignmentId}`, reason }) }).then((r) => r.json());
            if (!res.success) return showAlert(res.error || 'Could not submit report.', 'error');
            showAlert('Report submitted. Our team will review it.', 'success');
        });

        function exportChatTranscript() {
            const lines = currentMessages.map((m) => {
                const who = m.senderRole === myRole ? 'You' : (m.senderRole === 'tutor' ? 'Tutor' : 'Student');
                const when = new Date(m.createdAt).toLocaleString();
                return `[${when}] ${who}: ${quoteSnippetPlain(m) || '(no content)'}`;
            });
            const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `chat-${assignmentId}.txt`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        // --- Search within this conversation -------------------------------
        function openSearch() {
            searchModeOn = true;
            document.getElementById('chat-header-row').classList.add('hidden');
            document.getElementById('chat-search-bar').classList.remove('hidden');
            document.getElementById('chat-search-bar').classList.add('flex');
            document.getElementById('chat-search-input').value = '';
            document.getElementById('chat-search-input').focus();
            searchMatches = []; searchIndex = -1;
            document.getElementById('chat-search-count').textContent = '';
        }
        function closeSearch() {
            searchModeOn = false;
            document.getElementById('chat-header-row').classList.remove('hidden');
            document.getElementById('chat-search-bar').classList.add('hidden');
            document.getElementById('chat-search-bar').classList.remove('flex');
            document.querySelectorAll('.msg-row.search-match').forEach((row) => row.classList.remove('search-match', 'search-current'));
        }
        document.getElementById('chat-search-close').addEventListener('click', closeSearch);
        function runSearch() {
            const query = document.getElementById('chat-search-input').value.trim().toLowerCase();
            document.querySelectorAll('.msg-row.search-match').forEach((row) => row.classList.remove('search-match', 'search-current'));
            if (!query) { searchMatches = []; searchIndex = -1; document.getElementById('chat-search-count').textContent = ''; return; }
            searchMatches = currentMessages.filter((m) => !m.deleted && (m.text || '').toLowerCase().includes(query));
            searchMatches.forEach((m) => { const row = document.querySelector(`.msg-row[data-id="${m.id}"]`); if (row) row.classList.add('search-match'); });
            searchIndex = searchMatches.length ? searchMatches.length - 1 : -1;
            showSearchMatch();
        }
        function showSearchMatch() {
            document.querySelectorAll('.msg-row.search-current').forEach((row) => row.classList.remove('search-current'));
            if (searchIndex < 0 || !searchMatches[searchIndex]) { document.getElementById('chat-search-count').textContent = searchMatches.length ? '' : 'No matches'; return; }
            document.getElementById('chat-search-count').textContent = `${searchIndex + 1} of ${searchMatches.length}`;
            const row = document.querySelector(`.msg-row[data-id="${searchMatches[searchIndex].id}"]`);
            if (row) { row.classList.add('search-current'); row.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        }
        document.getElementById('chat-search-input').addEventListener('input', runSearch);
        document.getElementById('chat-search-prev').addEventListener('click', () => { if (!searchMatches.length) return; searchIndex = (searchIndex - 1 + searchMatches.length) % searchMatches.length; showSearchMatch(); });
        document.getElementById('chat-search-next').addEventListener('click', () => { if (!searchMatches.length) return; searchIndex = (searchIndex + 1) % searchMatches.length; showSearchMatch(); });

        // --- Select messages mode -------------------------------------------
        function enterSelectMode() {
            selectModeOn = true;
            selectedMessageIds = new Set();
            document.getElementById('chat-header-row').classList.add('hidden');
            document.getElementById('chat-select-bar').classList.remove('hidden');
            document.getElementById('chat-select-bar').classList.add('flex');
            document.getElementById('chat-body').classList.add('select-mode');
            updateSelectCount();
        }
        function exitSelectMode() {
            selectModeOn = false;
            selectedMessageIds = new Set();
            document.getElementById('chat-header-row').classList.remove('hidden');
            document.getElementById('chat-select-bar').classList.add('hidden');
            document.getElementById('chat-select-bar').classList.remove('flex');
            document.getElementById('chat-body').classList.remove('select-mode');
            document.querySelectorAll('.msg-row.selected').forEach((row) => row.classList.remove('selected'));
        }
        function updateSelectCount() {
            document.getElementById('chat-select-count').textContent = `${selectedMessageIds.size} selected`;
        }
        document.getElementById('chat-select-cancel').addEventListener('click', exitSelectMode);
        document.getElementById('chat-select-delete').addEventListener('click', async () => {
            if (!selectedMessageIds.size) return;
            if (!confirm(`Delete ${selectedMessageIds.size} message(s) for you?`)) return;
            await Promise.all([...selectedMessageIds].map((id) => fetch(`/api/assignments/${assignmentId}/messages/${id}/delete-for-me`, { method: 'POST' })));
            exitSelectMode();
            loadMessages(false);
        });
        document.getElementById('chat-body').addEventListener('click', (e) => {
            if (!selectModeOn) return;
            const row = e.target.closest('.msg-row');
            if (!row) return;
            const id = row.dataset.id;
            if (selectedMessageIds.has(id)) { selectedMessageIds.delete(id); row.classList.remove('selected'); }
            else { selectedMessageIds.add(id); row.classList.add('selected'); }
            updateSelectCount();
        }, true);

        // Emoji picker
        const EMOJI = ['😀','😃','😄','😁','😊','🙂','😉','😍','🥰','😘','😎','🤩','🤔','🙃','😅','😂','🤣','🥲','😢','😭','😤','😳','🥳','🤗','🙌','👏','👍','👎','🙏','💪','👋','🤝','❤️','🧡','💛','💚','💙','💜','🔥','✨','⭐','🎵','🎶','🎹','🎸','🥁','🎤','🎧','🎻','🎺','🎷','📀','⏰','✅','❌','❓','❗','💯','🎉','🎊','📝','📚'];
        const emojiPanel = document.getElementById('emoji-panel');
        emojiPanel.innerHTML = EMOJI.map((e) => `<button type="button">${e}</button>`).join('');
        emojiPanel.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const pos = input.selectionStart ?? input.value.length;
            input.value = input.value.slice(0, pos) + btn.textContent + input.value.slice(input.selectionEnd ?? pos);
            input.focus();
            input.selectionStart = input.selectionEnd = pos + btn.textContent.length;
            refreshSendButton(); autoGrow();
        });
        document.getElementById('emoji-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            emojiPanel.classList.toggle('hidden');
        });
        document.addEventListener('click', (e) => {
            if (emojiPanel.classList.contains('hidden')) return;
            if (emojiPanel.contains(e.target) || e.target.closest('#emoji-btn')) return;
            emojiPanel.classList.add('hidden');
        });

        // --- Voice notes -------------------------------------------------
        // Three composer modes (idle/recording/ready), matching the mobile
        // app: record with pause/resume, review the clip before sending
        // (not auto-sent the moment recording stops), then send from the
        // same send button the idle composer uses - its icon swaps
        // mic -> check -> paper-plane rather than a separate bar/button
        // underneath the composer.
        let recorder = null;
        let recChunks = [];
        let recTimer = null;
        let recSeconds = 0;
        let recPaused = false;
        let readyBlob = null;

        function setComposerMode(mode) {
            composerMode = mode;
            document.getElementById('clip-btn').hidden = mode !== 'idle';
            document.getElementById('rec-cancel').hidden = mode !== 'recording';
            document.getElementById('rec-discard').hidden = mode !== 'ready';
            document.getElementById('composer-bar').hidden = mode !== 'idle';
            document.getElementById('recording-row').hidden = mode !== 'recording';
            document.getElementById('ready-row').hidden = mode !== 'ready';
            if (mode === 'idle') { refreshSendButton(); return; }
            if (mode === 'recording') { sendIcon.className = 'fa-solid fa-check'; sendBtn.title = 'Finish recording'; return; }
            sendIcon.className = 'fa-solid fa-paper-plane'; sendBtn.title = 'Send voice note';
        }
        function tickRecordingTime() {
            recSeconds += 1;
            const m = Math.floor(recSeconds / 60);
            const s = String(recSeconds % 60).padStart(2, '0');
            document.getElementById('rec-time').textContent = `${m}:${s}`;
        }

        async function startRecording() {
            if (!navigator.mediaDevices || !window.MediaRecorder) {
                return showAlert('Voice notes are not supported in this browser.', 'error');
            }
            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (e) {
                return showAlert('Microphone permission is needed for voice notes.', 'error');
            }
            recChunks = []; recSeconds = 0; recPaused = false;
            recorder = new MediaRecorder(stream);
            recorder.ondataavailable = (e) => { if (e.data.size) recChunks.push(e.data); };
            recorder.onstop = () => stream.getTracks().forEach((t) => t.stop());
            recorder.start();

            document.getElementById('rec-time').textContent = '0:00';
            document.getElementById('rec-dot').hidden = false;
            document.getElementById('rec-hint').textContent = 'Recording voice note…';
            document.getElementById('rec-pause').innerHTML = '<i class="fa-solid fa-pause"></i>';
            setComposerMode('recording');
            recTimer = setInterval(tickRecordingTime, 1000);
        }

        function togglePauseRecording() {
            if (!recorder) return;
            if (recPaused) {
                recorder.resume(); recPaused = false;
                document.getElementById('rec-pause').innerHTML = '<i class="fa-solid fa-pause"></i>';
                document.getElementById('rec-dot').hidden = false;
                document.getElementById('rec-hint').textContent = 'Recording voice note…';
                recTimer = setInterval(tickRecordingTime, 1000);
            } else {
                recorder.pause(); recPaused = true;
                clearInterval(recTimer);
                document.getElementById('rec-pause').innerHTML = '<i class="fa-solid fa-play"></i>';
                document.getElementById('rec-dot').hidden = true;
                document.getElementById('rec-hint').textContent = 'Paused';
            }
        }

        function cancelRecording() {
            if (!recorder) return;
            clearInterval(recTimer);
            recorder.stop();
            recorder = null; recChunks = []; recPaused = false;
            setComposerMode('idle');
        }

        async function finishRecording() {
            if (!recorder) return;
            clearInterval(recTimer);
            const done = new Promise((resolve) => { recorder.addEventListener('stop', resolve, { once: true }); });
            recorder.stop();
            await done;
            const blob = new Blob(recChunks, { type: recorder.mimeType || 'audio/webm' });
            const durationSeconds = recSeconds;
            recorder = null; recChunks = []; recPaused = false;
            if (!blob.size) { setComposerMode('idle'); return; }
            readyBlob = blob;
            const m = Math.floor(durationSeconds / 60);
            const s = String(durationSeconds % 60).padStart(2, '0');
            document.getElementById('ready-hint').textContent = `Voice note · ${m}:${s}`;
            setComposerMode('ready');
        }

        function discardReady() { readyBlob = null; setComposerMode('idle'); }

        async function sendReady() {
            if (!readyBlob) return;
            const blob = readyBlob; readyBlob = null;
            const ext = (blob.type.split('/')[1] || 'webm').split(';')[0];
            await uploadFile(new File([blob], `voice-note.${ext}`, { type: blob.type }));
            setComposerMode('idle');
            document.getElementById('compose-form').requestSubmit();
        }

        document.getElementById('rec-cancel').addEventListener('click', cancelRecording);
        document.getElementById('rec-discard').addEventListener('click', discardReady);
        document.getElementById('rec-pause').addEventListener('click', togglePauseRecording);

        document.getElementById('compose-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (composerMode === 'recording') return finishRecording();
            if (composerMode === 'ready') return sendReady();
            const text = input.value.trim();

            if (editingMessageId) {
                if (!text) return showAlert('Message text is required.', 'error');
                const editId = editingMessageId;
                const res = await fetch(`/api/assignments/${assignmentId}/messages/${editId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text }),
                });
                const data = await res.json();
                if (data.success) {
                    cancelEditingMessage();
                    loadMessages(false);
                } else {
                    showAlert(data.error || 'Could not save the edit.', 'error');
                }
                return;
            }

            // Nothing typed and nothing attached: the button is a mic, so
            // this press starts a voice note instead of sending.
            if (!text && !pendingAttachment && !pickedLibraryItem) return startRecording();

            const res = await fetch(`/api/assignments/${assignmentId}/messages`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    text,
                    libraryItemId: pickedLibraryItem ? pickedLibraryItem.id : null,
                    attachment: pendingAttachment,
                    replyToId: replyingToId || undefined,
                }),
            });
            const data = await res.json();
            if (data.success) {
                input.value = '';
                input.style.height = 'auto';
                pickedLibraryItem = null;
                pendingAttachment = null;
                cancelReplying();
                showAttachPreview();
                refreshSendButton();
                emojiPanel.classList.add('hidden');
                loadMessages();
            } else {
                showAlert(data.error || 'Could not send message.', 'error');
            }
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('compose-form').requestSubmit();
            }
        });

        refreshSendButton();

        // --- Real-time delivery -----------------------------------------
        // The socket only pushes messages that the REST layer already saved,
        // so this is purely about latency. A slow poll stays running as a
        // safety net for a dropped/blocked socket, which is why a missed
        // push still surfaces within a few seconds instead of never.
        let socket = null;
        let reconnectDelay = 1000;
        let typingTimer = null;

        function showTyping(name, isTyping) {
            const el = document.getElementById('typing-indicator');
            if (!el) return;
            el.textContent = isTyping ? `${name || 'They'} is typing…` : '';
            el.classList.toggle('hidden', !isTyping);
        }

        function connectSocket() {
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${proto}//${window.location.host}/ws/chat`);

            socket.addEventListener('open', () => {
                reconnectDelay = 1000;
                socket.send(JSON.stringify({ type: 'join', assignmentId: Number(assignmentId) }));
            });

            socket.addEventListener('message', (event) => {
                let msg;
                try { msg = JSON.parse(event.data); } catch { return; }
                if ((msg.type === 'message' || msg.type === 'message_edited' || msg.type === 'message_deleted' || msg.type === 'message_pinned' || msg.type === 'message_reacted' || msg.type === 'message_poll_vote') && String(msg.assignmentId) === String(assignmentId)) {
                    // Re-fetch rather than patching the pushed object in: that
                    // keeps read-receipts/ordering owned by the server and
                    // avoids rendering a duplicate of a message we just sent,
                    // and covers edits/deletes/pins the same way as new sends.
                    loadMessages(msg.type === 'message');
                } else if (msg.type === 'typing') {
                    showTyping(msg.name, msg.isTyping);
                    clearTimeout(typingTimer);
                    if (msg.isTyping) typingTimer = setTimeout(() => showTyping('', false), 4000);
                }
            });

            // Exponential backoff, capped, so a server restart reconnects
            // quickly but a sustained outage doesn't hammer it.
            socket.addEventListener('close', () => {
                setTimeout(connectSocket, reconnectDelay);
                reconnectDelay = Math.min(reconnectDelay * 2, 30000);
            });
            socket.addEventListener('error', () => { try { socket.close(); } catch (e) { /* already closing */ } });
        }

        let lastTypingSent = 0;
        document.getElementById('message-input').addEventListener('input', () => {
            if (!socket || socket.readyState !== WebSocket.OPEN) return;
            const now = Date.now();
            if (now - lastTypingSent < 1500) return; // throttle
            lastTypingSent = now;
            socket.send(JSON.stringify({ type: 'typing', isTyping: true, name: myName }));
        });

        async function init() {
            const requestedName = new URLSearchParams(window.location.search).get('name');
            if (requestedName) {
                const conversations = await fetch('/api/conversations').then((response) => response.json());
                const match = (conversations.conversations || []).find((conversation) => String(conversation.name || '').toLowerCase() === requestedName.toLowerCase());
                if (!match) { window.location.href = '/messages'; return; }
                assignmentId = String(match.assignmentId);
            }
            await loadCounterpart();
            await loadMessages();
            loadLessonStrip();
            connectSocket();
            // Fallback only - the socket handles the live case.
            // Deployments that do not pass WebSocket upgrades need a quicker
            // HTTP fallback, while connected sessions avoid redundant polls.
            setInterval(() => {
                if (!document.hidden && (!socket || socket.readyState !== WebSocket.OPEN)) loadMessages(false);
            }, 4000);
            // Picks up a lesson scheduled or a recording posted from the
            // tutor dashboard while this thread is already open.
            setInterval(() => { if (!document.hidden) loadLessonStrip(); }, 30000);
        }
        init();
    </script>
