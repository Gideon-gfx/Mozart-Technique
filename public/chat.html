<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Mozart Techniques</title>
    <link rel="shortcut icon" href="/mozartLogo.jpg" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { 'primary-red': '#cc0000', 'primary-dark': '#1F2937' } } }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/redesign.css">
    <link rel="stylesheet" href="/assets/site.css">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: linear-gradient(135deg, #ffffff 0%, #f8f8f8 100%); }
        .chat-body { height: calc(100vh - 290px); min-height: 260px; }

        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .brand img { width: 36px; height: 36px; border-radius: 12px; object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .brand span { font-family: 'Science Gothic', sans-serif; font-weight: 700; font-size: 1.15rem; color: #333; letter-spacing: .03em; }

        /* In-page camera. A file input's capture attribute only does
           anything on mobile - desktop browsers ignore it and fall back to a
           file picker, which is why "take a photo" appeared to do nothing.
           getUserMedia works on both. */
        .cam-modal {
            position: fixed; inset: 0; z-index: 80;
            background: rgba(0,0,0,.75);
            display: grid; place-items: center;
            padding: 16px;
        }
        .cam-inner { background: #111; border-radius: 16px; overflow: hidden; max-width: 460px; width: 100%; }
        .cam-inner video { width: 100%; display: block; background: #000; max-height: 60vh; }
        .cam-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; }
        .cam-actions button { border: none; background: none; color: #ddd; font-size: .85rem; font-weight: 600; cursor: pointer; }
        .cam-shutter {
            width: 52px; height: 52px; border-radius: 999px;
            background: #cc0000; color: #fff !important; font-size: 1.05rem !important;
            display: grid; place-items: center;
        }

        /* Bubbles hug their text: just enough padding to clear the glyphs,
           with the timestamp inline at the end of the last line rather than
           on its own row, which is what made them look oversized. */
        .bubble {
            max-width: min(62%, 520px);
            overflow-wrap: anywhere;
            word-break: break-word;
            padding: 6px 12px;
            /* Fully curved on every corner - a short message reads as a
               pill, a long one keeps the same soft edge as it wraps. */
            border-radius: 18px;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.35;
        }
        .bubble.bg-primary-red, .bubble.bg-primary-red * { color: #fff !important; background-color: #cc0000 !important; }
        .bubble p { margin: 0; }
        .bubble .stamp {
            font-size: 9.5px;
            line-height: 1;
            margin-left: 6px;
            float: right;
            position: relative;
            top: 5px;
            opacity: .75;
            white-space: nowrap;
        }

        /* --- Composer -------------------------------------------------- */
        .composer {
            border-top: 1px solid #eee;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .composer-bar {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 0 6px;
            background: #f4f4f5;
            border: 1px solid #e6e6e8;
            border-radius: 999px;
        }
        .composer-input {
            flex: 1;
            min-width: 0;
            border: none;
            background: transparent;
            resize: none;
            outline: none;
            font-family: inherit;
            font-size: 13.5px;
            line-height: 1.35;
            padding: 8px 4px;
            max-height: 96px;
        }
        .composer-icon {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border: none;
            background: none;
            border-radius: 999px;
            color: #8a8a8f;
            font-size: 14px;
            cursor: pointer;
            transition: color .15s ease, background-color .15s ease;
        }
        .composer-icon:hover { color: #cc0000; background: rgba(204,0,0,.07); }
        .composer-send {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 999px;
            border: none;
            background: #cc0000;
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 14px;
            cursor: pointer;
            transition: background-color .15s ease, transform .1s ease;
        }
        .composer-send:hover { background: #a30000; }
        .composer-send:active { transform: scale(.94); }
        .composer-send.recording { background: #17130f; animation: recPulse 1.2s ease-in-out infinite; }
        @keyframes recPulse { 50% { opacity: .55; } }

        .emoji-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            padding: 8px 12px 10px;
            border-top: 1px solid #f0f0f0;
            max-height: 168px;
            overflow-y: auto;
        }
        .emoji-panel button {
            width: 32px; height: 32px;
            border: none; background: none;
            font-size: 19px; line-height: 1;
            border-radius: 8px; cursor: pointer;
        }
        .emoji-panel button:hover { background: #f2f2f2; }

        .attach-preview {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 12px;
            border-top: 1px solid #f0f0f0;
            font-size: 12px; color: #555;
        }
        .attach-preview img { width: 34px; height: 34px; object-fit: cover; border-radius: 6px; }
        .attach-preview .drop { margin-left: auto; border: none; background: none; color: #999; cursor: pointer; font-size: 14px; }

        .recording-bar {
            display: flex; align-items: center; gap: 9px;
            padding: 8px 12px;
            border-top: 1px solid #f0f0f0;
            font-size: 12.5px; color: #444;
        }
        .rec-dot { width: 9px; height: 9px; border-radius: 999px; background: #cc0000; animation: recPulse 1s ease-in-out infinite; }
        .rec-cancel, .rec-send { margin-left: auto; border: none; background: none; cursor: pointer; font-weight: 700; font-size: 12.5px; }
        .rec-cancel { color: #888; }
        .rec-send { color: #cc0000; margin-left: 0; }

        /* Attachments inside a bubble */
        .att-img { max-width: 200px; border-radius: 9px; display: block; margin-top: 3px; cursor: pointer; }
        .att-video { max-width: 220px; border-radius: 9px; display: block; margin-top: 3px; }
        .att-audio { height: 34px; margin-top: 3px; max-width: 210px; }
        .att-file {
            display: inline-flex; align-items: center; gap: 6px;
            margin-top: 3px; padding: 5px 8px;
            border-radius: 8px; background: rgba(0,0,0,.07);
            font-size: 12px; text-decoration: none;
        }
        .library-clip { display: block; width: min(100%, 320px); margin-top: 7px; border-radius: 10px; background: #111; }
        .library-clip-link { display: block; margin-top: 6px; font-size: 12px; font-weight: 700; overflow-wrap: anywhere; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="alert-box" class="fixed top-5 right-5 z-50 p-4 rounded-lg shadow-xl text-white font-medium max-w-sm opacity-0 transition-opacity duration-500" style="background-color:#222;">
        <span id="alert-message"></span>
    </div>

    <header class="sticky top-0 z-50 bg-white shadow-sm">
        <nav class="max-w-3xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16 gap-3">
            <a href="/home" class="brand">
                <img src="/mozartLogo.jpg" alt="Mozart Techniques logo">
                <span>Mozart Techniques</span>
            </a>
            <div class="flex items-center gap-3">
                <a href="/messages" class="text-sm font-semibold text-gray-500 hover:text-primary-red transition">Messages</a>
                <div id="auth-state"></div>
            </div>
        </nav>
    </header>

    <!-- Who you're talking to, directly above the thread -->
    <div class="max-w-3xl mx-auto px-4 sm:px-6 pt-4">
        <div class="flex items-center gap-3">
            <a href="/messages" title="Back to messages" class="text-gray-400 hover:text-primary-red transition shrink-0">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <img id="chat-avatar" src="/mozartLogo.jpg" alt="" class="w-9 h-9 rounded-full object-cover shrink-0">
            <div class="min-w-0">
                <p id="chat-name" class="font-bold text-gray-800 leading-tight truncate">Loading...</p>
                <p id="chat-subject" class="text-xs text-gray-400 truncate"></p>
            </div>
            <button id="chat-meeting-btn" type="button" title="Join or schedule meeting" class="hidden h-9 w-9 rounded-full bg-red-50 text-red-700 hover:bg-red-100"><i class="fa-solid fa-video"></i></button>
        </div>
    </div>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 py-4">
        <div class="bg-white rounded-2xl shadow-lg flex flex-col overflow-hidden">
            <!-- Lesson context for this thread: the next scheduled Meet and
                 any recordings posted, so both are reachable from the
                 conversation instead of only the dashboard. -->
            <div id="lesson-strip" class="hidden border-b border-gray-100 px-4 py-2.5 bg-[#fcfbfa] text-xs"></div>

            <div id="chat-body" class="chat-body overflow-y-auto p-4 space-y-3"></div>
            <p id="typing-indicator" class="hidden px-4 pb-1 text-xs text-gray-400 italic" aria-live="polite"></p>


            <form id="compose-form" class="composer">
                <!-- Slim pill bar: attachments live inside it, the mic/send
                     button sits outside on the right. -->
                <div class="composer-bar">
                    <button type="button" id="attach-doc-btn" title="Attach a document" class="composer-icon">
                        <i class="fa-regular fa-file-lines"></i>
                    </button>
                    <textarea id="message-input" rows="1" placeholder="Message" class="composer-input"></textarea>
                    <button type="button" id="emoji-btn" title="Emoji" class="composer-icon">
                        <i class="fa-regular fa-face-smile"></i>
                    </button>
                    <button type="button" id="attach-media-btn" title="Photo or video" class="composer-icon">
                        <i class="fa-solid fa-paperclip"></i>
                    </button>
                    <button type="button" id="tutor-library-btn" title="Tutor library" class="composer-icon hidden">
                        <i class="fa-solid fa-photo-film"></i>
                    </button>
                    <button type="button" id="camera-btn" title="Take a photo" class="composer-icon">
                        <i class="fa-solid fa-camera"></i>
                    </button>
                </div>
                <button type="submit" id="send-btn" title="Hold to record a voice note" class="composer-send">
                    <i id="send-icon" class="fa-solid fa-microphone"></i>
                </button>

                <!-- Hidden pickers driven by the buttons above -->
                <input type="file" id="doc-input" class="hidden" aria-hidden="true"
                       accept=".pdf,.doc,.docx,.txt,.rtf,.odt,.ppt,.pptx,.xls,.xlsx,.csv,.zip">
                <input type="file" id="media-input" class="hidden" aria-hidden="true" accept="image/*,video/*">
                <input type="file" id="camera-input" class="hidden" aria-hidden="true" accept="image/*" capture="environment">
            </form>

            <div id="tutor-library-panel" class="hidden border-t border-gray-100 bg-gray-50 p-3">
                <div class="mb-2 flex items-center justify-between gap-2"><p class="text-xs font-semibold text-gray-700">Choose a video to send</p><div class="flex gap-1"><button type="button" class="library-tab rounded-md bg-primary-red px-2 py-1 text-xs font-semibold text-white" data-library-tab="mine">My library</button><button type="button" class="library-tab rounded-md border border-gray-200 bg-white px-2 py-1 text-xs font-semibold text-gray-600" data-library-tab="mozart">Mozart library</button></div></div><input id="tutor-library-search" type="search" placeholder="Search this library" class="mb-2 w-full rounded-lg border border-gray-200 bg-white px-3 py-2 text-xs">
                <div id="tutor-library-items" class="grid gap-2"></div>
            </div>

            <div id="emoji-panel" class="emoji-panel hidden"></div>
            <div id="attach-preview" class="attach-preview hidden"></div>
            <div id="recording-bar" class="recording-bar hidden">
                <span class="rec-dot"></span>
                <span>Recording <span id="rec-time">0:00</span></span>
                <button type="button" id="rec-cancel" class="rec-cancel">Cancel</button>
                <button type="button" id="rec-send" class="rec-send">Send</button>
            </div>
        </div>
    </main>

    <script>
        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');
        function showAlert(message, type = 'info') {
            alertMessage.textContent = message;
            alertBox.style.backgroundColor = type === 'error' ? '#B91C1C' : type === 'success' ? '#059669' : '#1F2937';
            alertBox.style.opacity = '1';
            setTimeout(() => { alertBox.style.opacity = '0'; }, 4000);
        }
        
        // Set back button based on user role
        fetch('/api/session')
            .then((r) => r.json())
            .then((d) => {
                const backBtn = document.querySelector('a[href="/messages"]');
                if (backBtn && d.user && d.user.role === 'tutor') {
                    backBtn.href = '/tutor';
                    backBtn.title = 'Back to tutor dashboard';
                }
            })
            .catch(() => { /* fallback to /messages */ });
        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        const assignmentId = window.location.pathname.split('/').filter(Boolean).pop();
        let myRole = null;
        let myName = '';
        let lastMessageId = 0;
        let pickedLibraryItem = null;
        let libraryPickerItems = { mine: [], mozart: [] };
        let libraryPickerTab = 'mine';
        function renderTutorLibraryPicker() {
            const host = document.getElementById('tutor-library-items');
            const query = document.getElementById('tutor-library-search').value.trim().toLowerCase();
            const items = (libraryPickerItems[libraryPickerTab] || []).filter((item) => !query || `${item.title || ''} ${item.category || ''} ${item.description || ''}`.toLowerCase().includes(query));
            host.innerHTML = items.length ? items.map((item) => `<button type="button" class="text-left rounded-lg border border-gray-200 bg-white p-2 hover:border-primary-red" data-library-id="${item.id}"><strong class="block text-sm">${escapeHtml(item.title)}</strong><span class="text-xs text-gray-500">${escapeHtml(item.category || 'All courses')}</span></button>`).join('') : '<p class="text-xs text-gray-400">No matching videos in this library.</p>';
            host.querySelectorAll('[data-library-id]').forEach((button) => button.addEventListener('click', () => { pickedLibraryItem = (libraryPickerItems[libraryPickerTab] || []).find((item) => String(item.id) === button.dataset.libraryId); document.getElementById('tutor-library-panel').classList.add('hidden'); refreshSendButton(); showAlert(`Selected ${pickedLibraryItem.title}`, 'success'); }));
        }
        async function loadTutorLibraryPicker() {
            if (myRole !== 'tutor') return;
            const [mineRes, mozartRes] = await Promise.all([fetch(`/api/tutor-library/${assignmentId}`), fetch('/api/library')]);
            const [mineData, mozartData] = await Promise.all([mineRes.json(), mozartRes.json()]);
            libraryPickerItems = { mine: mineData.success ? (mineData.items || []) : [], mozart: mozartData.success ? (mozartData.items || []) : [] };
            const search = document.getElementById('tutor-library-search');
            if (!search.dataset.bound) { search.addEventListener('input', renderTutorLibraryPicker); search.dataset.bound = 'true'; }
            document.querySelectorAll('.library-tab').forEach((button) => { button.onclick = () => { libraryPickerTab = button.dataset.libraryTab; document.querySelectorAll('.library-tab').forEach((tab) => tab.className = `library-tab rounded-md px-2 py-1 text-xs font-semibold ${tab === button ? 'bg-primary-red text-white' : 'border border-gray-200 bg-white text-gray-600'}`); renderTutorLibraryPicker(); }; });
            renderTutorLibraryPicker();
        }
        // Own display name, used only to label the typing indicator on the
        // other side ("Gideon is typing…").
        fetch('/api/session')
            .then((r) => r.json())
            .then((d) => { if (d.user) myName = (d.user.name || '').split(' ')[0]; })
            .catch(() => { /* indicator falls back to "They" */ });

        // Pulls the scheduled Meet + posted recordings for this assignment
        // from the same feed the dashboard uses, so the two never disagree.
        async function loadLessonStrip() {
            const strip = document.getElementById('lesson-strip');
            if (!strip) return;
            let data;
            try { data = await fetch('/api/my-assignments').then((r) => r.json()); } catch (e) { return; }
            if (!data.success) return;
            const studentRecord = (data.asStudent || []).find((r) => String(r.id) === String(assignmentId));
            const tutorRecord = (data.asTutor || []).find((r) => String(r.id) === String(assignmentId));
            const record = studentRecord || tutorRecord;
            if (!record) return;
            const meetingButton = document.getElementById('chat-meeting-btn');
            const meetingHasPassed = record.scheduledAt && new Date(record.scheduledAt).getTime() < Date.now();
            meetingButton.classList.toggle('hidden', Boolean(meetingHasPassed));
            meetingButton.onclick = () => { if (record.meetingLink && !meetingHasPassed) window.location.href = record.meetingLink; else if (tutorRecord && !meetingHasPassed) window.location.href = `/schedule?assignment=${assignmentId}`; else showAlert('This scheduled meeting has ended.', 'info'); };
            const parts = [];
            if (record.scheduledAt) {
                const when = new Date(record.scheduledAt);
                const past = when.getTime() < Date.now() - 60 * 60 * 1000;
                parts.push(`
                    <div class="flex items-center gap-2 flex-wrap">
                        <i class="fa-regular fa-calendar text-primary-red"></i>
                        <span class="${past ? 'text-gray-400' : 'text-gray-700 font-semibold'}">${past ? 'Last lesson' : 'Next lesson'}: ${when.toLocaleString()}</span>
                        ${record.meetingLink && !past
                            ? `<a href="${escapeHtml(record.meetingLink)}" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-primary-red text-white font-semibold"><i class="fa-solid fa-video"></i> Join</a>`
                            : ''}
                    </div>`);
            } else if (record.meetingLink) {
                parts.push(`
                    <div class="flex items-center gap-2 flex-wrap">
                        <i class="fa-solid fa-video text-primary-red"></i>
                        <a href="${escapeHtml(record.meetingLink)}" class="text-primary-red font-semibold hover:underline">Join meeting</a>
                    </div>`);
            }

            if (tutorRecord && tutorRecord.status === 'active') {
                if (tutorRecord.lessonStartedAt) {
                    parts.push(`<div class="inline-flex flex-wrap items-center gap-2"><button type="button" id="end-chat-lesson" class="inline-flex items-center gap-2 rounded-lg bg-primary-red px-3 py-2 text-xs font-bold text-white"><i class="fa-solid fa-stopwatch"></i>End lesson & send bill</button><span class="text-xs font-semibold text-emerald-700">Lesson in progress</span></div>`);
                } else {
                    parts.push(`<button type="button" id="start-chat-lesson" class="inline-flex items-center gap-2 rounded-lg bg-primary-red px-3 py-2 text-xs font-bold text-white"><i class="fa-solid fa-play"></i>Start lesson</button>`);
                }
            }
            const recs = record.recordings || [];
            if (recs.length) {
                parts.push(`
                    <div class="flex items-start gap-2 flex-wrap mt-1">
                        <i class="fa-solid fa-film text-gray-400 mt-0.5"></i>
                        <span class="text-gray-500">Recordings:</span>
                        ${recs.map((v) => `<a href="${escapeHtml(v.url)}" class="text-primary-red hover:underline">${escapeHtml(v.title)}</a>`).join('<span class="text-gray-300">·</span>')}
                    </div>`);
            }

            const pendingBills = (record.sessions || []).filter((session) => session.paymentStatus === 'held');
            if (pendingBills.length) {
                parts.push(`<div class="mt-2 rounded-xl border border-amber-200 bg-amber-50 p-3 text-sm text-amber-950"><p class="font-bold"><i class="fa-solid fa-receipt mr-1"></i>Lesson payment</p>${pendingBills.map((session) => `<div class="mt-2 flex flex-wrap items-center justify-between gap-2"><span>${session.durationMinutes} minutes · <strong>$${Number(session.totalUsd || 0).toFixed(2)}</strong> awaiting confirmation</span>${studentRecord && studentRecord.sponsoredBy ? `<span class="text-xs font-semibold">Paid by ${escapeHtml(studentRecord.sponsoredBy.orgName)}</span>` : studentRecord ? `<button type="button" class="confirm-chat-bill px-3 py-1.5 rounded-lg bg-primary-red text-white text-xs font-bold" data-session-id="${session.id}">Confirm class & pay</button>` : '<span class="text-xs">Waiting for student</span>'}</div>`).join('')}</div>`);
            }

            strip.innerHTML = parts.join('');
            strip.classList.toggle('hidden', parts.length === 0);
            strip.querySelectorAll('.confirm-chat-bill').forEach((button) => {
                button.addEventListener('click', async () => {
                    button.disabled = true;
                    const response = await fetch(`/api/assignments/${assignmentId}/sessions/${button.dataset.sessionId}/confirm`, { method: 'POST' });
                    const result = await response.json();
                    if (!result.success) { button.disabled = false; showAlert(result.error || 'Could not confirm payment.', 'error'); return; }
                    if (result.redirectToCheckout && result.checkoutUrl) { window.location.href = result.checkoutUrl; return; }
                    showAlert('Class confirmed and payment released.', 'success');
                    loadLessonStrip();
                });
            });
            document.getElementById('start-chat-lesson')?.addEventListener('click', async (event) => {
                const button = event.currentTarget;
                button.disabled = true;
                button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Starting…';
                const response = await fetch(`/api/assignments/${assignmentId}/lesson-start`, { method: 'POST' });
                const result = await response.json();
                if (!result.success) { button.disabled = false; button.innerHTML = '<i class="fa-solid fa-play"></i>Start lesson'; showAlert(result.error || 'Could not start lesson.', 'error'); return; }
                showAlert('Lesson started. End it when the class finishes to send the bill.', 'success');
                loadLessonStrip();
            });
            document.getElementById('end-chat-lesson')?.addEventListener('click', async (event) => {
                const button = event.currentTarget;
                button.disabled = true;
                button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Preparing bill…';
                const response = await fetch(`/api/assignments/${assignmentId}/sessions`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) });
                const result = await response.json();
                if (!result.success) { button.disabled = false; button.innerHTML = '<i class="fa-solid fa-stopwatch"></i>End lesson & send bill'; showAlert(result.error || 'Could not end lesson.', 'error'); return; }
                showAlert(`Bill sent: ${result.session.durationMinutes} minutes — $${result.session.totalUsd}.`, 'success');
                loadLessonStrip();
            });
        }

        // Uses the same conversations feed as /messages, so the name, photo
        // and subject shown here match the list exactly.
        async function loadCounterpart() {
            let data;
            try { data = await fetch('/api/conversations').then((r) => r.json()); } catch (e) { return; }
            if (!data.success) return;
            const convo = (data.conversations || []).find((c) => String(c.assignmentId) === String(assignmentId));
            if (!convo) return;
            document.getElementById('chat-name').textContent = convo.name || 'Conversation';
            document.getElementById('chat-subject').textContent = `${convo.category || ''}${convo.lessonType ? ' · ' + convo.lessonType : ''}`;
            const avatar = document.getElementById('chat-avatar');
            if (convo.photoUrl) avatar.src = convo.photoUrl;
            else avatar.style.display = 'none';
            return convo.category;
        }

        function linkifyHtml(text) {
            const safe = escapeHtml(String(text || ''));
            return safe.replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi, (match) => {
                const href = match.startsWith('http') ? match : `https://${match}`;
                return `<a href="${escapeHtml(href)}" class="underline decoration-inherit hover:opacity-80">${escapeHtml(match)}</a>`;
            });
        }

        function messageBubbleHtml(m) {
            const mine = m.senderRole === myRole;
            const clip = m.libraryItem ? (() => {
                const mediaUrl = escapeHtml(m.libraryItem.url);
                const libraryUrl = escapeHtml(m.libraryItem.href || `/library?item=${encodeURIComponent(String(m.libraryItem.title || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''))}`);
                const isVideo = /\.(mp4|webm|ogg|mov|m4v|m3u8)(?:[?#]|$)/i.test(m.libraryItem.url || '');
                const youtube = (m.libraryItem.url || '').match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]{11})/i);
                const vimeo = (m.libraryItem.url || '').match(/vimeo\.com\/(?:video\/)?(\d+)/i);
                const player = isVideo
                    ? `<video src="${mediaUrl}" controls preload="metadata" class="library-clip"></video>`
                    : youtube
                        ? `<iframe src="https://www.youtube-nocookie.com/embed/${youtube[1]}" title="${escapeHtml(m.libraryItem.title)}" class="library-clip aspect-video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`
                        : vimeo
                            ? `<iframe src="https://player.vimeo.com/video/${vimeo[1]}" title="${escapeHtml(m.libraryItem.title)}" class="library-clip aspect-video" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`
                            : '';
                return `${player}<a href="${libraryUrl}" class="library-clip-link ${mine ? 'text-red-100' : 'text-primary-red'} hover:underline"><i class="fa-solid fa-clapperboard mr-1"></i>${escapeHtml(m.libraryItem.title)}</a>`;
            })() : '';
            const a = m.attachment;
            let attachmentHtml = '';
            if (a) {
                const url = escapeHtml(a.url);
                const name = escapeHtml(a.name || 'file');
                if (a.kind === 'image') {
                    attachmentHtml = `<a href="${url}"><img src="${url}" alt="${name}" class="att-img"></a>`;
                } else if (a.kind === 'video') {
                    attachmentHtml = `<video src="${url}" controls preload="metadata" class="att-video"></video>`;
                } else if (a.kind === 'audio') {
                    attachmentHtml = `<audio src="${url}" controls preload="metadata" class="att-audio"></audio>`;
                } else {
                    attachmentHtml = `<a href="${url}" download class="att-file ${mine ? 'text-white' : 'text-gray-700'}"><i class="fa-regular fa-file-lines"></i>${name}</a>`;
                }
            }
            const stamp = new Date(m.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            return `
                <div class="flex ${mine ? 'justify-end' : 'justify-start'}">
                    <div class="bubble ${mine ? 'bg-primary-red text-white' : 'bg-gray-100 text-gray-800'}">
                        ${attachmentHtml}
                        ${m.text ? `<p class="whitespace-pre-wrap">${linkifyHtml(m.text)}<span class="stamp">${stamp}</span></p>` : `<span class="stamp" style="float:none;top:0;display:block;margin:2px 0 0">${stamp}</span>`}
                        ${clip}
                    </div>
                </div>
            `;
        }

        async function loadMessages(scroll) {
            const res = await fetch(`/api/assignments/${assignmentId}/messages`);
            const data = await res.json();
            if (!data.success) return;
            myRole = data.role;
            if (myRole === 'tutor' && !document.getElementById('tutor-library-btn').dataset.bound) {
                document.getElementById('tutor-library-btn').classList.remove('hidden');
                document.getElementById('tutor-library-btn').addEventListener('click', () => { const panel = document.getElementById('tutor-library-panel'); panel.classList.toggle('hidden'); if (!panel.classList.contains('hidden')) loadTutorLibraryPicker(); });
                document.getElementById('tutor-library-btn').dataset.bound = 'true';
            }
            if (data.messages.length && data.messages[data.messages.length - 1].id === lastMessageId) return; // nothing new
            lastMessageId = data.messages.length ? data.messages[data.messages.length - 1].id : 0;

            const body = document.getElementById('chat-body');
            body.innerHTML = data.messages.length
                ? data.messages.map(messageBubbleHtml).join('')
                : '<p class="text-center text-gray-400 text-sm py-10">No messages yet - say hello!</p>';
            if (scroll !== false) body.scrollTop = body.scrollHeight;
        }


        // --- Composer ---------------------------------------------------
        const input = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const sendIcon = document.getElementById('send-icon');
        let pendingAttachment = null;

        // The trailing button is a microphone until there's something to
        // send, then it becomes the send button - so one control covers both
        // without taking extra width in a slim bar.
        function refreshSendButton() {
            const hasContent = Boolean(input.value.trim()) || Boolean(pendingAttachment);
            sendIcon.className = hasContent ? 'fa-solid fa-paper-plane' : 'fa-solid fa-microphone';
            sendBtn.title = hasContent ? 'Send' : 'Record a voice note';
        }

        function autoGrow() {
            input.style.height = 'auto';
            input.style.height = `${Math.min(input.scrollHeight, 96)}px`;
        }

        input.addEventListener('input', () => { refreshSendButton(); autoGrow(); });

        function showAttachPreview() {
            const box = document.getElementById('attach-preview');
            const selected = pendingAttachment || pickedLibraryItem;
            if (!selected) { box.classList.add('hidden'); box.innerHTML = ''; return; }
            const isLibrary = Boolean(pickedLibraryItem && !pendingAttachment);
            const thumb = selected.kind === 'image' ? `<img src="${escapeHtml(selected.url)}" alt="">` : isLibrary ? '<i class="fa-solid fa-photo-film text-primary-red"></i>' : `<i class="fa-solid ${selected.kind === 'video' ? 'fa-film' : selected.kind === 'audio' ? 'fa-microphone' : 'fa-file-lines'} text-gray-400"></i>`;
            box.innerHTML = `${thumb}<span>${escapeHtml(selected.title || selected.name || 'Selected video')}</span><button type="button" class="drop" title="Remove attachment"><i class="fa-solid fa-xmark"></i></button>`;
            box.classList.remove('hidden');
            box.querySelector('.drop').addEventListener('click', () => { pendingAttachment = null; pickedLibraryItem = null; showAttachPreview(); refreshSendButton(); });
        }
        async function uploadFile(file) {
            if (!file) return;
            const body = new FormData();
            body.append('file', file);
            try {
                const res = await fetch('/api/chat/upload', { method: 'POST', body });
                const data = await res.json();
                if (!data.success) return showAlert(data.error || 'Upload failed.', 'error');
                pendingAttachment = data.attachment;
                showAttachPreview();
                refreshSendButton();
            } catch (e) {
                showAlert('Upload failed.', 'error');
            }
        }

        // Each button just opens its matching hidden picker. Using the file
        // input's own capture attribute for the camera means the OS camera
        // app handles it, which works on phones without any getUserMedia
        // permission dance; desktops fall back to a normal file chooser.
        [['attach-doc-btn', 'doc-input'], ['attach-media-btn', 'media-input']]
            .forEach(([btnId, inputId]) => {
                const picker = document.getElementById(inputId);
                document.getElementById(btnId).addEventListener('click', () => picker.click());
                picker.addEventListener('change', () => { uploadFile(picker.files[0]); picker.value = ''; });
            });

        // --- Camera -------------------------------------------------------
        // Opens a live preview and grabs a frame, rather than relying on the
        // file input's capture attribute, which desktop browsers ignore.
        // Falls back to that input if the camera can't be opened at all.
        const cameraInput = document.getElementById('camera-input');
        cameraInput.addEventListener('change', () => { uploadFile(cameraInput.files[0]); cameraInput.value = ''; });

        let camStream = null;

        function closeCamera() {
            if (camStream) { camStream.getTracks().forEach((t) => t.stop()); camStream = null; }
            const modal = document.getElementById('cam-modal');
            if (modal) modal.remove();
        }

        async function openCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                return cameraInput.click(); // very old browser - use the OS picker
            }
            try {
                camStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }, audio: false,
                });
            } catch (err) {
                // Denied, no camera, or blocked by an insecure origin. On
                // phones the capture input still reaches the camera app, so
                // it's a genuinely useful fallback rather than a dead end.
                if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) {
                    showAlert('Camera permission is needed to take a photo.', 'error');
                    return;
                }
                return cameraInput.click();
            }

            const modal = document.createElement('div');
            modal.id = 'cam-modal';
            modal.className = 'cam-modal';
            modal.innerHTML = `
                <div class="cam-inner">
                    <video id="cam-video" autoplay playsinline muted></video>
                    <div class="cam-actions">
                        <button type="button" id="cam-cancel">Cancel</button>
                        <button type="button" id="cam-shot" class="cam-shutter" title="Take photo"><i class="fa-solid fa-camera"></i></button>
                        <button type="button" id="cam-flip" title="Switch camera"><i class="fa-solid fa-camera-rotate"></i></button>
                    </div>
                </div>`;
            document.body.appendChild(modal);
            const video = document.getElementById('cam-video');
            video.srcObject = camStream;

            document.getElementById('cam-cancel').addEventListener('click', closeCamera);
            modal.addEventListener('click', (e) => { if (e.target === modal) closeCamera(); });

            document.getElementById('cam-flip').addEventListener('click', async () => {
                const current = camStream.getVideoTracks()[0].getSettings().facingMode;
                camStream.getTracks().forEach((t) => t.stop());
                try {
                    camStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: current === 'environment' ? 'user' : 'environment' }, audio: false,
                    });
                    video.srcObject = camStream;
                } catch (e) { showAlert('Could not switch camera.', 'error'); closeCamera(); }
            });

            document.getElementById('cam-shot').addEventListener('click', () => {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                canvas.toBlob((blob) => {
                    closeCamera();
                    if (!blob) return showAlert('Could not capture the photo.', 'error');
                    uploadFile(new File([blob], `photo-${Date.now()}.jpg`, { type: 'image/jpeg' }));
                }, 'image/jpeg', 0.9);
            });
        }

        document.getElementById('camera-btn').addEventListener('click', openCamera);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCamera(); });

        // Emoji picker
        const EMOJI = ['😀','😃','😄','😁','😊','🙂','😉','😍','🥰','😘','😎','🤩','🤔','🙃','😅','😂','🤣','🥲','😢','😭','😤','😳','🥳','🤗','🙌','👏','👍','👎','🙏','💪','👋','🤝','❤️','🧡','💛','💚','💙','💜','🔥','✨','⭐','🎵','🎶','🎹','🎸','🥁','🎤','🎧','🎻','🎺','🎷','📀','⏰','✅','❌','❓','❗','💯','🎉','🎊','📝','📚'];
        const emojiPanel = document.getElementById('emoji-panel');
        emojiPanel.innerHTML = EMOJI.map((e) => `<button type="button">${e}</button>`).join('');
        emojiPanel.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const pos = input.selectionStart ?? input.value.length;
            input.value = input.value.slice(0, pos) + btn.textContent + input.value.slice(input.selectionEnd ?? pos);
            input.focus();
            input.selectionStart = input.selectionEnd = pos + btn.textContent.length;
            refreshSendButton(); autoGrow();
        });
        document.getElementById('emoji-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            emojiPanel.classList.toggle('hidden');
        });
        document.addEventListener('click', (e) => {
            if (emojiPanel.classList.contains('hidden')) return;
            if (emojiPanel.contains(e.target) || e.target.closest('#emoji-btn')) return;
            emojiPanel.classList.add('hidden');
        });

        // --- Voice notes -------------------------------------------------
        let recorder = null;
        let recChunks = [];
        let recTimer = null;
        let recSeconds = 0;

        async function startRecording() {
            if (!navigator.mediaDevices || !window.MediaRecorder) {
                return showAlert('Voice notes are not supported in this browser.', 'error');
            }
            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (e) {
                return showAlert('Microphone permission is needed for voice notes.', 'error');
            }
            recChunks = [];
            recorder = new MediaRecorder(stream);
            recorder.ondataavailable = (e) => { if (e.data.size) recChunks.push(e.data); };
            recorder.onstop = () => stream.getTracks().forEach((t) => t.stop());
            recorder.start();

            recSeconds = 0;
            document.getElementById('rec-time').textContent = '0:00';
            document.getElementById('recording-bar').classList.remove('hidden');
            sendBtn.classList.add('recording');
            recTimer = setInterval(() => {
                recSeconds += 1;
                const m = Math.floor(recSeconds / 60);
                const s = String(recSeconds % 60).padStart(2, '0');
                document.getElementById('rec-time').textContent = `${m}:${s}`;
            }, 1000);
        }

        function stopRecordingUI() {
            clearInterval(recTimer);
            document.getElementById('recording-bar').classList.add('hidden');
            sendBtn.classList.remove('recording');
        }

        async function finishRecording(send) {
            if (!recorder) return;
            const done = new Promise((resolve) => { recorder.addEventListener('stop', resolve, { once: true }); });
            recorder.stop();
            await done;
            stopRecordingUI();
            const blob = new Blob(recChunks, { type: recorder.mimeType || 'audio/webm' });
            recorder = null;
            if (!send || !blob.size) return;
            const ext = (blob.type.split('/')[1] || 'webm').split(';')[0];
            await uploadFile(new File([blob], `voice-note.${ext}`, { type: blob.type }));
            document.getElementById('compose-form').requestSubmit();
        }

        document.getElementById('rec-cancel').addEventListener('click', () => finishRecording(false));
        document.getElementById('rec-send').addEventListener('click', () => finishRecording(true));

        document.getElementById('compose-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();

            // Nothing typed and nothing attached: the button is a mic, so
            // this press starts (or stops) a voice note instead of sending.
            if (!text && !pendingAttachment && !pickedLibraryItem) {
                if (recorder) return finishRecording(true);
                return startRecording();
            }

            const res = await fetch(`/api/assignments/${assignmentId}/messages`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    text,
                    libraryItemId: pickedLibraryItem ? pickedLibraryItem.id : null,
                    attachment: pendingAttachment,
                }),
            });
            const data = await res.json();
            if (data.success) {
                input.value = '';
                input.style.height = 'auto';
                pickedLibraryItem = null;
                pendingAttachment = null;
                showAttachPreview();
                refreshSendButton();
                emojiPanel.classList.add('hidden');
                loadMessages();
            } else {
                showAlert(data.error || 'Could not send message.', 'error');
            }
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('compose-form').requestSubmit();
            }
        });

        refreshSendButton();

        // --- Real-time delivery -----------------------------------------
        // The socket only pushes messages that the REST layer already saved,
        // so this is purely about latency. A slow poll stays running as a
        // safety net for a dropped/blocked socket, which is why a missed
        // push still surfaces within a few seconds instead of never.
        let socket = null;
        let reconnectDelay = 1000;
        let typingTimer = null;

        function showTyping(name, isTyping) {
            const el = document.getElementById('typing-indicator');
            if (!el) return;
            el.textContent = isTyping ? `${name || 'They'} is typing…` : '';
            el.classList.toggle('hidden', !isTyping);
        }

        function connectSocket() {
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${proto}//${window.location.host}/ws/chat`);

            socket.addEventListener('open', () => {
                reconnectDelay = 1000;
                socket.send(JSON.stringify({ type: 'join', assignmentId: Number(assignmentId) }));
            });

            socket.addEventListener('message', (event) => {
                let msg;
                try { msg = JSON.parse(event.data); } catch { return; }
                if (msg.type === 'message' && String(msg.assignmentId) === String(assignmentId)) {
                    // Re-fetch rather than appending the pushed object: that
                    // keeps read-receipts/ordering owned by the server and
                    // avoids rendering a duplicate of a message we just sent.
                    loadMessages();
                } else if (msg.type === 'typing') {
                    showTyping(msg.name, msg.isTyping);
                    clearTimeout(typingTimer);
                    if (msg.isTyping) typingTimer = setTimeout(() => showTyping('', false), 4000);
                }
            });

            // Exponential backoff, capped, so a server restart reconnects
            // quickly but a sustained outage doesn't hammer it.
            socket.addEventListener('close', () => {
                setTimeout(connectSocket, reconnectDelay);
                reconnectDelay = Math.min(reconnectDelay * 2, 30000);
            });
            socket.addEventListener('error', () => { try { socket.close(); } catch (e) { /* already closing */ } });
        }

        let lastTypingSent = 0;
        document.getElementById('message-input').addEventListener('input', () => {
            if (!socket || socket.readyState !== WebSocket.OPEN) return;
            const now = Date.now();
            if (now - lastTypingSent < 1500) return; // throttle
            lastTypingSent = now;
            socket.send(JSON.stringify({ type: 'typing', isTyping: true, name: myName }));
        });

        async function init() {
            await loadCounterpart();
            await loadMessages();
            loadLessonStrip();
            connectSocket();
            // Fallback only - the socket handles the live case.
            setInterval(() => loadMessages(), 15000);
            // Picks up a lesson scheduled or a recording posted from the
            // tutor dashboard while this thread is already open.
            setInterval(() => { if (!document.hidden) loadLessonStrip(); }, 30000);
        }
        init();
    </script>
    <script src="/assets/mobile-nav.js"></script>
</body>
</html>
