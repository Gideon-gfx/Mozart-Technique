<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Mozart Techniques</title>
    <link rel="shortcut icon" href="/mozartLogo.jpg" type="image/x-icon">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#c41822">
    <link rel="apple-touch-icon" href="/assets/icon-512.png">
    <script src="/assets/install-prompt.js" defer></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { 'primary-red': '#cc0000', 'primary-dark': '#1F2937' } } }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/redesign.css">
    <link rel="stylesheet" href="/assets/site.css">
    <style>
        html, body { height: 100%; }
        body { font-family: 'Montserrat', sans-serif; background: linear-gradient(135deg, #ffffff 0%, #f8f8f8 100%); display: flex; flex-direction: column; min-height: 100vh; }
        /* The chat card fills whatever space is left below the header and
           counterpart strip, and #chat-body absorbs the rest within that -
           replaces a fixed calc(100vh - Npx) guess that broke the moment any
           optional strip (lesson banner, pinned bar, edit banner, an open
           panel) changed the page's actual header height. */
        main { flex: 1; min-height: 0; }
        .chat-card { flex: 1; min-height: 0; }
        .chat-body { flex: 1; min-height: 200px; }

        /* Belt-and-suspenders for the counterpart header row: pinned to
           explicit CSS (not just Tailwind utility classes) so name-left /
           icons-right can't silently regress if a utility class combo ever
           fails to generate. */
        #chat-header-row { display: flex !important; align-items: center !important; width: 100% !important; min-height: 64px; gap: 12px; }
        #chat-header-identity { flex: 1 1 auto !important; min-width: 0 !important; text-align: left !important; }
        #chat-header-icons { flex: 0 0 auto !important; margin-left: auto !important; display: flex !important; align-items: center !important; }
        @media (max-width: 420px) { #chat-header-row { gap: 8px; } #chat-header-icons { gap: 0; } }

        /* In-page camera. A file input's capture attribute only does
           anything on mobile - desktop browsers ignore it and fall back to a
           file picker, which is why "take a photo" appeared to do nothing.
           getUserMedia works on both. */
        .cam-modal {
            position: fixed; inset: 0; z-index: 80;
            background: rgba(0,0,0,.75);
            display: grid; place-items: center;
            padding: 16px;
        }
        .cam-inner { background: #111; border-radius: 16px; overflow: hidden; max-width: 460px; width: 100%; }
        .cam-inner video { width: 100%; display: block; background: #000; max-height: 60vh; }
        .cam-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; }
        .cam-actions button { border: none; background: none; color: #ddd; font-size: .85rem; font-weight: 600; cursor: pointer; }
        .cam-shutter {
            width: 52px; height: 52px; border-radius: 999px;
            background: #cc0000; color: #fff !important; font-size: 1.05rem !important;
            display: grid; place-items: center;
        }

        /* Bubbles hug their text: just enough padding to clear the glyphs,
           with the timestamp inline at the end of the last line rather than
           on its own row, which is what made them look oversized. */
        .bubble {
            max-width: min(62%, 520px);
            overflow-wrap: anywhere;
            word-break: break-word;
            padding: 6px 12px;
            /* Fully curved on every corner - a short message reads as a
               pill, a long one keeps the same soft edge as it wraps. */
            border-radius: 18px;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.35;
        }
        .bubble.bg-primary-red, .bubble.bg-primary-red * { color: #fff !important; background-color: #cc0000 !important; }
        .bubble p { margin: 0; }
        .bubble .stamp {
            font-size: 9.5px;
            line-height: 1;
            margin-left: 6px;
            float: right;
            position: relative;
            top: 5px;
            opacity: .75;
            white-space: nowrap;
        }

        /* --- Message action menu (hover on desktop, long-press on touch) - */
        .msg-row { position: relative; display: flex; align-items: center; gap: 4px; }
        .msg-trigger {
            opacity: 0; width: 26px; height: 26px; border-radius: 50%; border: none;
            background: rgba(0,0,0,.06); display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #6b7280; font-size: 12px; flex-shrink: 0;
            transition: opacity .15s ease, background-color .15s ease;
        }
        .msg-row:hover .msg-trigger, .msg-trigger.force-visible { opacity: 1; }
        .msg-trigger:hover { background: rgba(0,0,0,.12); }
        @media (hover: none) { .msg-trigger { display: none; } }

        .msg-menu {
            position: fixed; z-index: 300; background: #fff; border-radius: 12px;
            box-shadow: 0 14px 34px rgba(0,0,0,.2); border: 1px solid #eee; padding: 6px; min-width: 176px;
        }
        .msg-menu[hidden] { display: none; }
        .msg-menu button {
            display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
            padding: 9px 10px; border: none; background: none; border-radius: 8px;
            font-size: 13px; font-weight: 600; color: #374151; cursor: pointer;
        }
        .msg-menu button:hover { background: #f3f4f6; }
        .msg-menu button i { width: 16px; text-align: center; color: #9ca3af; }
        .msg-menu button.danger { color: #dc2626; }
        .msg-menu button.danger i { color: #dc2626; }
        /* Higher specificity than ".msg-menu button{display:flex}" above, so
           toggling Tailwind's .hidden utility on these actually hides them. */
        .msg-menu button.mine-only.hidden { display: none; }

        .msg-pin-badge { font-size: 10px; opacity: .7; margin-right: 3px; }
        .msg-edited-tag { font-size: 10px; opacity: .65; margin-left: 4px; }

        /* --- Reactions ---------------------------------------------------- */
        .react-trigger {
            opacity: 0; width: 24px; height: 24px; border-radius: 50%; border: none;
            background: rgba(0,0,0,.06); display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #6b7280; font-size: 12px; flex-shrink: 0;
            transition: opacity .15s ease, background-color .15s ease;
        }
        .msg-row:hover .react-trigger, .react-trigger.force-visible { opacity: 1; }
        .react-trigger:hover { background: rgba(0,0,0,.12); }
        @media (hover: none) { .react-trigger { display: none; } }
        .react-picker {
            position: fixed; z-index: 310; background: #fff; border-radius: 999px;
            box-shadow: 0 10px 26px rgba(0,0,0,.22); border: 1px solid #eee; padding: 5px 7px;
            display: flex; gap: 3px;
        }
        .react-picker[hidden] { display: none; }
        .react-picker button { border: none; background: none; font-size: 21px; line-height: 1; padding: 4px; border-radius: 8px; cursor: pointer; transition: transform .1s ease, background-color .1s ease; }
        .react-picker button:hover, .react-picker button.active { transform: scale(1.22); background: #f3f4f6; }
        .msg-reactions { display: inline-flex; gap: 3px; flex-wrap: wrap; margin-top: 3px; }
        .msg-reaction-pill {
            display: inline-flex; align-items: center; gap: 3px; background: rgba(0,0,0,.07);
            border-radius: 999px; padding: 1px 7px; font-size: 12px; line-height: 1.6;
        }
        .bubble.bg-primary-red .msg-reaction-pill { background: rgba(255,255,255,.22); }
        .msg-reaction-pill .count { font-size: 10px; font-weight: 800; opacity: .8; }

        /* --- Delete popover (in-page, replaces the native confirm()) ------ */
        .delete-popover {
            position: fixed; z-index: 320; background: #fff; border-radius: 12px;
            box-shadow: 0 14px 34px rgba(0,0,0,.22); border: 1px solid #eee; padding: 6px; min-width: 208px;
        }
        .delete-popover[hidden] { display: none; }
        .delete-popover button { display: block; width: 100%; text-align: left; padding: 9px 10px; border: none; background: none; border-radius: 8px; font-size: 13px; font-weight: 600; color: #374151; cursor: pointer; }
        .delete-popover button:hover:not(:disabled) { background: #f3f4f6; }
        .delete-popover button.danger { color: #dc2626; }
        .delete-popover button:disabled { opacity: .4; cursor: not-allowed; }
        .delete-popover .hint { padding: 4px 10px 6px; font-size: 11px; color: #9ca3af; line-height: 1.4; }

        /* --- Reply --------------------------------------------------------- */
        .reply-banner {
            display: flex; align-items: flex-start; gap: 8px; padding: 7px 12px;
            background: #f4f4f5; border-radius: 8px; margin: 0 10px 8px; border-left: 3px solid #cc0000;
        }
        .reply-banner .reply-body { flex: 1; min-width: 0; }
        .reply-banner .reply-name { font-size: 11px; font-weight: 800; color: #cc0000; display: block; }
        .reply-banner .reply-text { font-size: 12px; color: #555; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
        .reply-banner button { border: none; background: none; color: #888; cursor: pointer; font-size: 13px; }
        .msg-quote {
            display: block; padding: 5px 8px; margin-bottom: 4px; border-left: 3px solid currentColor;
            opacity: .85; border-radius: 6px; background: rgba(0,0,0,.06); font-size: 12px; cursor: pointer;
        }
        .bubble.bg-primary-red .msg-quote { background: rgba(255,255,255,.18); }
        .msg-quote .quote-name { font-weight: 800; display: block; }
        .msg-quote .quote-text { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }

        /* Mobile swipe-to-reply: the bubble itself translates with the
           finger, a reply icon fades in behind it. */
        [data-bubble] { transition: transform .18s ease; }
        [data-bubble].no-transition { transition: none; }
        .swipe-reply-icon {
            position: absolute; top: 50%; transform: translateY(-50%); opacity: 0;
            color: #cc0000; font-size: 15px; transition: opacity .15s ease; pointer-events: none;
        }
        .msg-row.justify-end .swipe-reply-icon { right: 34px; }
        .msg-row.justify-start .swipe-reply-icon { left: 34px; }

        /* --- Date separators ----------------------------------------------- */
        .date-sep { position: static; z-index: auto; display: flex; justify-content: center; margin: 8px 0 12px; }
        .date-sep span { background: rgba(17,24,39,.78); color: #fff; font-size: 11px; font-weight: 700; padding: 4px 13px; border-radius: 999px; }

        /* --- Clip / attachment menu ----------------------------------------- */
        .clip-menu {
            position: fixed; z-index: 300; background: #fff; border-radius: 14px;
            box-shadow: 0 14px 34px rgba(0,0,0,.2); border: 1px solid #eee; padding: 8px; min-width: 224px;
        }
        .clip-menu[hidden] { display: none; }
        .clip-menu button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 8px; border: none; background: none; border-radius: 10px; font-size: 13px; font-weight: 600; color: #374151; cursor: pointer; }
        .clip-menu button:hover { background: #f3f4f6; }
        .clip-menu button i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: #f4f4f5; color: #cc0000; font-size: 12px; flex-shrink: 0; }

        /* --- Poll ------------------------------------------------------------ */
        .poll-modal-backdrop { position: fixed; inset: 0; z-index: 330; background: rgba(17,24,39,.42); display: grid; place-items: center; padding: 16px; }
        .poll-modal-backdrop[hidden] { display: none; }
        .poll-modal { background: #fff; border-radius: 16px; padding: 18px; width: min(360px,100%); }
        .poll-modal h3 { font-size: 15px; font-weight: 800; margin: 0 0 12px; }
        .poll-modal input { width: 100%; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-bottom: 7px; }
        .poll-modal .poll-option-row { display: flex; align-items: center; gap: 6px; }
        .poll-modal .poll-option-row input { margin-bottom: 7px; }
        .poll-modal .poll-add-option { background: none; border: none; color: #cc0000; font-weight: 700; font-size: 12.5px; cursor: pointer; padding: 4px 0 10px; }
        .poll-modal .poll-actions { display: flex; gap: 8px; margin-top: 6px; }
        .poll-modal .poll-actions button { flex: 1; border-radius: 10px; padding: 9px; font-weight: 700; font-size: 13px; border: none; cursor: pointer; }
        .poll-modal .poll-cancel { background: #f3f4f6; color: #374151; }
        .poll-modal .poll-submit { background: #cc0000; color: #fff; }
        .poll-block { min-width: 200px; }
        .poll-question { font-weight: 700; margin-bottom: 6px; }
        .poll-option { position: relative; border: 1px solid rgba(0,0,0,.15); border-radius: 8px; padding: 6px 10px; margin-bottom: 5px; cursor: pointer; overflow: hidden; font-size: 12.5px; background: rgba(255,255,255,.5); }
        .bubble.bg-primary-red .poll-option { border-color: rgba(255,255,255,.4); }
        .poll-option .poll-bar { position: absolute; inset: 0; background: rgba(0,0,0,.08); z-index: 0; }
        .bubble.bg-primary-red .poll-option .poll-bar { background: rgba(255,255,255,.22); }
        .poll-option .poll-option-label { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 6px; }
        .poll-option.voted { font-weight: 800; }
        .poll-meta { font-size: 10.5px; opacity: .7; margin-top: 3px; }

        /* --- Location --------------------------------------------------------- */
        .loc-block { display: block; width: 220px; border-radius: 10px; overflow: hidden; margin-top: 3px; border: 1px solid rgba(0,0,0,.15); }
        .loc-block iframe { width: 100%; height: 120px; border: 0; display: block; }
        .loc-block a { display: block; padding: 5px 8px; font-size: 11px; font-weight: 700; background: #fff; color: #cc0000; text-decoration: none; }

        /* --- Search + select mode ------------------------------------------- */
        .msg-row.search-match [data-bubble] { box-shadow: 0 0 0 2px #fbbf24; }
        .msg-row.search-current [data-bubble] { box-shadow: 0 0 0 2px #cc0000; }
        #chat-body.select-mode .msg-row { cursor: pointer; padding-left: 30px; position: relative; }
        #chat-body.select-mode .msg-row::before {
            content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 18px; height: 18px; border-radius: 50%; border: 2px solid #cbd5e1; background: #fff;
        }
        #chat-body.select-mode .msg-row.selected::before {
            content: '\2713'; background: #cc0000; border-color: #cc0000; color: #fff;
            font-size: 11px; display: flex; align-items: center; justify-content: center;
        }
        #chat-body.select-mode .msg-trigger, #chat-body.select-mode .react-trigger { display: none; }

        .pinned-bar {
            display: flex; align-items: center; gap: 8px; padding: 8px 14px;
            background: #fffbeb; border-bottom: 1px solid #fde68a; font-size: 12px; font-weight: 600;
            color: #92400e; cursor: pointer;
        }
        .pinned-bar i.fa-thumbtack { color: #d97706; }
        .pinned-bar .pin-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pinned-bar button { border: none; background: none; color: #92400e; cursor: pointer; }

        .edit-banner {
            display: flex; align-items: center; justify-content: space-between;
            padding: 7px 12px; background: #eff6ff; border-radius: 8px;
            font-size: 12px; font-weight: 700; color: #1d4ed8; margin: 0 10px 8px;
        }
        .edit-banner button { border: none; background: none; color: #1d4ed8; cursor: pointer; font-size: 14px; }

        /* --- Composer -------------------------------------------------- */
        .composer {
            border-top: 1px solid #eee;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .composer-bar {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 0 6px;
            background: #f1f1f3;
            border: 1px solid #d4d4d8;
            border-radius: 999px;
        }
        .composer-input {
            flex: 1;
            min-width: 0;
            border: none;
            background: transparent;
            resize: none;
            outline: none;
            font-family: inherit;
            color: #27272a;
            caret-color: #cc0000;
            font-size: 13.5px;
            line-height: 1.35;
            padding: 8px 4px;
            max-height: 96px;
        }
        .composer-input::placeholder { color: #77777f; opacity: 1; }
        .composer-icon {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border: none;
            background: none;
            border-radius: 999px;
            color: #8a8a8f;
            font-size: 14px;
            cursor: pointer;
            transition: color .15s ease, background-color .15s ease;
        }
        .composer-icon:hover { color: #cc0000; background: rgba(204,0,0,.07); }
        .composer-send {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 999px;
            border: none;
            background: #cc0000;
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 14px;
            cursor: pointer;
            transition: background-color .15s ease, transform .1s ease;
        }
        .composer-send:hover { background: #a30000; }
        .composer-send:active { transform: scale(.94); }
        @keyframes recPulse { 50% { opacity: .55; } }

        .emoji-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            padding: 8px 12px 10px;
            border-top: 1px solid #f0f0f0;
            max-height: 168px;
            overflow-y: auto;
        }
        .emoji-panel button {
            width: 32px; height: 32px;
            border: none; background: none;
            font-size: 19px; line-height: 1;
            border-radius: 8px; cursor: pointer;
        }
        .emoji-panel button:hover { background: #f2f2f2; }

        .attach-preview {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 12px;
            border-top: 1px solid #f0f0f0;
            font-size: 12px; color: #555;
        }
        .attach-preview img { width: 34px; height: 34px; object-fit: cover; border-radius: 6px; }
        .attach-preview .drop { margin-left: auto; border: none; background: none; color: #999; cursor: pointer; font-size: 14px; }

        /* Recording/ready rows sit inside .composer-bar itself (see
           #compose-form's data-mode rows), occupying the same slot as the
           text input rather than a bar stacked underneath it. */
        .composer-bar[hidden] { display: none; }
        .composer-icon[hidden] { display: none; }
        .recording-row { gap: 8px; }
        .pause-btn { flex-shrink: 0; width: 22px; height: 22px; display: grid; place-items: center; border: none; background: rgba(204,0,0,.1); color: #cc0000; border-radius: 999px; cursor: pointer; font-size: 11px; }
        .rec-dot { width: 8px; height: 8px; border-radius: 999px; background: #cc0000; flex-shrink: 0; animation: recPulse 1s ease-in-out infinite; }
        .rec-dot[hidden] { display: none; }
        .rec-time { font-weight: 700; font-size: 13px; color: #27272a; flex-shrink: 0; }
        .rec-hint { font-size: 12.5px; color: #6b7280; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Attachments inside a bubble */
        .att-img { max-width: 200px; border-radius: 9px; display: block; margin-top: 3px; cursor: pointer; }
        .att-video { max-width: 220px; border-radius: 9px; display: block; margin-top: 3px; }
        /* Voice note playback - custom player (play + waveform + speed
           toggle, duration on its own line) replacing native <audio
           controls>, same design as the shared ChatKit surfaces. */
        .voice-note { display: flex; flex-direction: column; gap: 3px; margin-top: 3px; min-width: 190px; max-width: 240px; }
        .voice-row { display: flex; align-items: center; gap: 8px; }
        /* !important + a selector at least as specific as
           ".bubble.bg-primary-red *" (this file's own blanket "everything
           inside a sent bubble is red" rule, above) - without matching
           that, the wave bars, the play button's chip and the speed pill
           all rendered at the right size and position but with their
           background forced to the same red as the bubble by that rule,
           invisible against it. */
        .voice-play { flex-shrink: 0; width: 30px; height: 30px; border-radius: 999px; border: none; background: rgba(0,0,0,.08); color: inherit; display: grid; place-items: center; cursor: pointer; font-size: 12px; }
        .bubble.bg-primary-red .voice-play { background: rgba(255,255,255,.25) !important; }
        .voice-wave { flex: 1; min-width: 0; height: 26px; display: flex; align-items: center; gap: 2px; cursor: pointer; }
        .voice-wave span { flex: 1; min-width: 2px; border-radius: 2px; background: #c7ccd1; transition: background-color .15s ease; }
        .voice-wave span.played { background: #6b7280; }
        .bubble.bg-primary-red .voice-wave span { background: #c7ccd1 !important; }
        .bubble.bg-primary-red .voice-wave span.played { background: #6b7280 !important; }
        .voice-speed { flex-shrink: 0; border: none; background: rgba(0,0,0,.08); color: inherit; border-radius: 999px; padding: 2px 7px; font-size: 10.5px; font-weight: 700; cursor: pointer; }
        .bubble.bg-primary-red .voice-speed { background: rgba(255,255,255,.25) !important; }
        .voice-time { font-size: 10.5px; opacity: .75; padding-left: 38px; }
        .att-file {
            display: inline-flex; align-items: center; gap: 6px;
            margin-top: 3px; padding: 5px 8px;
            border-radius: 8px; background: rgba(0,0,0,.07);
            font-size: 12px; text-decoration: none;
        }
        .library-clip { display: block; width: min(100%, 320px); margin-top: 7px; border-radius: 10px; background: #111; }
        .library-clip-link { display: block; margin-top: 6px; font-size: 12px; font-weight: 700; overflow-wrap: anywhere; }
        #alert-box { top:auto; bottom:20px; width:min(520px,calc(100vw - 32px)); max-width:none; max-height:min(30vh,180px); overflow-y:auto; line-height:1.45; overflow-wrap:anywhere; white-space:normal; padding:12px 14px; }
        #alert-message { display:block; overflow-wrap:anywhere; word-break:break-word; }
        .payment-result-backdrop { position:fixed; inset:0; z-index:90; display:grid; place-items:center; padding:20px; background:rgba(17,24,39,.54); }
        .payment-result-card { width:min(100%,390px); border-radius:24px; background:#fff; padding:30px 24px 24px; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.25); }
        .payment-result-icon { width:82px; height:82px; margin:0 auto 18px; display:grid; place-items:center; border-radius:999px; font-size:38px; }
        .payment-result-success .payment-result-icon { color:#fff; background:#059669; box-shadow:0 0 0 9px #d1fae5; }
        .payment-result-error .payment-result-icon { color:#fff; background:#dc2626; box-shadow:0 0 0 9px #fee2e2; }
        @media (max-width:640px) { #alert-box { right:12px; left:12px; bottom:14px; width:auto; } .payment-result-card { padding:26px 20px 20px; } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="alert-box" class="fixed right-5 z-50 rounded-lg shadow-xl text-white font-medium max-w-sm opacity-0 transition-opacity duration-500" style="background-color:#222;" role="status" aria-live="polite">
        <span id="alert-message"></span>
    </div>
    <div id="payment-result" class="payment-result-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="payment-result-title">
        <section id="payment-result-card" class="payment-result-card">
            <div id="payment-result-icon" class="payment-result-icon"><i class="fa-solid fa-check"></i></div>
            <h2 id="payment-result-title" class="text-xl font-extrabold text-gray-900">Payment successful</h2>
            <p id="payment-result-message" class="mt-2 text-sm leading-6 text-gray-600">Your lesson payment has been received.</p>
            <button id="payment-result-close" type="button" class="mt-6 w-full rounded-xl bg-primary-red px-4 py-3 text-sm font-bold text-white">Done</button>
        </section>
    </div>

    <!-- The conversation controls are the page navigation, leaving its centre clear. -->
    <header class="sticky top-0 z-50 bg-white shadow-sm">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-10">
        <div class="flex items-center gap-3" id="chat-header-row">
            <a href="/messages" title="Back to messages" class="text-gray-400 hover:text-primary-red transition shrink-0">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <img id="chat-avatar" src="/mozartLogo.jpg" alt="" class="w-9 h-9 rounded-full object-cover shrink-0">
            <div class="min-w-0 flex-1" id="chat-header-identity">
                <p id="chat-name" class="font-bold text-gray-800 leading-tight truncate">Loading...</p>
                <p id="chat-subject" class="text-xs text-gray-400 truncate"></p>
            </div>
            <div class="flex items-center gap-1 shrink-0 ml-auto" id="chat-header-icons">
                <button id="chat-meeting-btn" type="button" title="Join or schedule meeting" class="hidden h-9 w-9 rounded-full bg-red-50 text-red-700 hover:bg-red-100"><i class="fa-solid fa-video"></i></button>
                <button id="chat-search-btn" type="button" title="Search" class="h-9 w-9 rounded-full text-gray-500 hover:bg-gray-100"><i class="fa-solid fa-magnifying-glass"></i></button>
                <button id="chat-more-btn" type="button" title="More options" class="h-9 w-9 rounded-full text-gray-500 hover:bg-gray-100"><i class="fa-solid fa-ellipsis-vertical"></i></button>
            </div>
        </div>
        <div class="hidden items-center gap-2 py-1" id="chat-search-bar">
            <i class="fa-solid fa-magnifying-glass text-gray-400 text-sm"></i>
            <input type="text" id="chat-search-input" placeholder="Search in this conversation" class="flex-1 min-w-0 border-0 border-b border-gray-200 py-1 text-sm focus:outline-none focus:border-primary-red">
            <span id="chat-search-count" class="text-xs text-gray-400 shrink-0"></span>
            <button type="button" id="chat-search-prev" title="Previous match" class="h-7 w-7 rounded-full text-gray-500 hover:bg-gray-100"><i class="fa-solid fa-chevron-up text-xs"></i></button>
            <button type="button" id="chat-search-next" title="Next match" class="h-7 w-7 rounded-full text-gray-500 hover:bg-gray-100"><i class="fa-solid fa-chevron-down text-xs"></i></button>
            <button type="button" id="chat-search-close" title="Close search" class="h-7 w-7 rounded-full text-gray-500 hover:bg-gray-100"><i class="fa-solid fa-xmark text-xs"></i></button>
        </div>
        <div class="hidden items-center justify-between gap-2 py-1" id="chat-select-bar">
            <span id="chat-select-count" class="text-sm font-semibold text-gray-600">0 selected</span>
            <div class="flex items-center gap-2">
                <button type="button" id="chat-select-delete" class="text-sm font-semibold text-red-600 hover:underline"><i class="fa-solid fa-trash mr-1"></i>Delete for me</button>
                <button type="button" id="chat-select-cancel" class="text-sm font-semibold text-gray-500 hover:underline">Cancel</button>
            </div>
        </div>
    </div>
    </header>

    <main class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-10 py-4 w-full flex flex-col">
        <div class="chat-card bg-white rounded-2xl shadow-lg flex flex-col overflow-hidden">
            <!-- Lesson context for this thread: the next scheduled Meet and
                 any recordings posted, so both are reachable from the
                 conversation instead of only the dashboard. -->
            <div id="lesson-strip" class="hidden border-b border-gray-100 px-4 py-2.5 bg-[#fcfbfa] text-xs"></div>

            <div id="pinned-bar" class="pinned-bar hidden">
                <i class="fa-solid fa-thumbtack"></i>
                <span class="pin-text" id="pinned-bar-text"></span>
                <button type="button" id="pinned-bar-unpin" title="Unpin"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="chat-body" class="chat-body overflow-y-auto p-4 space-y-3"></div>
            <p id="typing-indicator" class="hidden px-4 pb-1 text-xs text-gray-400 italic" aria-live="polite"></p>

            <div id="edit-banner" class="edit-banner hidden">
                <span><i class="fa-solid fa-pen mr-1"></i> Editing message</span>
                <button type="button" id="cancel-edit-btn" title="Cancel edit"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="reply-banner" class="reply-banner hidden">
                <div class="reply-body">
                    <span class="reply-name" id="reply-banner-name"></span>
                    <span class="reply-text" id="reply-banner-text"></span>
                </div>
                <button type="button" id="cancel-reply-btn" title="Cancel reply"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="compose-form" class="composer">
                <!-- Clip icon on the left opens the attachment menu; the pill
                     bar holds just the text input plus emoji/voice-send on
                     the right, matching the "same everywhere" chat layout.
                     Recording/ready swap in as the same pill + a left-side
                     cancel/discard button, occupying this same row instead
                     of a separate bar underneath it - see setComposerMode. -->
                <button type="button" id="clip-btn" title="Attach" class="composer-icon">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
                <button type="button" id="rec-cancel" title="Delete recording" class="composer-icon" hidden>
                    <i class="fa-solid fa-trash" style="color:#dc2626"></i>
                </button>
                <button type="button" id="rec-discard" title="Discard voice note" class="composer-icon" hidden>
                    <i class="fa-solid fa-trash" style="color:#dc2626"></i>
                </button>
                <div class="composer-bar" id="composer-bar">
                    <textarea id="message-input" rows="1" placeholder="Message" class="composer-input"></textarea>
                    <button type="button" id="emoji-btn" title="Emoji" class="composer-icon">
                        <i class="fa-regular fa-face-smile"></i>
                    </button>
                </div>
                <div class="composer-bar recording-row" id="recording-row" hidden>
                    <button type="button" class="pause-btn" id="rec-pause" title="Pause"><i class="fa-solid fa-pause"></i></button>
                    <span class="rec-dot" id="rec-dot"></span>
                    <span class="rec-time" id="rec-time">0:00</span>
                    <span class="rec-hint" id="rec-hint">Recording voice note…</span>
                </div>
                <div class="composer-bar recording-row" id="ready-row" hidden>
                    <i class="fa-solid fa-microphone" style="color:#cc0000"></i>
                    <span class="rec-hint" id="ready-hint">Voice note</span>
                </div>
                <button type="submit" id="send-btn" title="Hold to record a voice note" class="composer-send">
                    <i id="send-icon" class="fa-solid fa-microphone"></i>
                </button>

                <!-- Hidden pickers driven by the clip menu -->
                <input type="file" id="doc-input" class="hidden" aria-hidden="true"
                       accept=".pdf,.doc,.docx,.txt,.rtf,.odt,.ppt,.pptx,.xls,.xlsx,.csv,.zip">
                <input type="file" id="media-input" class="hidden" aria-hidden="true" accept="image/*,video/*">
                <input type="file" id="audio-input" class="hidden" aria-hidden="true" accept="audio/*">
                <input type="file" id="camera-input" class="hidden" aria-hidden="true" accept="image/*" capture="environment">
            </form>

            <div class="clip-menu" id="clip-menu" hidden>
                <button type="button" data-clip="doc"><i class="fa-regular fa-file-lines"></i> Documents</button>
                <button type="button" data-clip="media"><i class="fa-regular fa-image"></i> Photos &amp; Videos</button>
                <button type="button" data-clip="camera"><i class="fa-solid fa-camera"></i> Camera</button>
                <button type="button" data-clip="audio"><i class="fa-solid fa-music"></i> Audio</button>
                <button type="button" data-clip="library" id="clip-library-btn" class="hidden"><i class="fa-solid fa-photo-film"></i> Tutor library</button>
                <button type="button" data-clip="teaching-tools" id="clip-tools-btn"><i class="fa-solid fa-chalkboard-user"></i> Teaching Tools</button>
                <button type="button" data-clip="poll"><i class="fa-solid fa-square-poll-vertical"></i> Poll</button>
                <button type="button" data-clip="location" id="clip-location-btn" class="hidden"><i class="fa-solid fa-location-dot"></i> Location</button>
            </div>

            <div id="tutor-library-panel" class="hidden border-t border-gray-100 bg-gray-50 p-3">
                <div class="mb-2 flex items-center justify-between gap-2"><p class="text-xs font-semibold text-gray-700">Choose a video to send</p><div class="flex gap-1"><button type="button" class="library-tab rounded-md bg-primary-red px-2 py-1 text-xs font-semibold text-white" data-library-tab="mine">My library</button><button type="button" class="library-tab rounded-md border border-gray-200 bg-white px-2 py-1 text-xs font-semibold text-gray-600" data-library-tab="mozart">Mozart library</button></div></div><input id="tutor-library-search" type="search" placeholder="Search this library" class="mb-2 w-full rounded-lg border border-gray-200 bg-white px-3 py-2 text-xs">
                <div id="tutor-library-items" class="grid max-h-56 gap-2 overflow-y-auto pr-1"></div>
            </div>

            <div id="emoji-panel" class="emoji-panel hidden"></div>
            <div id="attach-preview" class="attach-preview hidden"></div>
        </div>
    </main>

    <div class="msg-menu" id="msg-menu" hidden>
        <button type="button" data-action="reply"><i class="fa-solid fa-reply"></i> Reply</button>
        <button type="button" data-action="copy"><i class="fa-regular fa-copy"></i> Copy</button>
        <button type="button" data-action="share"><i class="fa-solid fa-share-nodes"></i> Share</button>
        <button type="button" data-action="pin"><i class="fa-solid fa-thumbtack"></i> <span id="msg-menu-pin-label">Pin</span></button>
        <button type="button" data-action="edit" class="mine-only"><i class="fa-solid fa-pen"></i> Edit</button>
        <button type="button" data-action="delete" class="danger"><i class="fa-solid fa-trash"></i> Delete</button>
    </div>

    <div class="msg-menu" id="chat-more-menu" hidden style="min-width:220px;">
        <button type="button" data-more="search"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
        <button type="button" data-more="select"><i class="fa-regular fa-square-check"></i> Select messages</button>
        <div style="position:relative;">
            <button type="button" data-more="mute-toggle" id="chat-mute-toggle"><i class="fa-solid fa-bell"></i> <span id="chat-mute-label">Notifications</span> <i class="fa-solid fa-chevron-right" style="margin-left:auto;font-size:10px;"></i></button>
            <div class="msg-menu" id="chat-mute-submenu" hidden style="min-width:140px;">
                <button type="button" data-mute="8h">8 hours</button>
                <button type="button" data-mute="1w">1 week</button>
                <button type="button" data-mute="always">Always</button>
            </div>
        </div>
        <button type="button" data-more="favorite"><i class="fa-regular fa-star" id="chat-favorite-icon"></i> <span id="chat-favorite-label">Add to Favorite</span></button>
        <button type="button" data-more="export"><i class="fa-solid fa-file-export"></i> Export chat</button>
        <button type="button" data-more="close"><i class="fa-solid fa-xmark"></i> Close chat</button>
        <button type="button" data-more="send-call-link"><i class="fa-solid fa-video"></i> Send call links</button>
        <hr style="margin:6px 0;border-color:#eee;">
        <button type="button" data-more="report" class="danger"><i class="fa-solid fa-flag"></i> Report</button>
        <button type="button" data-more="block" class="danger"><i class="fa-solid fa-ban"></i> <span id="chat-block-label">Block</span></button>
        <button type="button" data-more="clear" class="danger"><i class="fa-solid fa-broom"></i> Clear chat</button>
        <button type="button" data-more="delete-chat" class="danger"><i class="fa-solid fa-trash"></i> Delete chat</button>
    </div>

    <div class="poll-modal-backdrop" id="report-modal-backdrop" hidden>
        <div class="poll-modal">
            <h3>Report this person</h3>
            <textarea id="report-reason-input" rows="3" placeholder="What's going on?" style="width:100%;border:1px solid #e5e7eb;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px;font-family:inherit;"></textarea>
            <div class="poll-actions">
                <button type="button" class="poll-cancel" id="report-cancel-btn">Cancel</button>
                <button type="button" class="poll-submit" id="report-submit-btn">Submit report</button>
            </div>
        </div>
    </div>

    <div class="react-picker" id="react-picker" hidden></div>

    <div class="delete-popover" id="delete-popover" hidden>
        <button type="button" data-delete="me">Delete for me</button>
        <button type="button" data-delete="everyone" id="delete-everyone-btn">Delete for everyone</button>
        <p class="hint" id="delete-hint"></p>
    </div>

    <div class="poll-modal-backdrop" id="poll-modal-backdrop" hidden>
        <div class="poll-modal">
            <h3>Create a poll</h3>
            <input type="text" id="poll-question-input" placeholder="Ask a question" maxlength="200">
            <div id="poll-options-list"></div>
            <button type="button" class="poll-add-option" id="poll-add-option">+ Add option</button>
            <div class="poll-actions">
                <button type="button" class="poll-cancel" id="poll-cancel-btn">Cancel</button>
                <button type="button" class="poll-submit" id="poll-submit-btn">Send poll</button>
            </div>
        </div>
    </div>

    <script>
        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');
        let alertTimer;
        function showAlert(message, type = 'info', anchor = null) {
            alertMessage.textContent = message;
            alertBox.style.backgroundColor = type === 'error' ? '#B91C1C' : type === 'success' ? '#059669' : '#1F2937';
            alertBox.style.opacity = '1';
            if (anchor) {
                const rect = anchor.getBoundingClientRect();
                alertBox.style.left = `${Math.max(12, Math.min(rect.left, window.innerWidth - Math.min(520, window.innerWidth - 32) - 12))}px`;
                alertBox.style.right = 'auto';
                alertBox.style.top = `${Math.min(window.innerHeight - 100, rect.bottom + 10)}px`;
                alertBox.style.bottom = 'auto';
            } else {
                alertBox.style.left = 'auto'; alertBox.style.right = '20px'; alertBox.style.top = 'auto'; alertBox.style.bottom = '20px';
            }
            clearTimeout(alertTimer);
            alertTimer = setTimeout(() => { alertBox.style.opacity = '0'; }, 8000);
        }
        const paymentResult = document.getElementById('payment-result');
        const paymentResultCard = document.getElementById('payment-result-card');
        const paymentResultIcon = document.getElementById('payment-result-icon');
        function showPaymentResult(success, message) {
            paymentResultCard.classList.toggle('payment-result-success', success);
            paymentResultCard.classList.toggle('payment-result-error', !success);
            paymentResultIcon.innerHTML = `<i class="fa-solid ${success ? 'fa-check' : 'fa-xmark'}"></i>`;
            document.getElementById('payment-result-title').textContent = success ? 'Payment successful' : 'Payment not successful';
            document.getElementById('payment-result-message').textContent = message || (success ? 'Your lesson payment has been received.' : 'Your payment could not be completed.');
            document.getElementById('payment-result-close').textContent = success ? 'Done' : 'Try again';
            paymentResult.classList.remove('hidden');
        }
        function closePaymentResult() { paymentResult.classList.add('hidden'); }
        document.getElementById('payment-result-close').addEventListener('click', closePaymentResult);
        paymentResult.addEventListener('click', (event) => { if (event.target === paymentResult) closePaymentResult(); });
        
        // Set back button based on user role - a caller can override where
        // "back" goes with ?back=/org-tutor (e.g. a student row opened from
        // the Org Tutor dashboard's Messages panel should return there, not
        // to the generic /messages or /tutor list).
        const backOverride = new URLSearchParams(window.location.search).get('back');
        if (backOverride && backOverride.startsWith('/')) {
            const backBtn = document.querySelector('a[href="/messages"]');
            if (backBtn) { backBtn.href = backOverride; backBtn.title = 'Back'; }
        } else {
            fetch('/api/session')
                .then((r) => r.json())
                .then((d) => {
                    const backBtn = document.querySelector('a[href="/messages"]');
                    if (backBtn && d.user && d.user.role === 'tutor') {
                        backBtn.href = '/tutor';
                        backBtn.title = 'Back to tutor dashboard';
                    }
                })
                .catch(() => { /* fallback to /messages */ });
        }
        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        const paymentNotice = new URLSearchParams(window.location.search).get('payment');
        if (paymentNotice === 'success') setTimeout(() => showPaymentResult(true, 'Your Stripe payment was successful and the lesson has been paid.'), 120);
        if (paymentNotice === 'error') setTimeout(() => showPaymentResult(false, 'Stripe could not confirm this payment. No lesson payment was released.'), 120);
        if (paymentNotice === 'cancel') setTimeout(() => showAlert('Payment was cancelled. You can try again whenever you are ready.', 'info'), 120);

        let assignmentId = new URLSearchParams(window.location.search).get('assignment') || window.location.pathname.split('/').filter(Boolean).pop();
        let myRole = null;
        let myName = '';
        let myUserId = null;
        let isInPersonLesson = false;
        let lastMessagesSignature = '';
        let currentMessages = [];
        let editingMessageId = null;
        let replyingToId = null;
        let currentAssignmentRecord = null;
        let threadPrefs = { favorite: false, muted: false, blocked: false };
        let selectModeOn = false;
        let selectedMessageIds = new Set();
        let searchModeOn = false;
        let searchMatches = [];
        let searchIndex = -1;
        let pickedLibraryItem = null;
        let libraryPickerItems = { mine: [], mozart: [] };
        let libraryPickerTab = 'mine';
        function renderTutorLibraryPicker() {
            const host = document.getElementById('tutor-library-items');
            const query = document.getElementById('tutor-library-search').value.trim().toLowerCase();
            const items = (libraryPickerItems[libraryPickerTab] || []).filter((item) => !query || `${item.title || ''} ${item.category || ''} ${item.description || ''}`.toLowerCase().includes(query));
            host.innerHTML = items.length ? items.map((item) => `<button type="button" class="text-left rounded-lg border border-gray-200 bg-white p-2 hover:border-primary-red" data-library-id="${item.id}"><strong class="block text-sm">${escapeHtml(item.title)}</strong><span class="text-xs text-gray-500">${escapeHtml(item.category || 'All courses')}</span></button>`).join('') : '<p class="text-xs text-gray-400">No matching videos in this library.</p>';
            host.querySelectorAll('[data-library-id]').forEach((button) => button.addEventListener('click', () => { pickedLibraryItem = (libraryPickerItems[libraryPickerTab] || []).find((item) => String(item.id) === button.dataset.libraryId); document.getElementById('tutor-library-panel').classList.add('hidden'); refreshSendButton(); showAlert(`Selected ${pickedLibraryItem.title}`, 'success'); }));
        }
        async function loadTutorLibraryPicker() {
            if (myRole !== 'tutor') return;
            const [mineRes, mozartRes] = await Promise.all([fetch(`/api/tutor-library/${assignmentId}`), fetch('/api/library')]);
            const [mineData, mozartData] = await Promise.all([mineRes.json(), mozartRes.json()]);
            libraryPickerItems = { mine: mineData.success ? (mineData.items || []) : [], mozart: mozartData.success ? (mozartData.items || []) : [] };
            const search = document.getElementById('tutor-library-search');
            if (!search.dataset.bound) { search.addEventListener('input', renderTutorLibraryPicker); search.dataset.bound = 'true'; }
            document.querySelectorAll('.library-tab').forEach((button) => { button.onclick = () => { libraryPickerTab = button.dataset.libraryTab; document.querySelectorAll('.library-tab').forEach((tab) => tab.className = `library-tab rounded-md px-2 py-1 text-xs font-semibold ${tab === button ? 'bg-primary-red text-white' : 'border border-gray-200 bg-white text-gray-600'}`); renderTutorLibraryPicker(); }; });
            renderTutorLibraryPicker();
        }
        // Own display name, used only to label the typing indicator on the
        // other side ("Gideon is typing…").
        fetch('/api/session')
            .then((r) => r.json())
            .then((d) => { if (d.user) { myName = (d.user.name || '').split(' ')[0]; myUserId = d.user.id; } })
            .catch(() => { /* indicator falls back to "They" */ });

        // Pulls the scheduled Meet + posted recordings for this assignment
        // from the same feed the dashboard uses, so the two never disagree.
        async function loadLessonStrip() {
            const strip = document.getElementById('lesson-strip');
            if (!strip) return;
            let data;
            try { data = await fetch('/api/my-assignments').then((r) => r.json()); } catch (e) { return; }
            if (!data.success) return;
            const studentRecord = (data.asStudent || []).find((r) => String(r.id) === String(assignmentId));
            const tutorRecord = (data.asTutor || []).find((r) => String(r.id) === String(assignmentId));
            const record = studentRecord || tutorRecord;
            if (!record) return;
            currentAssignmentRecord = record;
            isInPersonLesson = record.lessonType && record.lessonType !== 'online';
            document.getElementById('clip-location-btn').classList.toggle('hidden', !isInPersonLesson);
            const meetingButton = document.getElementById('chat-meeting-btn');
            const meetingHasPassed = record.scheduledAt && new Date(record.scheduledAt).getTime() < Date.now();
            meetingButton.classList.toggle('hidden', Boolean(meetingHasPassed));
            meetingButton.onclick = async () => {
                if (meetingHasPassed) return showAlert('This scheduled meeting has ended.', 'info');
                if (record.meetingLink) { window.location.href = record.meetingLink; return; }
                if (!tutorRecord) return showAlert('Your tutor has not shared a meeting link yet.', 'info');
                // Straight to Google Meet's own "create a meeting" flow -
                // no prompt() dialog. Meet generates the room and its URL
                // itself; we can't read that back across origins, so this
                // creates the room rather than also saving it here. Once
                // Meet shows the link, sharing it in the chat is one paste.
                const win = window.open('https://meet.google.com/new', '_blank', 'noopener');
                if (!win) window.location.href = 'https://meet.google.com/new';
            };
            const parts = [];
            if (record.scheduledAt) {
                const when = new Date(record.scheduledAt);
                const past = when.getTime() < Date.now() - 60 * 60 * 1000;
                parts.push(`
                    <div class="flex items-center gap-2 flex-wrap">
                        <i class="fa-regular fa-calendar text-primary-red"></i>
                        <span class="${past ? 'text-gray-400' : 'text-gray-700 font-semibold'}">${past ? 'Last lesson' : 'Next lesson'}: ${when.toLocaleString()}</span>
                        ${record.meetingLink && !past
                            ? `<a href="${escapeHtml(record.meetingLink)}" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-primary-red text-white font-semibold"><i class="fa-solid fa-video"></i> Join</a>`
                            : ''}
                    </div>`);
            } else if (record.meetingLink) {
                parts.push(`
                    <div class="flex items-center gap-2 flex-wrap">
                        <i class="fa-solid fa-video text-primary-red"></i>

        function linkifyHtml(text) {
            const safe = escapeHtml(String(text || ''));
            return safe.replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi, (match) => {
                const href = match.startsWith('http') ? match : `https://${match}`;

            });
