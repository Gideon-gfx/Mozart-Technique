<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Schedule - Mozart Techniques</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Science+Gothic:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    body { font-family: Montserrat, sans-serif; background: #f8f7f5; color: #211b19; }
    h1, h2, h3 { font-family: 'Science Gothic', Montserrat, sans-serif; }
    .schedule-header { position: relative; z-index: 500; height: 72px; overflow: visible; background: #fff; border-bottom: 2px solid #cc0000; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
    .schedule-header-inner { max-width: 1152px; height: 100%; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; }
    .schedule-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #211b19; font-weight: 800; font-size: 1rem; white-space: nowrap; }
    .schedule-brand img { width: 42px !important; height: 42px !important; min-width: 42px; object-fit: cover; border-radius: 10px; display: block; }
    .schedule-hero { background: radial-gradient(circle at right top, rgba(204,0,0,.15), transparent 34%), linear-gradient(120deg,#241b19,#55201c); }
    .time-rail { position: relative; padding-left: 2.25rem; }
    .time-rail::before { content: ''; position: absolute; left: .6rem; top: 1.1rem; bottom: -1.3rem; width: 1px; background: #e3d6d1; }
    .time-rail:last-child::before { display: none; }
    .time-dot { position: absolute; left: 0; top: 1.25rem; width: 1.3rem; height: 1.3rem; border: 4px solid #f8f7f5; border-radius: 999px; background: #a3121a; box-shadow: 0 0 0 1px #d9bbb3; }
    .lesson-card { border: 1px solid rgba(160,34,25,.12); box-shadow: 0 16px 35px rgba(59,29,24,.06); transition: transform .2s, box-shadow .2s; }
    .lesson-card:hover { transform: translateY(-2px); box-shadow: 0 20px 42px rgba(59,29,24,.11); }
    @media (max-width: 520px) { .schedule-header-inner { padding: 0 16px; } .schedule-brand span { font-size: .88rem; } }
  </style>
</head>
<body>
  <header class="schedule-header">
    <div class="schedule-header-inner">
      <a class="schedule-brand" href="/home" aria-label="Mozart Techniques home">
        <img src="/mozartLogo.jpg" alt="">
        <span>Mozart Techniques</span>
      </a>
      <div id="auth-state"></div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
    <a href="/dashboard" class="inline-flex items-center gap-2 text-sm font-bold text-primary-red hover:underline">
      <i class="fa-solid fa-arrow-left"></i> Back to dashboard
    </a>
    <section class="schedule-hero mt-5 rounded-[2rem] text-white p-7 sm:p-10 overflow-hidden">
      <div class="max-w-2xl">
        <p class="text-xs uppercase font-bold tracking-[.2em] text-red-200">Your lesson calendar</p>
        <h1 class="text-4xl sm:text-5xl font-extrabold mt-3">My schedule</h1>
        <p class="mt-4 text-stone-200 leading-relaxed">Keep every lesson in one place. Join your live Google Meet, review what is coming next, and look back at completed sessions.</p>
      </div>
      <div id="schedule-stats" class="grid grid-cols-3 max-w-xl mt-8 gap-3"></div>
    </section>
    <div id="schedule" class="mt-10 space-y-12"></div>
  </main>

  <script>
    const esc = value => String(value || '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
    const details = {
      Upcoming: { icon: 'fa-calendar-plus', note: 'Coming up', tone: 'bg-red-50 text-primary-red' },
      Current: { icon: 'fa-video', note: 'Happening now', tone: 'bg-emerald-50 text-emerald-700' },
      Past: { icon: 'fa-clock-rotate-left', note: 'Lesson history', tone: 'bg-stone-100 text-stone-600' }
    };
    function lessonCard(lesson, section) {
      const when = new Date(lesson.scheduledAt);
      const hasMeet = Boolean(lesson.meetingLink);
      const color = section === 'Current' ? '#059669' : section === 'Past' ? '#82726d' : '#a3121a';
      const action = hasMeet
        ? `<a href="${esc(lesson.meetingLink)}" target="_blank" rel="noopener" style="background:#c00;color:#fff" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-sm hover:bg-red-800"><i class="fa-solid fa-video"></i>${section === 'Past' ? 'Open meeting link' : 'Join Google Meet'}</a>`
        : '<span class="text-sm text-stone-400"><i class="fa-regular fa-calendar-xmark mr-1"></i>Meeting link will appear once your tutor schedules it.</span>';
      return `<div class="time-rail"><span class="time-dot" style="background:${color}"></span><article class="lesson-card bg-white rounded-2xl p-5 sm:p-6"><div class="flex flex-wrap items-start justify-between gap-4"><div><span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-extrabold uppercase tracking-wide ${details[section].tone}"><i class="fa-solid ${details[section].icon}"></i>${details[section].note}</span><h3 class="text-xl font-bold mt-3">${esc(lesson.category)}</h3><p class="text-sm text-stone-500 mt-1">with <strong class="text-stone-700">${esc(lesson.tutorName || 'your tutor')}</strong></p></div><div class="text-left sm:text-right"><p class="font-bold text-stone-800">${when.toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' })}</p><p class="text-sm text-stone-500 mt-1"><i class="fa-regular fa-clock mr-1"></i>${when.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' })}</p></div></div><div class="mt-5 pt-4 border-t border-stone-100 flex flex-wrap items-center gap-3">${action}<a href="/messages/chat/${lesson.id}" class="text-sm font-bold text-stone-600 hover:text-primary-red"><i class="fa-regular fa-comment mr-1"></i>Message tutor</a></div></article></div>`;
    }
    async function loadSchedule() {
      const payload = await (await fetch('/api/my-assignments')).json();
      const now = Date.now();
      const groups = { Upcoming: [], Current: [], Past: [] };
      (payload.asStudent || []).filter(item => item.scheduledAt).forEach(item => {
        const start = new Date(item.scheduledAt).getTime();
        const end = start + Number(item.durationMinutes || 60) * 60000;
        groups[start > now ? 'Upcoming' : end >= now ? 'Current' : 'Past'].push(item);
      });
      document.getElementById('schedule-stats').innerHTML = Object.entries(groups).map(([name, items]) => `<div class="rounded-2xl bg-white/10 border border-white/15 px-4 py-3"><strong class="block text-2xl">${items.length}</strong><span class="text-xs text-stone-200">${name}</span></div>`).join('');
      document.getElementById('schedule').innerHTML = Object.entries(groups).map(([name, items]) => {
        const subtitle = name === 'Upcoming' ? 'Your next planned lessons' : name === 'Current' ? 'Join while the lesson is in progress' : 'Completed and previous lessons';
        const content = items.length
          ? items.sort((a, b) => new Date(a.scheduledAt) - new Date(b.scheduledAt)).map(item => lessonCard(item, name)).join('')
          : `<div class="bg-white border border-dashed border-stone-300 rounded-2xl py-8 text-center text-stone-400">No ${name.toLowerCase()} lessons yet.</div>`;
        return `<section><div class="flex items-center gap-3 mb-5"><span class="w-10 h-10 rounded-xl ${details[name].tone} flex items-center justify-center"><i class="fa-solid ${details[name].icon}"></i></span><div><h2 class="text-2xl font-bold">${name}</h2><p class="text-sm text-stone-500">${subtitle}</p></div></div>${content}</section>`;
      }).join('');
    }
    loadSchedule().catch(() => {
      document.getElementById('schedule').innerHTML = '<div class="bg-red-50 text-red-700 rounded-2xl p-5">Could not load your schedule. Please refresh and try again.</div>';
    });
  </script>
  <script src="/assets/nav-auth.js"></script>
  <script src="/assets/footer.js"></script>
</body>
</html>
