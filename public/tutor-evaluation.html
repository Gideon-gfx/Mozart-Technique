<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qualification Evaluation - Mozart Techniques</title>
    <link rel="shortcut icon" href="mozartLogo.jpg" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { 'primary-red': '#cc0000', 'primary-dark': '#1F2937' } } }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="assets/redesign.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #ffffff 0%, #f8f8f8 100%); }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="alert-box" class="fixed top-5 right-5 z-50 p-4 rounded-lg shadow-xl text-white font-medium max-w-sm opacity-0 transition-opacity duration-500" style="background-color:#222;">
        <span id="alert-message"></span>
    </div>

    <header class="sticky top-0 z-50 bg-white shadow-sm">
        <nav class="max-w-3xl mx-auto px-4 sm:px-6 flex items-center justify-between h-20">
            <div class="flex items-center space-x-3">
                <img src="mozartLogo.jpg" alt="Mozart Techniques logo" class="w-10 h-10 rounded-full object-cover shadow-sm">
                <span class="text-2xl font-extrabold serif text-[#333]">Mozart Techniques</span>
            </div>
            <a href="/become-tutor" class="text-gray-600 hover:text-primary-red font-medium">Back</a>
        </nav>
    </header>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 py-10">
        <div class="bg-white rounded-2xl shadow-lg p-6 sm:p-8">
            <h1 id="page-title" class="text-2xl font-bold text-gray-800 mb-1">Qualification Evaluation</h1>
            <p class="text-gray-500 mb-2">Pass this to unlock teaching this subject at the corresponding level. You may re-evaluate to teach a higher level once every 12 months.</p>
            <p id="current-level" class="text-sm font-semibold text-primary-red mb-6"></p>

            <div id="cooldown-notice" class="hidden bg-yellow-50 text-yellow-700 text-sm rounded-lg p-4 mb-4"></div>

            <div id="quiz-editor" class="space-y-4 mb-4"></div>
            <p id="no-quiz" class="hidden text-gray-400 text-sm mb-4">No evaluation has been set up for this subject yet - check back soon.</p>
            <button id="submit-btn" class="px-6 py-3 bg-primary-red text-white font-semibold rounded-lg shadow-md hover:bg-red-700 transition duration-150">
                Submit
            </button>
        </div>
    </main>

    <script>
        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');
        function showAlert(message, type = 'info') {
            alertMessage.textContent = message;
            alertBox.style.backgroundColor = type === 'error' ? '#B91C1C' : type === 'success' ? '#059669' : '#1F2937';
            alertBox.style.opacity = '1';
            setTimeout(() => { alertBox.style.opacity = '0'; }, 4000);
        }
        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        const category = new URLSearchParams(window.location.search).get('category');
        document.getElementById('page-title').textContent = category ? `Qualification Evaluation - ${category}` : 'Qualification Evaluation';

        let questions = [];

        async function load() {
            if (!category) { showAlert('Missing subject.', 'error'); return; }
            const res = await fetch(`/api/tutors/evaluation/${encodeURIComponent(category)}`);
            const data = await res.json();
            if (!data.success) { showAlert(data.error || 'Could not load evaluation.', 'error'); return; }

            document.getElementById('current-level').textContent = data.currentLevel ? `Currently approved to teach: ${data.currentLevel}` : 'Not yet evaluated for this subject.';

            if (!data.canEvaluate) {
                document.getElementById('cooldown-notice').textContent = "You've evaluated this subject recently - re-evaluation to unlock a higher level opens 12 months after your last evaluation.";
                document.getElementById('cooldown-notice').classList.remove('hidden');
                document.getElementById('submit-btn').classList.add('hidden');
                return;
            }

            questions = data.questions;
            if (!questions.length) {
                document.getElementById('no-quiz').classList.remove('hidden');
                document.getElementById('submit-btn').classList.add('hidden');
                return;
            }
            document.getElementById('quiz-editor').innerHTML = questions.map((q, qi) => `
                <div class="border border-gray-200 rounded-lg p-4">
                    <p class="font-semibold text-gray-800 mb-2">${qi + 1}. ${escapeHtml(q.question)}</p>
                    ${q.options.map((opt, oi) => `
                        <label class="flex items-center gap-2 mb-1 text-sm text-gray-600">
                            <input type="radio" name="q-${qi}" value="${oi}" class="text-primary-red">
                            ${escapeHtml(opt)}
                        </label>
                    `).join('')}
                </div>
            `).join('');
        }

        document.getElementById('submit-btn').addEventListener('click', async () => {
            const answers = questions.map((_, qi) => {
                const checked = document.querySelector(`input[name="q-${qi}"]:checked`);
                return checked ? Number(checked.value) : -1;
            });
            const res = await fetch(`/api/tutors/evaluation/${encodeURIComponent(category)}/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answers }),
            });
            const data = await res.json();
            if (!data.success) { showAlert(data.error || 'Submission failed.', 'error'); return; }
            showAlert(`Evaluated at ${Math.round(data.score * 100)}% - approved to teach up to ${data.level}.`, 'success');
            setTimeout(() => { window.location.href = '/become-tutor'; }, 1500);
        });

        load();
    </script>
    <script src="assets/mobile-nav.js"></script>
    <script src="assets/geo-location.js"></script>
    <script src="assets/footer.js"></script>
</body>
</html>
