<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Mozart Technique</title>
    <link rel="shortcut icon" href="mozartLogo.jpg" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { 'primary-red': '#E02126', 'primary-dark': '#1F2937' } } }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #121212, #1f1a1a);
            min-height: 100vh; display: flex; flex-direction: column;
        }
        .main-content-bg {
            background: linear-gradient(135deg, #b1191f 0%, #c41822 45%, #7e0e14 100%);
            flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 2rem 1rem;
        }
        .card {
            max-width: 440px; width: 100%;
            background: linear-gradient(180deg, #ffffff 0%, #fff7f7 100%);
            border-radius: 1.2rem; box-shadow: 0 24px 35px -10px rgba(0,0,0,.35); padding: 2rem;
        }
    </style>
</head>
<body>

    <div id="alert-box" class="fixed top-5 right-5 z-50 p-4 rounded-lg shadow-xl text-white font-medium max-w-sm opacity-0 transition-opacity duration-500" style="background-color:#222;">
        <span id="alert-message"></span>
    </div>

    <header class="sticky top-0 z-50 bg-white">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-20">
            <div class="flex items-center space-x-3">
                <img src="mozartLogo.jpg" alt="Mozart Technique logo" class="w-10 h-10 rounded-full object-cover shadow-sm">
                <span class="text-2xl font-extrabold text-primary-red">Mozart Technique</span>
            </div>
            <a href="/login" class="text-gray-700 font-medium hover:text-primary-red">Back to Login</a>
        </nav>
    </header>

    <div class="main-content-bg">
        <div class="card">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Forgot Your Password?</h2>
            <p class="text-gray-500 text-sm mb-6">Enter your account email and we'll generate a reset link.</p>

            <form id="forgot-form">
                <input type="email" id="email" placeholder="Email address" required
                       class="w-full px-4 py-3 mb-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-red focus:border-primary-red transition duration-150">
                <button type="submit" class="w-full py-3 bg-primary-red text-white font-semibold rounded-lg shadow-md border-2 border-primary-red hover:bg-white hover:text-primary-red transition duration-150">
                    Send Reset Link
                </button>
            </form>

            <div id="reset-link-box" class="hidden mt-6 p-4 bg-yellow-50 border border-yellow-200 rounded-lg text-sm">
                <p class="text-yellow-800 font-semibold mb-1"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Email isn't set up yet</p>
                <p class="text-gray-600 mb-3">We can't send this to your inbox yet, so here's your one-time reset link directly:</p>
                <a id="reset-link" href="#" class="block break-all text-primary-red font-semibold hover:underline"></a>
            </div>
        </div>
    </div>

    <script>
        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');
        function showAlert(message, type = 'info') {
            alertMessage.textContent = message;
            alertBox.style.backgroundColor = type === 'error' ? '#B91C1C' : type === 'success' ? '#059669' : '#1F2937';
            alertBox.style.opacity = '1';
            setTimeout(() => { alertBox.style.opacity = '0'; }, 4000);
        }

        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const res = await fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email }),
            });
            const data = await res.json();
            if (data.success) {
                const link = document.getElementById('reset-link');
                link.href = data.resetUrl;
                link.textContent = window.location.origin + data.resetUrl;
                document.getElementById('reset-link-box').classList.remove('hidden');
            } else {
                showAlert(data.error || 'Could not process request.', 'error');
            }
        });
    </script>
</body>
</html>
