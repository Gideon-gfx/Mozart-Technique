<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Agent | Mozart Techniques</title><link rel="icon" href="/mozartLogo.jpg"><link rel="stylesheet" href="/assets/support-agent.css"><style>body{font-family:Arial;background:#f8f5f3;color:#211d1a}.shell{max-width:1300px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:28px}.top p{color:#736c66}.top a{color:#c41822;font-weight:bold;text-decoration:none}.layout{display:grid;grid-template-columns:330px 1fr;background:#fff;border:1px solid #eaded7;border-radius:18px;overflow:hidden}.list{padding:14px;overflow:auto;border-right:1px solid #eaded7}.queue{font-size:11px;text-transform:uppercase;font-weight:bold;letter-spacing:.1em;color:#736c66;padding:5px}.thread{width:100%;text-align:left;border:0;border-radius:12px;padding:13px;margin:5px 0;background:#fff;cursor:pointer}.thread:hover,.thread.active{background:#fff0f0}.thread b,.thread small{display:block}.thread small{margin-top:4px;color:#736c66;font-size:11px;text-transform:capitalize}.role-tag{display:inline-block!important;background:#f5e6e6;color:#9c151d;border-radius:999px;padding:3px 7px;margin-top:6px!important;font-size:10px!important;font-weight:bold;text-transform:capitalize}.chat{display:flex;flex-direction:column}.chat header{padding:17px;border-bottom:1px solid #eaded7;font-weight:bold}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:9px}.message{width:fit-content;max-width:75%;padding:10px 12px;border-radius:15px 15px 15px 4px;background:#f4f1ef;line-height:1.4;font-size:14px}.message b{font-size:10px;opacity:.7}.message a{color:inherit;font-weight:bold}.message.agent,.message.admin{align-self:flex-end;background:#c41822;color:white;border-radius:15px 15px 4px 15px}.message.assistant{background:#f8e9ea}.reply{display:flex;gap:8px;padding:12px;border-top:1px solid #eaded7;background:#fff}.reply input{min-width:0;flex:1;border:1px solid #d8cfca;border-radius:999px;padding:11px 13px;font:inherit}.reply button,.attach{border:0;background:#c41822;color:#fff;border-radius:999px;padding:10px 15px;font-weight:bold;cursor:pointer}.attach{display:grid;place-items:center;width:40px;padding:0;font-size:20px;background:#fff1f1;color:#a91018;border:1px solid #ebced0}.reply button:disabled{opacity:.5}.empty{color:#736c66;text-align:center;padding:25px}@media(max-width:760px){.top h1{font-size:22px}.top p{font-size:13px}.layout{grid-template-columns:1fr}.list{border-right:0;border-bottom:1px solid #eaded7}}</style></head><body><main class="shell"><div class="top"><div><h1>Support Agent Inbox</h1><p>Live support conversations from Mozart Techniques users.</p></div><a href="/dashboard">← Dashboard</a></div><div class="layout"><aside class="list"><div class="queue">Conversation queue</div><div id="threads">Loading conversations…</div></aside><section class="chat"><header id="conversation-title">Select a conversation</header><div class="messages" id="messages"><p class="empty">Select a conversation to reply.</p></div><form class="reply" id="reply-form"><label class="attach" title="Attach a file">＋<input id="file-input" type="file" hidden></label><textarea id="reply-text" rows="1" enterkeyhint="enter" placeholder="Claim a conversation before replying" disabled></textarea><button id="reply-button" disabled>Send</button><button id="claim-button" type="button" hidden>Claim</button></form></section></div></main><script>let all=[],active=null;const list=document.querySelector('#threads'),messages=document.querySelector('#messages'),title=document.querySelector('#conversation-title'),input=document.querySelector('#reply-text'),send=document.querySelector('#reply-button'),claim=document.querySelector('#claim-button'),file=document.querySelector('#file-input');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const label=t=>String(t||'user').replace('_',' ');function draw(){list.innerHTML=all.length?all.map(t=>`<button class="thread ${active&&active.id===t.id?'active':''}" data-id="${t.id}"><b>${esc(t.userName||t.userEmail)}</b><small>${esc(t.status.replaceAll('_',' '))}</small><small class="role-tag">${esc(label(t.customerRole))}</small></button>`).join(''):'<p class="empty">No support conversations yet.</p>';list.querySelectorAll('.thread').forEach(b=>b.onclick=()=>{active=all.find(t=>t.id===Number(b.dataset.id));show();draw();});}function show(){if(!active)return;const customer=active.userName||active.userEmail||'Customer';title.innerHTML=`Conversation with ${esc(customer)} <span class="role-tag">${esc(label(active.customerRole))}</span>`;messages.innerHTML=active.messages.map(m=>`<div class="message ${esc(m.sender)}"><b>${m.sender==='user'?esc(customer):m.sender==='assistant'?'Live support':'You'}</b><br>${m.attachment?`<a href="${esc(m.attachment.url)}" target="_blank">📎 ${esc(m.attachment.name)}</a>`:esc(m.text)}</div>`).join('');messages.scrollTop=messages.scrollHeight;const mine=active.assignedAgentId===window.currentUserId,canReply=active.status==='assigned'&&(mine||window.isAdmin);input.disabled=!canReply;send.disabled=!canReply;file.disabled=!canReply;claim.hidden=active.status!=='waiting_for_agent';}async function load(){const r=await fetch('/api/support-agent/threads');if(!r.ok){list.textContent='You do not have Support Agent access.';return;}const d=await r.json();all=d.threads;if(active)active=all.find(t=>t.id===active.id)||null;draw();show();}claim.onclick=async()=>{const r=await fetch(`/api/support-agent/threads/${active.id}/claim`,{method:'POST'});const d=await r.json();if(!r.ok)return alert(d.error||'Could not claim conversation.');await load();};document.querySelector('#reply-form').onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text||!active)return;const r=await fetch(`/api/support-agent/threads/${active.id}/message`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});const d=await r.json();if(!r.ok)return alert(d.error||'Could not send reply.');input.value='';await load();};file.onchange=async()=>{const chosen=file.files[0];if(!chosen||!active)return;const data=new FormData();data.append('file',chosen);file.value='';const r=await fetch(`/api/support-agent/threads/${active.id}/attachment`,{method:'POST',body:data});const d=await r.json();if(!r.ok)return alert(d.error||'Could not upload file.');await load();};fetch('/api/session').then(r=>r.json()).then(d=>{window.currentUserId=d.user&&d.user.id;window.isAdmin=d.user&&d.user.role==='admin';load();});setInterval(load,12000);</script></body></html>
