<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Mozart Technique</title>
    <link rel="shortcut icon" href="mozartLogo.jpg" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-red': '#E02126',
                        'primary-dark': '#1F2937',
                        'secondary-dark': '#121212',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #121212, #1f1a1a);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-content-bg {
            background: linear-gradient(135deg, #b1191f 0%, #c41822 45%, #7e0e14 100%);
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }
        .payment-card {
            max-width: 460px;
            width: 100%;
            background: linear-gradient(180deg, #ffffff 0%, #fff7f7 100%);
            border-radius: 1.2rem;
            box-shadow: 0 24px 35px -10px rgba(0,0,0,0.35);
            padding: 2rem;
        }
        .payment-card input, .payment-card select {
            border-radius: 0.85rem;
        }
    </style>
</head>
<body>

    <div id="alert-box" class="fixed top-5 right-5 z-50 p-4 rounded-lg shadow-xl text-white font-medium max-w-sm opacity-0 transition-opacity duration-500" style="background-color:#222;">
        <span id="alert-message"></span>
    </div>

    <header class="sticky top-0 z-50 bg-white">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-20">
            <div class="flex items-center space-x-3">
                <img src="mozartLogo.jpg" alt="Mozart Technique logo" class="w-10 h-10 rounded-full object-cover shadow-sm">
                <span class="text-2xl font-extrabold text-primary-red">Mozart Technique</span>
            </div>
            <div class="hidden md:flex items-center space-x-6 text-gray-700 font-medium">
                <a href="dashboard.html" class="hover:text-primary-red transition duration-150">Dashboard</a>
                <a href="courses.html" class="hover:text-primary-red transition duration-150">Courses</a>
            </div>
        </nav>
    </header>

    <div class="main-content-bg">
        <div class="payment-card">
            <h2 class="text-2xl font-bold text-gray-800 mb-1">Complete Your Enrollment</h2>
            <p id="course-title" class="text-gray-500 mb-6">Loading course...</p>

            <form id="payment-form">
                <label class="block text-sm font-semibold text-gray-600 mb-1">Amount</label>
                <input type="text" id="amount" disabled
                       class="w-full px-4 py-3 mb-4 border border-gray-300 text-gray-700 bg-gray-100">

                <label class="block text-sm font-semibold text-gray-600 mb-1">Card Number</label>
                <input type="text" id="card-number" placeholder="4242 4242 4242 4242" maxlength="19" required
                       class="w-full px-4 py-3 mb-4 border border-gray-300 focus:ring-2 focus:ring-primary-red focus:border-primary-red transition duration-150">

                <div class="flex space-x-4 mb-4">
                    <div class="flex-1">
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Expiry</label>
                        <input type="text" id="card-expiry" placeholder="MM/YY" maxlength="5" required
                               class="w-full px-4 py-3 border border-gray-300 focus:ring-2 focus:ring-primary-red focus:border-primary-red transition duration-150">
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-semibold text-gray-600 mb-1">CVC</label>
                        <input type="text" id="card-cvc" placeholder="123" maxlength="4" required
                               class="w-full px-4 py-3 border border-gray-300 focus:ring-2 focus:ring-primary-red focus:border-primary-red transition duration-150">
                    </div>
                </div>

                <label for="payment-method" class="block text-sm font-semibold text-gray-600 mb-1">Payment Method</label>
                <select id="payment-method" class="w-full px-4 py-3 mb-6 border border-gray-300">
                    <option value="credit-card">Credit Card</option>
                    <option value="paypal">PayPal</option>
                </select>

                <button type="submit" id="pay-btn"
                        class="w-full py-3 bg-primary-red text-white font-semibold rounded-lg shadow-md hover:bg-red-700 transition duration-150 transform hover:scale-[1.005]">
                    Pay Now
                </button>
            </form>
        </div>
    </div>

    <script>
        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');

        function showAlert(message, type = 'info') {
            alertMessage.textContent = message;
            alertBox.style.backgroundColor = type === 'error' ? '#B91C1C' : type === 'success' ? '#059669' : '#1F2937';
            alertBox.classList.add('show');
            alertBox.style.opacity = '1';
            setTimeout(() => { alertBox.style.opacity = '0'; }, 4000);
        }

        const courseId = window.location.pathname.split('/').filter(Boolean).pop();
        let currentCourse = null;

        async function loadCourse() {
            const res = await fetch(`/api/courses/${courseId}`);
            const data = await res.json();
            if (!data.success) {
                showAlert('Course not found.', 'error');
                setTimeout(() => { window.location.href = '/courses'; }, 1200);
                return;
            }
            currentCourse = data.course;
            document.getElementById('course-title').textContent = `${currentCourse.title} - $${currentCourse.price}/mo`;
            document.getElementById('amount').value = `$${currentCourse.price}.00`;
        }

        document.getElementById('payment-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payBtn = document.getElementById('pay-btn');
            payBtn.disabled = true;
            payBtn.textContent = 'Processing...';

            const method = document.getElementById('payment-method').value;

            try {
                const res = await fetch('/api/payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ courseId, method }),
                });
                const data = await res.json();

                if (res.status === 401) {
                    window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname);
                    return;
                }

                if (!data.success) {
                    showAlert(data.error || 'Payment failed.', 'error');
                    payBtn.disabled = false;
                    payBtn.textContent = 'Pay Now';
                    return;
                }

                showAlert(data.message || 'Payment successful!', 'success');
                setTimeout(() => { window.location.href = data.redirect; }, 900);
            } catch (err) {
                showAlert('Something went wrong. Please try again.', 'error');
                payBtn.disabled = false;
                payBtn.textContent = 'Pay Now';
            }
        });

        loadCourse();
    </script>
    <script src="assets/mobile-nav.js"></script>
    <script src="assets/footer.js"></script>
</body>
</html>
