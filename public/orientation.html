<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Orientation - Mozart Technique</title>
    <link rel="shortcut icon" href="mozartLogo.jpg" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { 'primary-red': '#E02126', 'primary-dark': '#1F2937' } } }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f5f5; }
        .video-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: .75rem; overflow: hidden; }
        .video-wrap iframe, .video-wrap video { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="alert-box" class="fixed top-5 right-5 z-50 p-4 rounded-lg shadow-xl text-white font-medium max-w-sm opacity-0 transition-opacity duration-500" style="background-color:#222;">
        <span id="alert-message"></span>
    </div>

    <header class="sticky top-0 z-50 bg-white shadow-sm">
        <nav class="max-w-3xl mx-auto px-4 sm:px-6 flex items-center justify-between h-20">
            <div class="flex items-center space-x-3">
                <img src="mozartLogo.jpg" alt="Mozart Technique logo" class="w-10 h-10 rounded-full object-cover shadow-sm">
                <span class="text-2xl font-extrabold text-primary-red">Mozart Technique</span>
            </div>
            <a href="/dashboard" class="text-gray-600 hover:text-primary-red font-medium">Back to Dashboard</a>
        </nav>
    </header>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 py-10">
        <div id="already-done" class="hidden bg-white rounded-2xl shadow-lg p-8 text-center">
            <i class="fa-solid fa-trophy text-primary-red text-4xl mb-4"></i>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Orientation Complete</h1>
            <p id="reward-text" class="text-gray-500"></p>
        </div>

        <div id="orientation-body" class="hidden bg-white rounded-2xl shadow-lg p-6 sm:p-8">
            <h1 class="text-2xl font-bold text-gray-800 mb-1">Tutor Orientation</h1>
            <p class="text-gray-500 mb-6">Watch the technique-teaching primer below, then answer a few quick questions. Pass and you'll earn a one-time welcome reward.</p>

            <div id="video-section" class="mb-4"></div>
            <h2 id="content-title" class="font-bold text-gray-800 mb-2"></h2>
            <p id="content-notes" class="text-gray-600 mb-6 whitespace-pre-wrap"></p>

            <div id="quiz-editor" class="space-y-4 mb-4"></div>
            <p id="no-quiz" class="hidden text-gray-400 text-sm mb-4">No quiz has been set up yet - check back soon.</p>
            <button id="submit-btn" class="px-6 py-3 bg-primary-red text-white font-semibold rounded-lg shadow-md hover:bg-red-700 transition duration-150">
                Submit
            </button>
        </div>
    </main>

    <script>
        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');
        function showAlert(message, type = 'info') {
            alertMessage.textContent = message;
            alertBox.style.backgroundColor = type === 'error' ? '#B91C1C' : type === 'success' ? '#059669' : '#1F2937';
            alertBox.style.opacity = '1';
            setTimeout(() => { alertBox.style.opacity = '0'; }, 4000);
        }
        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        const rewardLabels = { bonus_student: "a bonus-matched student, prioritized on your next match", monetary: 'a one-time monetary bonus - an admin will follow up with you' };

        let questions = [];

        async function load() {
            const res = await fetch('/api/tutors/orientation');
            const data = await res.json();
            if (!data.success) { showAlert(data.error || 'Could not load orientation.', 'error'); return; }

            if (data.completed) {
                document.getElementById('reward-text').textContent = data.reward
                    ? `You received ${rewardLabels[data.reward] || data.reward}.`
                    : "You've already completed orientation.";
                document.getElementById('already-done').classList.remove('hidden');
                return;
            }

            document.getElementById('orientation-body').classList.remove('hidden');
            const content = data.content;
            if (content) {
                document.getElementById('content-title').textContent = content.title;
                document.getElementById('content-notes').textContent = content.notes;
                if (content.videoUrl) {
                    document.getElementById('video-section').innerHTML = `
                        <div class="video-wrap"><video controls src="${escapeHtml(content.videoUrl)}"></video></div>
                    `;
                }
            }

            questions = data.questions;
            if (!questions.length) {
                document.getElementById('no-quiz').classList.remove('hidden');
                document.getElementById('submit-btn').classList.add('hidden');
                return;
            }
            document.getElementById('quiz-editor').innerHTML = questions.map((q, qi) => `
                <div class="border border-gray-200 rounded-lg p-4">
                    <p class="font-semibold text-gray-800 mb-2">${qi + 1}. ${escapeHtml(q.question)}</p>
                    ${q.options.map((opt, oi) => `
                        <label class="flex items-center gap-2 mb-1 text-sm text-gray-600">
                            <input type="radio" name="q-${qi}" value="${oi}" class="text-primary-red">
                            ${escapeHtml(opt)}
                        </label>
                    `).join('')}
                </div>
            `).join('');
        }

        document.getElementById('submit-btn').addEventListener('click', async () => {
            const answers = questions.map((_, qi) => {
                const checked = document.querySelector(`input[name="q-${qi}"]:checked`);
                return checked ? Number(checked.value) : -1;
            });
            const res = await fetch('/api/tutors/orientation/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answers }),
            });
            const data = await res.json();
            if (!data.success) { showAlert(data.error || 'Submission failed.', 'error'); return; }
            if (data.passed) {
                showAlert('Orientation complete!', 'success');
                document.getElementById('orientation-body').classList.add('hidden');
                document.getElementById('reward-text').textContent = `You received ${rewardLabels[data.reward] || data.reward}.`;
                document.getElementById('already-done').classList.remove('hidden');
            } else {
                showAlert(`Score: ${Math.round(data.score * 100)}%. Review the material and try again.`, 'error');
            }
        });

        load();
    </script>
    <script src="assets/mobile-nav.js"></script>
    <script src="assets/footer.js"></script>
</body>
</html>
