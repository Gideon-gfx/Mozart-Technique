<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Mozart Techniques</title>
    <link rel="shortcut icon" href="/mozartLogo.jpg" type="image/x-icon">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#c41822">
    <link rel="apple-touch-icon" href="/assets/icon-512.png">
    <script src="/assets/install-prompt.js" defer></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { 'primary-red': '#cc0000', 'primary-dark': '#1F2937' } } }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f8f8f8 100%);
            min-height: 100vh; display: flex; flex-direction: column;
        }
        .main-content-bg {
            background: linear-gradient(135deg, #fff 0%, #fff6f6 52%, #fff 100%);
            flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 2rem 1rem;
        }
        .card {
            max-width: 440px; width: 100%;
            background: linear-gradient(180deg, #ffffff 0%, #fff7f7 100%);
            border-radius: 1.2rem; box-shadow: 0 24px 35px -10px rgba(0,0,0,.35); padding: 2rem;
        }
        @media (min-width: 1241px) {
            .login-top-nav { width:100%; max-width:1440px; gap:clamp(12px,1.6vw,28px); padding-left:clamp(16px,2.4vw,40px); padding-right:clamp(16px,2.4vw,40px); }
            .login-top-nav > a { flex:0 0 auto; }
            .login-top-nav > a span { font-size:clamp(1rem,1.35vw,1.4rem); white-space:nowrap; }
            .login-top-links { flex:1 1 auto; min-width:0; justify-content:flex-end; gap:clamp(8px,1vw,16px); white-space:nowrap; }
            .login-top-links > :not([hidden]) ~ :not([hidden]) { margin:0 !important; }
            .login-top-links > a { white-space:nowrap; font-size:clamp(.78rem,.88vw,.9rem); }
            .login-top-links > a:last-child { padding-left:clamp(12px,1.2vw,20px); padding-right:clamp(12px,1.2vw,20px); }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/redesign.css">
</head>
<body>

    <div id="alert-box" class="fixed top-5 right-5 z-50 p-4 rounded-lg shadow-xl text-white font-medium max-w-sm opacity-0 transition-opacity duration-500" style="background-color:#222;">
        <span id="alert-message"></span>
    </div>

    <header class="sticky top-0 z-50 bg-white">
        <nav class="login-top-nav max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-20">
            <a href="/home" class="flex items-center space-x-3">
                <img src="/mozartLogo.jpg" alt="Mozart Techniques logo" class="w-10 h-10 rounded-full object-cover shadow-sm">
                <span class="text-2xl font-extrabold serif text-[#333]">Mozart Techniques</span>
            </a>
            <div class="login-top-links hidden md:flex items-center space-x-6 text-gray-700 font-medium">
                <a href="/home">Home</a><a href="/find-tutor">Find a Tutor</a><a href="/become-tutor">Become a Tutor</a>
                <a href="/become-sponsor">Sponsors</a><a href="/about">About</a><a href="/store">Store</a>
                <div class="mt-perf-dropdown" data-mt-perf-dropdown><button type="button" class="mt-perf-dropdown-toggle" data-mt-perf-toggle>Performance <i class="fa-solid fa-chevron-down"></i></button><div class="mt-perf-dropdown-menu" data-mt-perf-menu><a href="/become-performer">Become a Performer</a><a href="/find-performer">Find a Performer</a></div></div>
                <a href="/contact">Contact</a><a href="/search" title="Search"><i class="fa-solid fa-magnifying-glass"></i></a>
                <a href="/login" class="text-gray-700 font-medium hover:text-primary-red">Back to Login</a>
            </div>
        </nav>
    </header>

    <div class="main-content-bg">
        <div class="card">
            <div id="form-state">
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Set a New Password</h2>
                <p class="text-gray-500 text-sm mb-6">Choose a new password for your account.</p>

                <form id="reset-form">
                    <input type="password" id="password" placeholder="New password (min 6 characters)" required
                           class="w-full px-4 py-3 mb-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-red focus:border-primary-red transition duration-150">
                    <input type="password" id="confirm-password" placeholder="Confirm new password" required
                           class="w-full px-4 py-3 mb-6 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-red focus:border-primary-red transition duration-150">
                    <button type="submit" class="w-full py-3 bg-primary-red text-white font-semibold rounded-lg shadow-md border-2 border-primary-red hover:bg-white hover:text-primary-red transition duration-150">
                        Reset Password
                    </button>
                </form>
            </div>

            <div id="no-token-state" class="hidden text-center">
                <i class="fa-solid fa-triangle-exclamation text-primary-red text-3xl mb-3"></i>
                <h2 class="text-xl font-bold text-gray-800 mb-2">Invalid Reset Link</h2>
                <p class="text-gray-500 mb-6">This link is missing its token. Request a new one.</p>
                <a href="/forgot-password" class="inline-flex items-center justify-center px-6 py-3 bg-primary-red text-white font-semibold rounded-lg shadow-md hover:bg-red-700 transition duration-150">
                    Request New Link
                </a>
            </div>
        </div>
    </div>

    <script>
        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');
        function showAlert(message, type = 'info') {
            alertMessage.textContent = message;
            alertBox.style.backgroundColor = type === 'error' ? '#B91C1C' : type === 'success' ? '#059669' : '#1F2937';
            alertBox.style.opacity = '1';
            setTimeout(() => { alertBox.style.opacity = '0'; }, 4000);
        }

        const token = new URLSearchParams(window.location.search).get('token');
        if (!token) {
            document.getElementById('form-state').classList.add('hidden');
            document.getElementById('no-token-state').classList.remove('hidden');
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;
            if (password !== confirm) {
                showAlert('Passwords do not match.', 'error');
                return;
            }
            const res = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, password }),
            });
            const data = await res.json();
            if (data.success) {
                showAlert('Password reset! Redirecting to login...', 'success');
                setTimeout(() => { window.location.href = '/login'; }, 1200);
            } else {
                showAlert(data.error || 'Could not reset password.', 'error');
            }
        });
    </script>
    <script src="/assets/mobile-nav.js"></script>
  <script src="/assets/scroll-reveal.js?v=1" defer></script>
    <script src="/assets/nav-performance.js" defer></script>
    <script src="/assets/footer.js"></script>
</body>
</html>
