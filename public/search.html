<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Mozart Technique</title>
    <link rel="shortcut icon" href="mozartLogo.jpg" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { 'primary-red': '#E02126', 'primary-dark': '#1F2937' } } }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f5f5; }
        .result-card { background: #fff; border-radius: .75rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,.1); padding: 1.25rem; }
    </style>
</head>
<body>

    <div id="alert-box" class="fixed top-5 right-5 z-50 p-4 rounded-lg shadow-xl text-white font-medium max-w-sm opacity-0 transition-opacity duration-500" style="background-color:#222;">
        <span id="alert-message"></span>
    </div>

    <header class="sticky top-0 z-50 bg-white shadow-sm">
        <nav class="max-w-5xl mx-auto px-4 sm:px-6 flex items-center justify-between h-20">
            <a href="/home" class="flex items-center space-x-3">
                <img src="mozartLogo.jpg" alt="Mozart Technique logo" class="w-10 h-10 rounded-full object-cover shadow-sm">
                <span class="text-2xl font-extrabold text-primary-red">Mozart Technique</span>
            </a>
            <a href="/dashboard" class="text-gray-600 hover:text-primary-red font-medium">Dashboard</a>
        </nav>
    </header>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-10">
        <div class="relative mb-8">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input id="search-input" type="text" placeholder="Search courses and tutors - e.g. piano, jazz, guitar..."
                   class="w-full pl-12 pr-4 py-4 text-lg border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-red">
        </div>

        <div id="empty-hint" class="text-center text-gray-400 py-16">
            <i class="fa-solid fa-magnifying-glass text-4xl mb-3"></i>
            <p>Start typing to search the course catalog and approved tutors together.</p>
        </div>

        <div id="results" class="hidden">
            <section class="mb-10">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Courses <span id="course-count" class="text-gray-400 font-normal"></span></h2>
                <div id="course-results" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
                <p id="no-course-results" class="hidden text-gray-400 text-sm">No matching courses.</p>
            </section>

            <section>
                <h2 class="text-lg font-bold text-gray-800 mb-4">Tutors <span id="tutor-count" class="text-gray-400 font-normal"></span></h2>
                <div id="tutor-results" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
                <p id="no-tutor-results" class="hidden text-gray-400 text-sm">No matching tutors.</p>
            </section>
        </div>
    </main>

    <script>
        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');
        function showAlert(message, type = 'info') {
            alertMessage.textContent = message;
            alertBox.style.backgroundColor = type === 'error' ? '#B91C1C' : type === 'success' ? '#059669' : '#1F2937';
            alertBox.style.opacity = '1';
            setTimeout(() => { alertBox.style.opacity = '0'; }, 4000);
        }
        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        function courseCardHtml(c) {
            return `
                <a href="/courses/${c.slug}" class="result-card block hover:-translate-y-1 transition duration-150">
                    <span class="block text-xs font-semibold uppercase tracking-wide text-primary-red mb-1">${escapeHtml(c.category)} &middot; ${escapeHtml(c.level)}</span>
                    <h3 class="text-lg font-bold text-gray-800 mb-2">${escapeHtml(c.title)}</h3>
                    <p class="text-primary-red font-extrabold">${c.symbol}${c.localPrice}<span class="text-xs font-medium text-gray-400">/mo</span></p>
                </a>
            `;
        }

        function tutorCardHtml(t) {
            const rating = t.avgRating != null ? `<span class="text-amber-600 font-semibold"><i class="fa-solid fa-star"></i> ${t.avgRating.toFixed(1)}</span>` : '<span class="text-gray-400">Not yet rated</span>';
            return `
                <a href="/tutors/${t.id}" class="result-card block hover:-translate-y-1 transition duration-150">
                    <div class="flex items-start justify-between mb-1">
                        <h3 class="font-bold text-gray-800">${escapeHtml(t.name)}</h3>
                        <span class="text-primary-red font-extrabold whitespace-nowrap text-sm">${t.symbol}${t.hourlyRateLocal}/hr</span>
                    </div>
                    <p class="text-xs text-primary-red font-semibold uppercase mb-2">${t.categories.map((c) => escapeHtml(c)).join(', ')}</p>
                    <p class="text-sm mb-1">${rating}</p>
                    <p class="text-sm text-gray-600">${t.bio ? escapeHtml(t.bio) : `${escapeHtml(t.city || 'Online')}`}</p>
                </a>
            `;
        }

        let searchTimer;
        async function runSearch(q) {
            if (!q) {
                document.getElementById('empty-hint').classList.remove('hidden');
                document.getElementById('results').classList.add('hidden');
                return;
            }
            const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
            const data = await res.json();
            if (!data.success) { showAlert('Search failed.', 'error'); return; }

            document.getElementById('empty-hint').classList.add('hidden');
            document.getElementById('results').classList.remove('hidden');

            document.getElementById('course-count').textContent = `(${data.courses.length})`;
            document.getElementById('course-results').innerHTML = data.courses.map(courseCardHtml).join('');
            document.getElementById('no-course-results').classList.toggle('hidden', data.courses.length > 0);

            document.getElementById('tutor-count').textContent = `(${data.tutors.length})`;
            document.getElementById('tutor-results').innerHTML = data.tutors.map(tutorCardHtml).join('');
            document.getElementById('no-tutor-results').classList.toggle('hidden', data.tutors.length > 0);
        }

        const input = document.getElementById('search-input');
        input.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => runSearch(input.value.trim()), 250);
        });

        const initialQuery = new URLSearchParams(window.location.search).get('q');
        if (initialQuery) {
            input.value = initialQuery;
            runSearch(initialQuery);
        }
    </script>
    <script src="assets/mobile-nav.js"></script>
    <script src="assets/footer.js"></script>
</body>
</html>
