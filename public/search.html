<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Mozart Techniques</title>
    <link rel="shortcut icon" href="/mozartLogo.jpg" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { 'primary-red': '#cc0000', 'primary-dark': '#1F2937' } } }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/redesign.css">
    <link rel="stylesheet" href="/assets/site.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #ffffff 0%, #f8f8f8 100%); }
        .result-card { background: #fff; border-radius: .75rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,.1); padding: 1.25rem; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="alert-box" class="fixed top-5 right-5 z-50 p-4 rounded-lg shadow-xl text-white font-medium max-w-sm opacity-0 transition-opacity duration-500" style="background-color:#222;">
        <span id="alert-message"></span>
    </div>

    <header class="sticky top-0 z-50 bg-white shadow-sm">
        <nav class="max-w-5xl mx-auto px-4 sm:px-6 flex items-center justify-between h-20">
            <a href="/home" class="flex items-center space-x-3">
                <img src="/mozartLogo.jpg" alt="Mozart Techniques logo" class="w-10 h-10 rounded-full object-cover shadow-sm">
                <span class="text-2xl font-extrabold serif text-[#333]">Mozart Techniques</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="/dashboard" class="text-gray-600 hover:text-primary-red font-medium">Dashboard</a>
                <div id="auth-state"></div>
            </div>
        </nav>
    </header>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-10">
        <div class="relative mb-8">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input id="search-input" type="text" placeholder="Search tutors - e.g. piano, jazz, guitar..."
                   class="w-full pl-12 pr-4 py-4 text-lg border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-red">
        </div>

        <div id="empty-hint" class="text-center text-gray-400 py-16">
            <i class="fa-solid fa-magnifying-glass text-4xl mb-3"></i>
            <p>Start typing to search approved tutors by name, subject, genre, or bio.</p>
        </div>

        <div id="results" class="hidden">
            <section class="mb-8">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Tutors <span id="tutor-count" class="text-gray-400 font-normal"></span></h2>
                <div id="tutor-results" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
                <p id="no-tutor-results" class="hidden text-gray-400 text-sm">No matching tutors.</p>
            </section>
            <section>
                <h2 class="text-lg font-bold text-gray-800 mb-4">Library Videos <span id="video-count" class="text-gray-400 font-normal"></span></h2>
                <div id="video-results" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
                <p id="no-video-results" class="hidden text-gray-400 text-sm">No matching library videos.</p>
            </section>
        </div>
    </main>

    <script>
        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');
        function showAlert(message, type = 'info') {
            alertMessage.textContent = message;
            alertBox.style.backgroundColor = type === 'error' ? '#B91C1C' : type === 'success' ? '#059669' : '#1F2937';
            alertBox.style.opacity = '1';
            setTimeout(() => { alertBox.style.opacity = '0'; }, 4000);
        }
        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        function initials(name) {
            return (name || '?').split(' ').map((p) => p[0]).join('').slice(0, 2).toUpperCase();
        }

        function tutorCardHtml(t) {
            const rating = t.avgRating != null ? `<span class="text-amber-600 font-semibold"><i class="fa-solid fa-star"></i> ${t.avgRating.toFixed(1)}</span>` : '<span class="text-gray-400">Not yet rated</span>';
            const avatar = t.photoUrl
                ? `<img src="${escapeHtml(t.photoUrl)}" alt="${escapeHtml(t.name)}" class="w-12 h-12 rounded-full object-cover shrink-0">`
                : `<div class="w-12 h-12 rounded-full shrink-0 flex items-center justify-center text-white font-bold" style="background:linear-gradient(135deg,#cc0000,#7e0e14);">${initials(t.name)}</div>`;
            return `
                <a href="/tutors/${t.id}" class="result-card block hover:-translate-y-1 transition duration-150">
                    <div class="flex items-start gap-3 mb-1">
                        ${avatar}
                        <div class="min-w-0 flex-1">
                            <div class="flex items-start justify-between gap-2">
                                <h3 class="font-bold text-gray-800 truncate">${escapeHtml(t.name)}</h3>
                                <span class="text-primary-red font-extrabold whitespace-nowrap text-sm">${t.symbol}${t.hourlyRateLocal}/hr</span>
                            </div>
                            <p class="text-xs text-primary-red font-semibold uppercase">${t.categories.map((c) => escapeHtml(c)).join(', ')}</p>
                        </div>
                    </div>
                    ${t.fullAddress ? `<p class="text-xs text-gray-500 mt-1"><i class="fa-solid fa-location-dot mr-1"></i>${escapeHtml(t.fullAddress)}</p>` : ''}
                    <p class="text-sm mb-1 mt-2">${rating}</p>
                    <p class="text-sm text-gray-600">${t.bio ? escapeHtml(t.bio) : `${escapeHtml(t.city || 'Online')}`}</p>
                </a>
            `;
        }

        function videoCardHtml(video) {
            const label = video.ownerScope === 'tutor' ? `Tutor upload · ${escapeHtml(video.ownerName || 'Tutor')}` : 'Mozart Techniques library';
            const preview = video.isFile || /\.(mp4|webm|ogg|mov|m4v)(?:[?#]|$)/i.test(String(video.url || ''))
                ? `<video src="${escapeHtml(video.url)}" class="w-full h-44 object-cover rounded-xl bg-black" controls preload="metadata"></video>`
                : `<div class="w-full h-44 rounded-xl bg-gradient-to-br from-red-50 to-stone-100 border border-red-100 flex items-center justify-center text-center p-4"><div><i class="fa-solid fa-video text-2xl text-primary-red mb-2"></i><p class="text-sm font-semibold text-gray-700">${escapeHtml(video.title)}</p></div></div>`;
            return `
                <article class="result-card block hover:-translate-y-1 transition duration-150">
                    ${preview}
                    <div class="mt-4">
                        <p class="text-xs uppercase tracking-wide text-primary-red font-semibold mb-1">${label}</p>
                        <h3 class="font-bold text-gray-800">${escapeHtml(video.title)}</h3>
                        <p class="text-xs text-gray-500 mt-1">${video.category ? escapeHtml(video.category) : 'All subjects'}${video.genre ? ' · ' + escapeHtml(video.genre) : ''}</p>
                        ${video.description ? `<p class="text-sm text-gray-600 mt-2">${escapeHtml(video.description)}</p>` : ''}
                        <a href="${escapeHtml(video.url)}" target="_blank" rel="noopener noreferrer" class="inline-block mt-3 text-sm font-semibold text-primary-red hover:underline">Open video</a>
                    </div>
                </article>
            `;
        }

        let searchTimer;
        async function runSearch(q) {
            if (!q) {
                document.getElementById('empty-hint').classList.remove('hidden');
                document.getElementById('results').classList.add('hidden');
                return;
            }
            const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
            const data = await res.json();
            if (!data.success) { showAlert('Search failed.', 'error'); return; }

            document.getElementById('empty-hint').classList.add('hidden');
            document.getElementById('results').classList.remove('hidden');

            document.getElementById('tutor-count').textContent = `(${data.tutors.length})`;
            document.getElementById('tutor-results').innerHTML = data.tutors.map(tutorCardHtml).join('');
            document.getElementById('no-tutor-results').classList.toggle('hidden', data.tutors.length > 0);

            document.getElementById('video-count').textContent = `(${data.videos.length})`;
            document.getElementById('video-results').innerHTML = data.videos.map(videoCardHtml).join('');
            document.getElementById('no-video-results').classList.toggle('hidden', data.videos.length > 0);
        }

        const input = document.getElementById('search-input');
        input.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => runSearch(input.value.trim()), 250);
        });

        const initialQuery = new URLSearchParams(window.location.search).get('q');
        if (initialQuery) {
            input.value = initialQuery;
            runSearch(initialQuery);
        }
    </script>
    <script src="/assets/nav-auth.js"></script>
    <script src="/assets/mobile-nav.js"></script>
    <script src="/assets/geo-location.js"></script>
    <script src="/assets/footer.js"></script>
</body>
</html>
