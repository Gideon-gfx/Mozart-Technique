<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Mozart Techniques</title>
    <link rel="shortcut icon" href="/mozartLogo.jpg" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { 'primary-red': '#cc0000', 'primary-dark': '#1F2937' } } }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/redesign.css">
    <link rel="stylesheet" href="/assets/site.css">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: linear-gradient(135deg, #ffffff 0%, #f8f8f8 100%); }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .brand img { width: 36px; height: 36px; border-radius: 12px; object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .brand span { font-family: 'Science Gothic', sans-serif; font-weight: 700; font-size: 1.15rem; color: #333; letter-spacing: .03em; }

        .thread {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px;
            border-bottom: 1px solid #f2f2f2;
            text-decoration: none; color: inherit;
            transition: background-color .15s ease;
        }
        .thread:last-child { border-bottom: none; }
        .thread:hover { background: #fafafa; }
        .thread-avatar {
            width: 46px; height: 46px; border-radius: 999px;
            object-fit: cover; flex-shrink: 0;
            background: #cc0000; color: #fff;
            display: grid; place-items: center;
            font-weight: 700; font-size: .95rem;
        }
        .thread-main { flex: 1; min-width: 0; }
        .thread-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
        .thread-name { font-weight: 700; font-size: .95rem; color: #222; }
        .thread-time { font-size: .7rem; color: #9a9a9a; flex-shrink: 0; }
        .thread-sub { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
        .thread-last { font-size: .82rem; color: #777; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .thread-last.none { font-style: italic; color: #b0b0b0; }
        .thread-badge {
            flex-shrink: 0; min-width: 20px; padding: 1px 6px;
            border-radius: 999px; background: #cc0000; color: #fff;
            font-size: .7rem; font-weight: 700; text-align: center;
        }
        .thread-chip { font-size: .68rem; color: #999; border: 1px solid #eee; border-radius: 999px; padding: 1px 7px; }
    </style>
</head>
<body>

    <header class="sticky top-0 z-50 bg-white shadow-sm">
        <nav class="max-w-3xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16 gap-3">
            <a href="/home" class="brand">
                <img src="/mozartLogo.jpg" alt="Mozart Techniques logo">
                <span>Mozart Techniques</span>
            </a>
            <div class="flex items-center gap-3">
                <a href="/dashboard" class="text-sm font-semibold text-gray-500 hover:text-primary-red transition">Dashboard</a>
                <div id="auth-state"></div>
            </div>
        </nav>
    </header>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 py-6">
        <div class="flex items-baseline justify-between mb-4">
            <h1 class="text-2xl font-bold text-gray-900">Messages</h1>
            <div class="flex items-center gap-3"><p id="thread-count" class="text-xs text-gray-400"></p></div>
        </div>

        <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
            <div id="thread-list">
                <p class="text-center text-gray-400 text-sm py-12">Loading conversations…</p>
            </div>
        </div>
    </main>

    <button id="create-tutor-group-btn" type="button" aria-label="Create a student group" class="hidden fixed bottom-6 right-6 z-40 grid h-14 w-14 place-items-center rounded-full bg-primary-red text-xl text-white shadow-xl transition hover:bg-red-700 focus:outline-none focus:ring-4 focus:ring-red-200">
        <i class="fa-solid fa-plus"></i>
    </button>
    <script>
        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        function initials(name) {
            return (name || '?').split(' ').map((p) => p[0] || '').join('').slice(0, 2).toUpperCase();
        }

        // Short, WhatsApp-style stamps: time today, weekday this week, then
        // a date - so the column stays narrow whatever the age.
        function shortWhen(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const now = new Date();
            const sameDay = d.toDateString() === now.toDateString();
            if (sameDay) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const days = Math.round((now - d) / 86400000);
            if (days < 7) return d.toLocaleDateString([], { weekday: 'short' });
            return d.toLocaleDateString([], { day: '2-digit', month: 'short' });
        }

        function threadHtml(c) {
            const avatar = c.photoUrl
                ? `<img src="${escapeHtml(c.photoUrl)}" alt="" class="thread-avatar">`
                : `<div class="thread-avatar">${initials(c.name)}</div>`;
            const last = c.lastMessage
                ? `<span class="thread-last">${escapeHtml(c.lastMessage)}</span>`
                : `<span class="thread-last none">No messages yet — say hello</span>`;
            const badge = c.unread ? `<span class="thread-badge">${c.unread > 99 ? '99+' : c.unread}</span>` : '';
            return `
                <a href="/messages/chat/${c.assignmentId}" class="thread">
                    ${avatar}
                    <div class="thread-main">
                        <div class="thread-top">
                            <span class="thread-name">${escapeHtml(c.name || 'Unknown')}</span>
                            <span class="thread-time">${shortWhen(c.lastAt)}</span>
                        </div>
                        <div class="thread-sub">
                            ${last}
                            ${badge || `<span class="thread-chip">${escapeHtml(c.category || '')}</span>`}
                        </div>
                    </div>
                </a>`;
        }

        async function loadConversations() {
            const list = document.getElementById('thread-list');
            let data;
            try {
                data = await fetch('/api/conversations').then((r) => r.json());
            } catch (e) {
                list.innerHTML = '<p class="text-center text-gray-400 text-sm py-12">Could not load conversations.</p>';
                return;
            }
            if (!data.success) return;

            const items = data.conversations || [];
            document.getElementById('thread-count').textContent = items.length
                ? `${items.length} conversation${items.length === 1 ? '' : 's'}`
                : '';

            list.innerHTML = items.length
                ? items.map(threadHtml).join('')
                : `<div class="text-center py-14 px-6">
                     <i class="fa-regular fa-comments text-4xl text-gray-200 mb-3"></i>
                     <p class="text-gray-500 text-sm mb-4">No conversations yet. Once you're matched with a tutor, your chat appears here.</p>
                     <a href="/find-tutor" class="inline-flex items-center gap-2 px-4 py-2 bg-primary-red text-white rounded-lg text-sm font-semibold">Find a Tutor</a>
                   </div>`;
        }

        async function loadTutorGroups() {
            const response = await fetch('/api/group-chats');
            const data = await response.json();
            if (!data.success || !data.chats?.length) return;
            const list = document.getElementById('thread-list');
            const heading = '<div class="px-4 pt-4 pb-2 text-xs font-bold uppercase tracking-wide text-gray-400">Class groups</div>';
            list.insertAdjacentHTML('afterbegin', heading + data.chats.map((group) => `<a href="/messages/group/${group.id}" class="thread"><div class="thread-avatar"><i class="fa-solid fa-user-group"></i></div><div class="thread-main"><div class="thread-top"><span class="thread-name">${escapeHtml(group.name)}</span><span class="thread-time">${shortWhen(group.lastAt)}</span></div><div class="thread-sub"><span class="thread-last">${escapeHtml(group.lastMessage || `${group.studentCount} student${group.studentCount === 1 ? '' : 's'}`)}</span><span class="thread-chip">${escapeHtml(group.course || 'Group')}</span></div></div></a>`).join(''));
        }

        async function setupTutorGroupButton() {
            const [session, tutorData] = await Promise.all([
                fetch('/api/session').then((r) => r.json()),
                fetch('/api/tutors/me').then((r) => r.json()).catch(() => ({}))
            ]);
            if (session.user?.role !== 'tutor' && !tutorData.profile) return;
            if (!document.getElementById('create-tutor-group-btn')) return;
            const button = document.getElementById('create-tutor-group-btn');
            button.classList.remove('hidden');
            button.addEventListener('click', async () => {
                const assignmentData = await fetch('/api/my-assignments').then((r) => r.json());
                const records = (assignmentData.asTutor || []).filter((item) => item.status === 'active');
                if (!records.length) return alert('You need at least one active student before creating a group.');
                const courses = [...new Set(records.map((item) => item.category).filter(Boolean))];
                const course = window.prompt(`Course for this group:\n${courses.join('\n')}`, courses[0] || '');
                if (!course) return;
                const students = records.filter((item) => item.category === course);
                if (!students.length) return alert('No active students were found for that course.');
                const groupName = window.prompt('Group chat name', `${course} students`);
                if (!groupName) return;
                const choices = students.map((item, index) => `${index + 1}. ${item.studentName || 'Student'}`).join('\n');
                const picked = window.prompt(`Select student numbers, separated by commas:\n${choices}`, students.map((_, index) => index + 1).join(','));
                if (!picked) return;
                const selected = [...new Set(picked.split(',').map((value) => Number(value.trim()) - 1).filter((index) => Number.isInteger(index) && students[index]))].map((index) => students[index].studentId);
                if (!selected.length) return alert('Choose at least one student.');
                const result = await fetch('/api/tutors/me/group-chats', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ course, groupName, studentIds: selected }) }).then((r) => r.json());
                if (!result.success) return alert(result.error || 'Could not create the group chat.');
                window.location.href = `/messages/group/${result.conversation.id}`;
            });
        }
        loadConversations().then(loadTutorGroups);
        setupTutorGroupButton();
        // Keeps unread counts and previews fresh while the list is open.
        setInterval(() => { if (!document.hidden) loadConversations(); }, 15000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) loadConversations(); });
    </script>
    <script src="/assets/nav-auth.js"></script>
    <script src="/assets/mobile-nav.js"></script>
</body>
</html>
