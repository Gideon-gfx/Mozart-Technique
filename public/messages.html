<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Messages - Mozart Techniques</title>
	<link rel="shortcut icon" href="/mozartLogo.jpg">
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	<link rel="stylesheet" href="/assets/site.css">
</head>
<body class="min-h-screen bg-gray-50">
	<header class="sticky top-0 z-20 border-b bg-white shadow-sm">
		<nav class="mx-auto flex h-16 max-w-3xl items-center justify-between px-4">
			<a href="/home" class="flex items-center gap-3 font-bold text-gray-900"><img src="/mozartLogo.jpg" alt="Mozart Techniques" class="h-9 w-9 rounded-full object-cover"><span>Messages</span></a>
			<div id="auth-state"></div>
		</nav>
	</header>
	<main class="mx-auto max-w-3xl px-4 py-6">
		<div class="mb-4 flex items-center justify-between"><h1 class="text-2xl font-extrabold text-gray-900">Messages</h1><span id="thread-count" class="text-xs text-gray-500"></span></div>
		<section class="overflow-hidden rounded-2xl bg-white shadow-lg">
			<div id="thread-list"><p class="p-10 text-center text-sm text-gray-400">Loading conversations...</p></div>
		</section>
	</main>
	<script>
		const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (match) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[match]));
		const initials = (name) => String(name || '?').split(/\s+/).map((part) => part[0] || '').join('').slice(0, 2).toUpperCase();
		const timeLabel = (value) => value ? new Date(value).toLocaleDateString([], { day: '2-digit', month: 'short' }) : '';
		function renderThread(item, isGroup = false) {
			const id = isGroup ? item.id : item.assignmentId;
			const href = isGroup ? `/messages/group/${encodeURIComponent(id)}` : `/messages/chat?name=${encodeURIComponent(item.name || '')}`;
			const title = item.name || item.title || 'Conversation';
			const avatar = item.photoUrl ? `<img src="${escapeHtml(item.photoUrl)}" alt="" class="h-11 w-11 rounded-full object-cover">` : `<div class="grid h-11 w-11 place-items-center rounded-full bg-red-700 font-bold text-white">${isGroup ? '<i class="fa-solid fa-users"></i>' : initials(title)}</div>`;
			return `<a href="${href}" class="flex items-center gap-3 border-b border-gray-100 p-4 transition hover:bg-red-50"><div class="shrink-0">${avatar}</div><div class="min-w-0 flex-1"><div class="flex items-center justify-between gap-3"><strong class="truncate text-gray-900">${escapeHtml(title)}</strong><span class="shrink-0 text-xs text-gray-400">${timeLabel(item.lastAt)}</span></div><p class="mt-1 truncate text-sm text-gray-500">${escapeHtml(item.lastMessage || (isGroup ? `${item.studentCount || 0} students` : 'No messages yet'))}</p></div></a>`;
		}
		async function load() {
			const list = document.getElementById('thread-list');
			try {
				const [directResponse, groupResponse] = await Promise.all([fetch('/api/conversations'), fetch('/api/group-chats')]);
				const directData = await directResponse.json();
				const groupData = await groupResponse.json();
				const direct = directData.success ? (directData.conversations || []) : [];
				const groups = groupData.success ? (groupData.chats || []) : [];
				document.getElementById('thread-count').textContent = `${direct.length + groups.length} conversation${direct.length + groups.length === 1 ? '' : 's'}`;
				if (!direct.length && !groups.length) { list.innerHTML = '<p class="p-10 text-center text-sm text-gray-400">No conversations yet.</p>'; return; }
				list.innerHTML = (groups.length ? `<div class="border-b bg-gray-50 px-4 py-2 text-xs font-bold uppercase tracking-wide text-gray-500">Groups</div>${groups.map((item) => renderThread(item, true)).join('')}` : '') + direct.map((item) => renderThread(item)).join('');
				const name = new URLSearchParams(location.search).get('name');
				if (name) { const target = direct.find((item) => String(item.name || '').toLowerCase() === name.toLowerCase()); if (target) location.href = `/messages/chat/${target.assignmentId}`; }
			} catch (error) { list.innerHTML = '<p class="p-10 text-center text-sm text-red-600">Could not load messages. Please refresh.</p>'; }
		}
		load();
	</script>
	<script src="/assets/nav-auth.js"></script>
</body>
</html>
