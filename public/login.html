<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mozart Technique</title>
        <link rel="shortcut icon" href="mozartLogo.jpg" type="image/x-icon">

    <!-- Load Tailwind CSS (config must be set AFTER this script has loaded) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-red': '#E02126',
                        'primary-dark': '#1F2937',
                        'secondary-dark': '#121212',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <!-- Load Google Icons for the Google Sign-In button -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #121212, #1f1a1a);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content-bg {
            background: linear-gradient(135deg, #b1191f 0%, #c41822 45%, #7e0e14 100%);
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .login-card {
            max-width: 470px;
            width: 100%;
            background: linear-gradient(180deg, #ffffff 0%, #fff7f7 100%);
            border: 1px solid rgba(196, 24, 34, 0.14);
            border-radius: 1.2rem;
            box-shadow: 0 24px 35px -10px rgba(0, 0, 0, 0.35);
            padding: 1.5rem;
            animation: cardRise .7s ease both;
        }

        @keyframes cardRise {
            from { opacity: 0; transform: translateY(18px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-card input {
            border-radius: 0.85rem;
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        .login-card input:focus {
            border-color: #E02126;
            box-shadow: 0 0 0 3px rgba(224, 33, 38, 0.15);
            outline: none;
        }

        .login-card button {
            border-radius: 0.9rem;
        }

        /* Tab styling for Sign In / Create Account */
        .tab {
            font-size: 1.125rem; /* text-lg */
            font-weight: 600; /* font-semibold */
            cursor: pointer;
            padding: 0.75rem 0; /* py-3 */
            color: #6B7280; /* text-gray-500 */
            border-bottom: 2px solid transparent;
            transition: all 150ms ease-in-out;
        }
        .tab.active {
            color: #E02126; /* text-primary-red */
            border-bottom-color: #E02126; /* border-primary-red */
        }

        /* Alert Box Styling */
        #alert-box {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        #alert-box.show {
            opacity: 1;
        }
    </style>
</head>

<body>

    <!-- Alert Box for messages -->
    <div id="alert-box" class="p-4 rounded-lg shadow-xl text-white font-medium max-w-sm" style="background-color: #222;">
        <span id="alert-message"></span>
    </div>

    <!-- Navigation Bar -->
    <header class="sticky top-0 z-50 bg-white">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-20">
            <div class="flex items-center space-x-3">
                <img src="mozartLogo.jpg" alt="Mozart Technique logo" class="w-10 h-10 rounded-full object-cover shadow-sm">
                <span class="text-2xl font-extrabold text-primary-red">Mozart Technique</span>
            </div>
            <div class="hidden md:flex items-center space-x-6 text-gray-700 font-medium">
                <a href="/home" class="hover:text-primary-red transition duration-150">Home</a>
                <a href="/courses" class="hover:text-primary-red transition duration-150">Courses</a>
                <a href="/about" class="hover:text-primary-red transition duration-150">About</a>
                <a href="/contact" class="hover:text-primary-red transition duration-150">Contact</a>
                <a href="/login" class="ml-4 inline-flex items-center justify-center px-6 py-2 bg-[#E02126] text-white font-semibold rounded-lg shadow-md hover:bg-[#c41822] transition duration-150 transform hover:scale-105">Login</a>
            </div>
        </nav>
    </header>

    <!-- Main Content Area -->
    <div class="main-content-bg">
        <div class="login-card">
            
            <!-- Tab Controls -->
            <div class="flex justify-around mb-6 border-b border-gray-200">
                <div id="tab-sign-in" class="tab active" onclick="switchTab('sign-in')">Sign In</div>
                <div id="tab-create-account" class="tab" onclick="switchTab('create-account')">Create Account</div>
            </div>

            <!-- Sign In Form -->
            <div id="form-sign-in">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Welcome Back</h2>
                <form id="sign-in-form">
                    <input type="email" id="signin-email" placeholder="Email address" required
                           class="w-full px-4 py-3 mb-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-red focus:border-primary-red transition duration-150">
                    <div class="relative mb-6">
                        <input type="password" id="signin-password" placeholder="Password" required
                               class="w-full px-4 py-3 pr-11 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-red focus:border-primary-red transition duration-150">
                        <button type="button" data-toggle-password="signin-password" aria-label="Show password"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>

                    <button type="submit"
                            class="w-full py-3 bg-primary-red text-white font-semibold rounded-lg shadow-md border-2 border-primary-red hover:bg-white hover:text-primary-red transition duration-150 transform hover:scale-[1.005]">
                        Sign In
                    </button>
                </form>
            </div>

            <!-- Create Account Form -->
            <div id="form-create-account" class="hidden">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Join Mozart Technique</h2>
                <form id="create-account-form">
                    <input type="text" id="signup-name" placeholder="Full name" required
                           class="w-full px-4 py-3 mb-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-red focus:border-primary-red transition duration-150">
                    <input type="email" id="signup-email" placeholder="Email address" required
                           class="w-full px-4 py-3 mb-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-red focus:border-primary-red transition duration-150">
                    <div class="relative mb-4">
                        <input type="password" id="signup-password" placeholder="Password (min 6 characters)" required
                               class="w-full px-4 py-3 pr-11 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-red focus:border-primary-red transition duration-150">
                        <button type="button" data-toggle-password="signup-password" aria-label="Show password"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>

                    <div class="flex items-start mb-6">
                        <input type="checkbox" id="terms-checkbox" required
                               class="mt-1 h-4 w-4 text-primary-red border-gray-300 rounded focus:ring-primary-red">
                        <label for="terms-checkbox" class="ml-2 text-sm text-gray-600">
                            I agree to the <a href="#" class="text-primary-red hover:underline">Terms of Use</a>
                        </label>
                    </div>

                    <button type="submit"
                            class="w-full py-3 bg-primary-red text-white font-semibold rounded-lg shadow-md border-2 border-primary-red hover:bg-white hover:text-primary-red transition duration-150 transform hover:scale-[1.005]">
                        Create Account
                    </button>
                </form>
            </div>

            <!-- Divider and Google Sign-In -->
            <div class="mt-8">
                <div class="relative flex justify-center items-center mb-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative px-4 bg-white text-sm text-gray-500">
                        OR
                    </div>
                </div>

                <!-- Real Google Identity Services button renders here once configured -->
                <div id="google-signin-container" class="flex justify-center"></div>
                <p id="google-unavailable" class="hidden text-center text-sm text-gray-400 py-3">
                    Google sign-in is not configured yet. Use email and password.
                </p>
            </div>

            <!-- Footer Links -->
            <p class="text-center text-sm text-gray-500 mt-8">
                Forgot your password? <a href="/forgot-password" class="text-primary-red hover:underline">Reset it here</a>
            </p>
            <p class="text-center text-sm text-gray-500 mt-2">
                Are you a tutor? <a href="/become-tutor" class="text-primary-red hover:underline font-semibold">Apply to teach here</a>
            </p>

        </div>
    </div>

    <script src="assets/auth.js"></script>
    <script src="assets/mobile-nav.js"></script>
    <script src="assets/footer.js"></script>
    <script>
        // --- DOM ELEMENTS ---
        const signInForm = document.getElementById('sign-in-form');
        const createAccountForm = document.getElementById('create-account-form');
        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');

        // --- PASSWORD VISIBILITY TOGGLE ---
        document.querySelectorAll('[data-toggle-password]').forEach((btn) => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.togglePassword);
                const icon = btn.querySelector('i');
                const isHidden = input.type === 'password';
                input.type = isHidden ? 'text' : 'password';
                icon.classList.toggle('fa-eye', !isHidden);
                icon.classList.toggle('fa-eye-slash', isHidden);
                btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
            });
        });

        // --- UI ALERT HANDLER ---
        function showAlert(message, type = 'info') {
            alertMessage.textContent = message;
            alertBox.className = 'p-4 rounded-lg shadow-xl text-white font-medium max-w-sm show';

            if (type === 'error') {
                alertBox.style.backgroundColor = '#B91C1C';
            } else if (type === 'success') {
                alertBox.style.backgroundColor = '#059669';
            } else {
                alertBox.style.backgroundColor = '#1F2937';
            }

            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 4000);
        }

        // --- TAB SWITCHING LOGIC ---
        window.switchTab = (tabName) => {
            const signInTab = document.getElementById('tab-sign-in');
            const createAccountTab = document.getElementById('tab-create-account');
            const signInFormDiv = document.getElementById('form-sign-in');
            const createAccountFormDiv = document.getElementById('form-create-account');

            if (tabName === 'sign-in') {
                signInTab.classList.add('active');
                createAccountTab.classList.remove('active');
                signInFormDiv.classList.remove('hidden');
                createAccountFormDiv.classList.add('hidden');
            } else {
                signInTab.classList.remove('active');
                createAccountTab.classList.add('active');
                signInFormDiv.classList.add('hidden');
                createAccountFormDiv.classList.remove('hidden');
            }
        };

        // --- EMAIL/PASSWORD SIGN IN ---
        signInForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signin-email').value;
            const password = document.getElementById('signin-password').value;

            const result = await signIn(email, password);
            if (result.success) {
                showAlert(`Welcome back, ${result.user.name}!`, 'success');
                setTimeout(() => { window.location.href = getRedirectTarget(); }, 600);
            } else {
                showAlert(result.error || 'Sign in failed.', 'error');
            }
        });

        // --- EMAIL/PASSWORD ACCOUNT CREATION ---
        createAccountForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const termsChecked = document.getElementById('terms-checkbox').checked;

            if (!termsChecked) {
                showAlert("You must agree to the Terms of Use.", 'error');
                return;
            }

            const result = await signUp(name, email, password);
            if (result.success) {
                showAlert(`Account created! Welcome, ${result.user.name}.`, 'success');
                setTimeout(() => { window.location.href = getRedirectTarget(); }, 600);
            } else {
                showAlert(result.error || 'Account creation failed.', 'error');
            }
        });

        // --- GOOGLE SIGN IN ---
        async function handleGoogleCredential(response) {
            const res = await fetch('/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ credential: response.credential }),
            });
            const result = await res.json();
            if (result.success) {
                showAlert(`Welcome, ${result.user.name}!`, 'success');
                setTimeout(() => { window.location.href = getRedirectTarget(); }, 600);
            } else {
                showAlert(result.error || 'Google sign-in failed.', 'error');
            }
        }
        window.handleGoogleCredential = handleGoogleCredential;

        async function initGoogleSignIn() {
            const configRes = await fetch('/api/config');
            const config = await configRes.json();

            if (!config.googleClientId) {
                document.getElementById('google-unavailable').classList.remove('hidden');
                return;
            }

            const script = document.createElement('script');
            script.src = 'https://accounts.google.com/gsi/client';
            script.async = true;
            script.defer = true;
            script.onload = () => {
                google.accounts.id.initialize({
                    client_id: config.googleClientId,
                    callback: handleGoogleCredential,
                });
                google.accounts.id.renderButton(
                    document.getElementById('google-signin-container'),
                    { theme: 'outline', size: 'large', width: 320 }
                );
            };
            document.head.appendChild(script);
        }
        initGoogleSignIn().catch(() => {
            document.getElementById('google-unavailable').classList.remove('hidden');
        });

        // If already signed in, skip straight to the intended destination.
        getSession().then(({ user }) => {
            if (user) window.location.href = getRedirectTarget();
        }).catch(() => {});
    </script>
</body>
</html>
