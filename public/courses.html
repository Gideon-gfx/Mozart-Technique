            { id: 1007, title: "Music Theory - Grade 7", category: "Music Theory", level: "Professional", price: 20, rating: 4.9, reviews: 18, description: "Figured bass realization, advanced chromaticism, and fugue study.", image: "https://placehold.co/400x200/FDD6D6/E02126?text=Theory+Grade+7", locked: true },
            { id: 1008, title: "Music Theory - Grade 8", category: "Music Theory", level: "Professional", price: 20, rating: 4.9, reviews: 25, description: "Degree level theoretical studies, advanced score reading, and history.", image: "https://placehold.co/400x200/FDD6D6/E02126?text=Theory+Grade+8", locked: true },
        ];

        // Matches the slug generation in data/courses.js so links land on
        // the same /courses/<slug> and /payment/<slug> URLs the server uses.
        function slugify(text) {
            return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        }

        // Helper function to get the Tailwind color class based on the level
        function getLevelColor(level) {
            switch (level) {
                case 'Beginner': return 'bg-level-beginner text-white';
                case 'Intermediate': return 'bg-level-intermediate text-white';
                case 'Professional': return 'bg-primary-dark text-white';
                default: return 'bg-gray-500 text-white';
            }
        }

        // Helper function to create a star rating
        function createRatingStars(rating) {
            const fullStars = Math.floor(rating);
            let starsHtml = '';
            for (let i = 0; i < fullStars; i++) {
                starsHtml += `<svg class="w-4 h-4 text-yellow-400 fill-current" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;
            }
            for (let i = fullStars; i < 5; i++) {
                 starsHtml += `<svg class="w-4 h-4 text-gray-300 fill-current" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;
            }
            return starsHtml;
        }

        // Helper to safely escape text for use in HTML attributes
        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>"']/g, function (m) {
                return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
            });
        }

        // Helper to build responsive image markup for a course
        function buildCourseImageHtml(course, isLocked) {
            const src = course.image || 'https://placehold.co/400x200/800000/ffffff?text=Course+Image';
            const srcsetAttr = course.srcset ? `srcset="${course.srcset}"` : '';
            const alt = escapeHtml(course.title || 'Course image');

            return `
                <div class="course-image-wrap rounded-t-xl md:rounded-l-xl md:rounded-tr-none">
                    <img src="${src}" ${srcsetAttr} alt="${alt}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://placehold.co/400x200/800000/ffffff?text=Course+Image'">
                    ${isLocked ? `
                        <div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center">
                            <svg class="w-16 h-16 text-white" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/>
                            </svg>
                        </div>
                    ` : ''}
                    <div class="level-tag ${getLevelColor(course.level)}">
                        ${course.level.toUpperCase()}
                    </div>
                </div>
            `;
        }

        // Function to render the course list HTML
        function renderCourses(courses) {
            courseListContainer.innerHTML = '';

            if (courses.length === 0) {
                noResultsMessage.classList.remove('hidden');
                return;
            } else {
                noResultsMessage.classList.add('hidden');
            }

            courses.forEach(course => {
                const isLocked = course.locked;
                const priceText = course.price > 0 && !isLocked ? `$${course.price}/mo` : (isLocked && course.price === 0 ? 'Coming Soon' : 'Premium');

                const imageHtml = buildCourseImageHtml(course, isLocked);

                const cardHtml = `
                    <div class="course-card relative">
                        <div class="md:flex">
                            ${imageHtml}

                            <!-- Content Area -->
                            <div class="course-content md:w-2/3">
                                <span class="block text-sm font-medium text-gray-500 mb-1">${course.category}</span>
                                <h2 class="text-xl font-bold text-gray-800 h-14 overflow-hidden mb-2">${course.title}</h2>
                                <p class="text-sm text-gray-500 h-10 overflow-hidden">${course.description}</p>

                                <!-- Rating and Price -->
                                <div class="flex items-center justify-between mt-4 border-t pt-4 border-gray-100">
                                    <div class="flex items-center space-x-1 text-sm font-semibold text-gray-700">
                                        ${course.rating > 0 ? `<div class="flex">${createRatingStars(course.rating)}</div> <span class="text-gray-400 text-xs">(${course.reviews})</span>` : '<span class="text-gray-400 text-xs">No Ratings Yet</span>'}
                                    </div>
                                    <span class="text-lg font-bold ${isLocked && course.price === 0 ? 'text-gray-500' : 'text-primary-red'}">${priceText}</span>
                                </div>

                                <!-- Button -->
                                <button class="w-full mt-4 py-3 bg-primary-red text-white font-semibold rounded-lg shadow-lg hover:bg-red-700 transition duration-150 transform hover:scale-[1.01] ${isLocked ? 'opacity-75 cursor-not-allowed' : ''}" ${isLocked ? 'disabled' : `onclick="window.location.href='/courses/${slugify(course.title)}'"`}>
                                    ${isLocked && course.price === 0 ? 'Notify Me' : 'View Details'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                courseListContainer.innerHTML += cardHtml;
            });
        }

        // Function to dynamically populate the Category dropdown
        function populateCategoryFilter() {
            const categories = [...new Set(courseData.map(course => course.category))].sort();

            categoryFilter.innerHTML = '<option value="All" disabled selected>Filter by Category</option><option value="All">All Categories</option>';

            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categoryFilter.appendChild(option);
            });
        }

        // Function to filter courses based on the current search and selected filters
        function filterAndSearchCourses() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            const selectedCategory = categoryFilter.value === 'Filter by Category' ? 'All' : categoryFilter.value;
            const selectedLevel = levelFilter.value === 'Filter by Level' ? 'All' : levelFilter.value;

            const filteredCourses = courseData.filter(course => {
                const passesLevelFilter = selectedLevel === 'All' || course.level === selectedLevel;
                const passesCategoryFilter = selectedCategory === 'All' || course.category === selectedCategory;
                const passesSearchFilter =
                    course.title.toLowerCase().includes(searchTerm) ||
                    course.category.toLowerCase().includes(searchTerm) ||
                    course.description.toLowerCase().includes(searchTerm);

                return passesLevelFilter && passesCategoryFilter && passesSearchFilter;
            });

            renderCourses(filteredCourses);
        }

        // Initial setup on document load
        document.addEventListener('DOMContentLoaded', () => {
            populateCategoryFilter();
            filterAndSearchCourses();
        });
    </script>

    <script src="assets/nav-auth.js"></script>
    <script src="assets/mobile-nav.js"></script>
    <script src="assets/footer.js"></script>
</body>
