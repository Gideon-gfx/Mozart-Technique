<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Student - Mozart Techniques</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="assets/redesign.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
  <main class="max-w-4xl mx-auto p-6">
    <header class="flex items-center gap-4">
      <img id="student-photo" src="/mozartLogo.jpg" alt="student" class="w-20 h-20 rounded-full object-cover">
      <div>
        <h1 id="student-name" class="text-2xl font-bold">Student</h1>
        <p id="student-meta" class="text-sm text-gray-500">Student profile</p>
      </div>
    </header>

    <section class="mt-6 bg-white p-4 rounded-lg shadow">
      <h2 class="font-semibold">About</h2>
      <div id="student-about" class="mt-3 text-gray-600"></div>
    </section>
  </main>

  <script>
    async function load() {
      try {
        const parts = window.location.pathname.split('/').filter(Boolean);
        const slug = parts[1];
        const slugRes = await fetch(`/api/students/slug/${encodeURIComponent(slug)}`);
        const slugData = await slugRes.json();
        if (!slugData.success) {
          document.getElementById('student-name').textContent = 'Student not found';
          return;
        }
        const publicRes = await fetch(`/api/students/${slugData.profile.id}/public`);
        const publicData = await publicRes.json();
        if (!publicData.success) {
          document.getElementById('student-name').textContent = 'Student not found';
          return;
        }
        const s = publicData.student;
        document.getElementById('student-name').textContent = s.name;
        document.getElementById('student-meta').textContent = s.studentProfile && s.studentProfile.city ? s.studentProfile.city : '';
        if (s.photoUrl) document.getElementById('student-photo').src = s.photoUrl;
        document.getElementById('student-about').textContent = s.studentProfile ? JSON.stringify(s.studentProfile, null, 2) : '';
      } catch (e) {
        document.getElementById('student-name').textContent = 'Could not load student.';
      }
    }
    load();
  </script>
    <script src="assets/mobile-nav.js"></script>
</body>
</html>
