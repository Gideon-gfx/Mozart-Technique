<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orientation | Mozart Techniques</title><link rel="stylesheet" href="/assets/site.css"><style>body{font-family:Arial;background:#fff8f8;margin:0;color:#252525}.wrap{max-width:850px;margin:45px auto;padding:20px}.card{background:#fff;border-radius:18px;padding:30px;box-shadow:0 10px 34px #3d111119}.tag{color:#c41822;font-weight:bold;text-transform:uppercase;letter-spacing:.1em}video,iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin:20px 0}.back{color:#c41822;font-weight:bold;text-decoration:none}</style></head><body><main class="wrap"><a class="back" href="/dashboard">← Dashboard</a><section class="card"><p class="tag" id="audience">Orientation</p><h1 id="title">Loading your orientation…</h1><div id="video"></div><div id="notes"></div></section></main><script>const e=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));fetch('/api/orientation').then(r=>r.json()).then(d=>{const c=d.content||{};document.querySelector('#audience').textContent=(d.audience||'your')+' orientation';document.querySelector('#title').textContent=c.title||'Welcome to Mozart Techniques';document.querySelector('#notes').innerHTML=c.notes?`<p style="white-space:pre-wrap;line-height:1.65">${e(c.notes)}</p>`:'<p>Your orientation materials will appear here when your administrator publishes them.</p>';if(c.videoUrl){const u=e(c.videoUrl);document.querySelector('#video').innerHTML=/youtu/.test(u)?`<iframe src="${u.replace('watch?v=','embed/')}"></iframe>`:`<video controls src="${u}"></video>`;}});</script></body></html>
