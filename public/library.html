<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technique Library - Mozart Techniques</title>
    <link rel="shortcut icon" href="/mozartLogo.jpg" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { 'primary-red': '#cc0000', 'primary-dark': '#1F2937' } } }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/redesign.css">
    <link rel="stylesheet" href="/assets/site.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #ffffff 0%, #f8f8f8 100%); }
        .clip-card { background: #fff; border-radius: .75rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,.1); overflow: hidden; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="alert-box" class="fixed top-5 right-5 z-50 p-4 rounded-lg shadow-xl text-white font-medium max-w-sm opacity-0 transition-opacity duration-500" style="background-color:#222;">
        <span id="alert-message"></span>
    </div>

    <header class="sticky top-0 z-50 bg-white shadow-sm">
        <nav class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between h-20">
            <a href="/home" class="flex items-center space-x-3">
                <img src="/mozartLogo.jpg" alt="Mozart Techniques logo" class="w-10 h-10 rounded-full object-cover shadow-sm">
                <span class="text-2xl font-extrabold serif text-[#333]">Mozart Techniques</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="/dashboard" class="text-gray-600 hover:text-primary-red font-medium">Back to Dashboard</a>
                <div id="auth-state"></div>
            </div>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-10">
        <h1 class="text-2xl font-bold text-gray-800 mb-1">Technique Library</h1>
        <p id="library-sub" class="text-gray-500 mb-6">Reference clips for technique - your tutor can tag any of these into your lesson chat.</p>

        <div id="filter-bar" class="hidden bg-white rounded-2xl shadow-lg p-5 mb-6 flex flex-wrap gap-3 items-end">
            <div class="min-w-[220px] flex-1">
                <label class="block text-xs font-semibold text-gray-500 mb-1">Search</label>
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input id="library-search-input" type="text" placeholder="Search videos by title or topic..." class="w-full pl-9 pr-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-red">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">Subject</label>
                <select id="filter-category" title="Filter by subject" aria-label="Filter clips by subject" class="px-3 py-2 border border-gray-300 rounded-lg">
                    <option value="">All my subjects</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">Genre</label>
                <select id="filter-genre" title="Filter by genre" aria-label="Filter clips by genre" class="px-3 py-2 border border-gray-300 rounded-lg">
                    <option value="">All genres</option>
                </select>
            </div>
            <button id="filter-btn" class="px-5 py-2.5 bg-primary-red text-white font-semibold rounded-lg hover:bg-red-700 transition">Filter</button>
        </div>

        <div id="clip-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
        <p id="no-clips" class="hidden text-gray-400 text-center py-10">No clips match yet.</p>
        <div id="no-subjects" class="hidden bg-white rounded-2xl shadow-lg p-8 text-center text-gray-500">
            <i class="fa-solid fa-lock text-2xl text-gray-300 mb-3"></i>
            <p>You don't have library access yet - it unlocks once you're matched with a tutor (or approved to teach) in a subject.</p>
            <a href="/find-tutor" class="inline-block mt-4 text-primary-red font-semibold hover:underline">Find a Tutor &rarr;</a>
        </div>
    </main>

    <script>
        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');
        function showAlert(message, type = 'info') {
            alertMessage.textContent = message;
            alertBox.style.backgroundColor = type === 'error' ? '#B91C1C' : type === 'success' ? '#059669' : '#1F2937';
            alertBox.style.opacity = '1';
            setTimeout(() => { alertBox.style.opacity = '0'; }, 4000);
        }
        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        // Library access is scoped to the subjects a student is enrolled in
        // (requested/matched) or a tutor teaches - not the full taxonomy.
        async function loadFilters() {
            const [subRes, taxRes] = await Promise.all([fetch('/api/library/my-subjects'), fetch('/api/taxonomy')]);
            const subData = await subRes.json();
            const taxData = await taxRes.json();
            if (new URLSearchParams(window.location.search).get('item')) {
                document.getElementById('filter-bar').classList.add('hidden');
                return true;
            }

            if (!subData.isAdmin && (!subData.subjects || !subData.subjects.length)) {
                document.getElementById('no-subjects').classList.remove('hidden');
                return false;
            }

            document.getElementById('library-sub').textContent = subData.isAdmin
                ? 'Reference clips for technique - your tutor can tag any of these into your lesson chat.'
                : 'Reference clips for the subjects you\'re enrolled in - your tutor can tag any of these into your lesson chat.';
            document.getElementById('filter-bar').classList.remove('hidden');
            const catSel = document.getElementById('filter-category');
            (subData.subjects || []).forEach((c) => { catSel.innerHTML += `<option value="${c}">${c}</option>`; });
            const params = new URLSearchParams(window.location.search);
            const requestedCategory = params.get('category');
            if (requestedCategory && (subData.subjects || []).includes(requestedCategory)) {
                catSel.value = requestedCategory;
            }
            const genreSel = document.getElementById('filter-genre');
            taxData.genres.forEach((g) => { genreSel.innerHTML += `<option value="${g}">${g}</option>`; });
            return true;
        }

        function clipCardHtml(item) {
            const preview = videoPlayerHtml(item);
            const itemSlug = String(item.title || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            const shareUrl = `${window.location.origin}/library?item=${encodeURIComponent(itemSlug)}`;
            return `
                <article class="clip-card">
                    ${preview}
                    <div class="p-4">
                        <a href="/library?item=${encodeURIComponent(itemSlug)}" class="block font-bold text-gray-800 mb-1 hover:text-primary-red">${escapeHtml(item.title)}</a>
                        <p class="text-xs text-primary-red font-semibold uppercase">${item.category ? escapeHtml(item.category) : 'Any subject'}${item.genre ? ' &middot; ' + escapeHtml(item.genre) : ''}</p>
                        ${item.description ? `<p class="text-sm text-gray-600 mt-2">${escapeHtml(item.description)}</p>` : ''}
                        <div class="mt-3 flex gap-2"><button type="button" class="copy-library-link rounded-lg border border-gray-200 px-3 py-1.5 text-xs font-semibold" data-url="${escapeHtml(shareUrl)}"><i class="fa-solid fa-copy mr-1"></i>Copy link</button><button type="button" class="share-library-link rounded-lg border border-gray-200 px-3 py-1.5 text-xs font-semibold" data-url="${escapeHtml(shareUrl)}"><i class="fa-solid fa-share-nodes mr-1"></i>Share</button></div>
                    </div>
                </article>
            `;
        }

        function videoPlayerHtml(item) {
            const url = String(item.url || '');
            const directVideo = /(\.(mp4|webm|ogg|mov|m4v|m3u8)(?:[?#]|$)|video\/)/i.test(url) || item.isFile;
            if (directVideo) {
                return `<video src="${escapeHtml(url)}" class="w-full h-40 object-cover bg-black" controls preload="metadata"></video>`;
            }
            const youtube = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]{11})/i);
            if (youtube) {
                const playerUrl = `https://www.youtube-nocookie.com/embed/${youtube[1]}`;
                return `<iframe src="${escapeHtml(playerUrl)}" title="${escapeHtml(item.title)}" class="w-full h-40 bg-black" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
            }
            const vimeo = url.match(/vimeo\.com\/(?:video\/)?(\d+)/i);
            if (vimeo) {
                const playerUrl = `https://player.vimeo.com/video/${vimeo[1]}`;
                return `<iframe src="${escapeHtml(playerUrl)}" title="${escapeHtml(item.title)}" class="w-full h-40 bg-black" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
            }
            const googleDrive = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/i) || url.match(/drive\.google\.com\/uc\?id=([\w-]+)/i);
            if (googleDrive) {
                const id = googleDrive[1];
                const playerUrl = `https://drive.google.com/file/d/${id}/preview`;
                return `<iframe src="${escapeHtml(playerUrl)}" title="${escapeHtml(item.title)}" class="w-full h-40 bg-black" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe>`;
            }
            return `
                <div class="w-full h-40 bg-gradient-to-br from-stone-100 to-red-50 border border-dashed border-red-200 flex items-center justify-center px-4 text-center">
                    <div>
                        <i class="fa-solid fa-link text-2xl text-primary-red mb-3"></i>
                        <p class="text-sm font-semibold text-gray-700 mb-2">External link</p>
                        <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center px-3 py-2 rounded-lg bg-primary-red text-white text-xs font-semibold">Open media source</a>
                    </div>
                </div>
            `;
        }

        async function loadClips() {
            const itemSlug = new URLSearchParams(window.location.search).get('item');
            if (itemSlug) {
                const itemRes = await fetch(`/api/library?item=${encodeURIComponent(itemSlug)}`);
                const itemData = await itemRes.json();
                const deepGrid = document.getElementById('clip-grid');
                if (!itemData.success || !itemData.item) { deepGrid.innerHTML = `<p class="col-span-full py-10 text-center text-red-600">${escapeHtml(itemData.error || 'Library item not found.')}</p>`; document.getElementById('no-clips').classList.add('hidden'); return; }
                document.getElementById('no-clips').classList.add('hidden');
                deepGrid.innerHTML = clipCardHtml(itemData.item);
                wireShareButtons(deepGrid);
                return;
            }
            const category = document.getElementById('filter-category').value;
            const genre = document.getElementById('filter-genre').value;
            const search = document.getElementById('library-search-input').value.trim();
            const params = new URLSearchParams();
            if (category) params.set('category', category);
            if (genre) params.set('genre', genre);
            if (search) params.set('q', search);

            const res = await fetch(`/api/library?${params}`);
            const data = await res.json();
            const grid = document.getElementById('clip-grid');
            const empty = document.getElementById('no-clips');
            if (!data.success || !data.items.length) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');
            grid.innerHTML = data.items.map(clipCardHtml).join('');
            wireShareButtons(grid);
        }

        function wireShareButtons(scope) {
            scope.querySelectorAll('.copy-library-link').forEach((button) => button.addEventListener('click', async () => { await navigator.clipboard.writeText(button.dataset.url); showAlert('Library link copied.', 'success'); }));
            scope.querySelectorAll('.share-library-link').forEach((button) => button.addEventListener('click', async () => { if (navigator.share) await navigator.share({ title: 'Mozart Techniques library item', url: button.dataset.url }); else { await navigator.clipboard.writeText(button.dataset.url); showAlert('Library link copied.', 'success'); } }));
        }

        document.getElementById('filter-btn').addEventListener('click', loadClips);
        document.getElementById('library-search-input').addEventListener('input', () => {
            clearTimeout(window.librarySearchTimer);
            window.librarySearchTimer = setTimeout(loadClips, 200);
        });

        loadFilters().then((ok) => { if (ok) loadClips(); });
    </script>
    <script src="/assets/nav-auth.js"></script>
    <script src="/assets/mobile-nav.js"></script>
    <script src="/assets/footer.js"></script>
</body>
</html>
