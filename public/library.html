<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technique Library - Mozart Techniques</title>
    <link rel="shortcut icon" href="mozartLogo.jpg" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { 'primary-red': '#cc0000', 'primary-dark': '#1F2937' } } }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="assets/redesign.css">
    <link rel="stylesheet" href="assets/site.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #ffffff 0%, #f8f8f8 100%); }
        .clip-card { background: #fff; border-radius: .75rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,.1); overflow: hidden; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="alert-box" class="fixed top-5 right-5 z-50 p-4 rounded-lg shadow-xl text-white font-medium max-w-sm opacity-0 transition-opacity duration-500" style="background-color:#222;">
        <span id="alert-message"></span>
    </div>

    <header class="sticky top-0 z-50 bg-white shadow-sm">
        <nav class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between h-20">
            <a href="/home" class="flex items-center space-x-3">
                <img src="mozartLogo.jpg" alt="Mozart Techniques logo" class="w-10 h-10 rounded-full object-cover shadow-sm">
                <span class="text-2xl font-extrabold serif text-[#333]">Mozart Techniques</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="/dashboard" class="text-gray-600 hover:text-primary-red font-medium">Back to Dashboard</a>
                <div id="auth-state"></div>
            </div>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-10">
        <h1 class="text-2xl font-bold text-gray-800 mb-1">Technique Library</h1>
        <p id="library-sub" class="text-gray-500 mb-6">Reference clips for technique - your tutor can tag any of these into your lesson chat.</p>

        <div id="filter-bar" class="hidden bg-white rounded-2xl shadow-lg p-5 mb-6 flex flex-wrap gap-3 items-end">
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">Subject</label>
                <select id="filter-category" title="Filter by subject" aria-label="Filter clips by subject" class="px-3 py-2 border border-gray-300 rounded-lg">
                    <option value="">All my subjects</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">Genre</label>
                <select id="filter-genre" title="Filter by genre" aria-label="Filter clips by genre" class="px-3 py-2 border border-gray-300 rounded-lg">
                    <option value="">All genres</option>
                </select>
            </div>
            <button id="filter-btn" class="px-5 py-2.5 bg-primary-red text-white font-semibold rounded-lg hover:bg-red-700 transition">Filter</button>
        </div>

        <div id="clip-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
        <p id="no-clips" class="hidden text-gray-400 text-center py-10">No clips match yet.</p>
        <div id="no-subjects" class="hidden bg-white rounded-2xl shadow-lg p-8 text-center text-gray-500">
            <i class="fa-solid fa-lock text-2xl text-gray-300 mb-3"></i>
            <p>You don't have library access yet - it unlocks once you're matched with a tutor (or approved to teach) in a subject.</p>
            <a href="/find-tutor" class="inline-block mt-4 text-primary-red font-semibold hover:underline">Find a Tutor &rarr;</a>
        </div>
    </main>

    <script>
        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');
        function showAlert(message, type = 'info') {
            alertMessage.textContent = message;
            alertBox.style.backgroundColor = type === 'error' ? '#B91C1C' : type === 'success' ? '#059669' : '#1F2937';
            alertBox.style.opacity = '1';
            setTimeout(() => { alertBox.style.opacity = '0'; }, 4000);
        }
        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        // Library access is scoped to the subjects a student is enrolled in
        // (requested/matched) or a tutor teaches - not the full taxonomy.
        async function loadFilters() {
            const [subRes, taxRes] = await Promise.all([fetch('/api/library/my-subjects'), fetch('/api/taxonomy')]);
            const subData = await subRes.json();
            const taxData = await taxRes.json();

            if (!subData.isAdmin && (!subData.subjects || !subData.subjects.length)) {
                document.getElementById('no-subjects').classList.remove('hidden');
                return false;
            }

            document.getElementById('library-sub').textContent = subData.isAdmin
                ? 'Reference clips for technique - your tutor can tag any of these into your lesson chat.'
                : 'Reference clips for the subjects you\'re enrolled in - your tutor can tag any of these into your lesson chat.';
            document.getElementById('filter-bar').classList.remove('hidden');
            const catSel = document.getElementById('filter-category');
            (subData.subjects || []).forEach((c) => { catSel.innerHTML += `<option value="${c}">${c}</option>`; });
            const params = new URLSearchParams(window.location.search);
            const requestedCategory = params.get('category');
            if (requestedCategory && (subData.subjects || []).includes(requestedCategory)) {
                catSel.value = requestedCategory;
            }
            const genreSel = document.getElementById('filter-genre');
            taxData.genres.forEach((g) => { genreSel.innerHTML += `<option value="${g}">${g}</option>`; });
            return true;
        }

        function clipCardHtml(item) {
            const preview = item.isFile
                ? `<video src="${escapeHtml(item.url)}" class="w-full h-40 object-cover bg-black" controls></video>`
                : `<a href="${escapeHtml(item.url)}" target="_blank" class="flex items-center justify-center h-40 bg-gray-900 text-white"><i class="fa-solid fa-play-circle text-4xl"></i></a>`;
            return `
                <div class="clip-card">
                    ${preview}
                    <div class="p-4">
                        <h3 class="font-bold text-gray-800 mb-1">${escapeHtml(item.title)}</h3>
                        <p class="text-xs text-primary-red font-semibold uppercase">${item.category ? escapeHtml(item.category) : 'Any subject'}${item.genre ? ' &middot; ' + escapeHtml(item.genre) : ''}</p>
                        ${!item.isFile ? `<a href="${escapeHtml(item.url)}" target="_blank" class="text-xs text-gray-500 hover:text-primary-red hover:underline mt-2 inline-block">Open original post</a>` : ''}
                    </div>
                </div>
            `;
        }

        async function loadClips() {
            const category = document.getElementById('filter-category').value;
            const genre = document.getElementById('filter-genre').value;
            const params = new URLSearchParams();
            if (category) params.set('category', category);
            if (genre) params.set('genre', genre);

            const res = await fetch(`/api/library?${params}`);
            const data = await res.json();
            const grid = document.getElementById('clip-grid');
            const empty = document.getElementById('no-clips');
            if (!data.success || !data.items.length) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');
            grid.innerHTML = data.items.map(clipCardHtml).join('');
        }

        document.getElementById('filter-btn').addEventListener('click', loadClips);

        loadFilters().then((ok) => { if (ok) loadClips(); });
    </script>
    <script src="assets/nav-auth.js"></script>
    <script src="assets/mobile-nav.js"></script>
    <script src="assets/geo-location.js"></script>
    <script src="assets/footer.js"></script>
</body>
</html>
