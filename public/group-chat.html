<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Group chat - Mozart Techniques</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body class="min-h-screen bg-gray-50">
<header class="border-b bg-white shadow-sm"><nav class="mx-auto flex h-16 max-w-3xl items-center justify-between px-4"><a href="/messages" class="font-bold text-gray-900"><i class="fa-solid fa-arrow-left mr-2 text-red-700"></i>Messages</a><div id="auth-state"></div></nav></header>
<main class="mx-auto flex h-[calc(100vh-4rem)] max-w-3xl flex-col px-4 py-5"><section class="flex min-h-0 flex-1 flex-col overflow-hidden rounded-2xl bg-white shadow-lg"><header class="border-b px-5 py-4"><div class="flex items-center gap-3"><img id="group-avatar" src="/mozartLogo.jpg" alt="Group" class="h-11 w-11 rounded-full object-cover"><div><h1 id="group-name" class="font-bold">Group chat</h1><p id="group-meta" class="text-xs text-gray-500"></p></div><button id="group-call" type="button" class="ml-auto rounded-full p-2 text-red-700" title="Group call"><i class="fa-solid fa-video"></i></button></div><button id="members-button" type="button" class="mt-3 text-xs font-semibold text-red-700">View members</button><div id="members" class="mt-3 hidden space-y-2 rounded-xl bg-gray-50 p-3"></div></header><div id="messages" class="min-h-0 flex-1 space-y-3 overflow-y-auto bg-gray-50 p-4"></div><form id="message-form" class="flex items-center gap-2 border-t p-3"><button id="attach-button" type="button" class="rounded-full p-2 text-gray-500" title="Attach file"><i class="fa-solid fa-paperclip"></i></button><input id="file-input" type="file" class="hidden" accept="image/*,video/*,.pdf,.doc,.docx,.txt"><input id="message-input" class="min-w-0 flex-1 rounded-xl border px-3 py-2" placeholder="Message the group"><button class="rounded-xl bg-red-700 px-4 text-white" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button></form></section></main>
<script>
let groupId=new URLSearchParams(location.search).get('id')||location.pathname.split('/').pop();let role='';let pendingAttachment=null;const esc=(value)=>String(value??'').replace(/[&<>"']/g,(match)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[match]));
async function load(){if(!/^\d+$/.test(groupId)){const name=new URLSearchParams(location.search).get('name');const groups=await fetch('/api/group-chats').then((r)=>r.json());const match=(groups.chats||[]).find((item)=>String(item.name||'').toLowerCase()===String(name||'').toLowerCase());if(!match){document.getElementById('messages').innerHTML='<p class="text-center text-red-600">Group chat unavailable.</p>';return;}groupId=match.id;}const response=await fetch('/api/group-chats/'+encodeURIComponent(groupId));const data=await response.json();if(!data.success){document.getElementById('messages').innerHTML='<p class="text-center text-red-600">Group chat unavailable.</p>';return;}role=data.role;const group=data.group||{};const members=data.members||[];document.getElementById('group-name').textContent=group.title||'Group chat';document.getElementById('group-meta').textContent=members.length+' members'+(group.course?' · '+group.course:'');document.getElementById('group-avatar').src=group.photoUrl||group.groupImageUrl||'/mozartLogo.jpg';document.getElementById('group-call').onclick=async()=>{if(group.meetingLink)return location.href=group.meetingLink;if(role!=='tutor')return;const meetingLink=window.prompt('Paste the Google Meet or Zoom link');if(!meetingLink)return;const saved=await fetch('/api/group-chats/'+groupId+'/meeting',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({meetingLink})}).then((r)=>r.json());if(saved.success)location.href=meetingLink;};document.getElementById('members').innerHTML=members.map((member)=>'<div class="flex items-center justify-between gap-2"><div class="flex items-center gap-2"><img src="'+esc(member.photoUrl||'/mozartLogo.jpg')+'" class="h-8 w-8 rounded-full object-cover"><span class="text-sm">'+esc(member.name)+' <small class="text-gray-500">'+esc(member.roleLabel)+'</small></span></div>'+(role==='tutor'&&member.type==='student'?'<button type="button" class="remove-member text-xs font-semibold text-red-700" data-type="student" data-id="'+esc(member.id)+'">Remove</button>':'')+'</div>').join('');document.querySelectorAll('.remove-member').forEach((button)=>button.onclick=async()=>{const result=await fetch('/api/group-chats/'+groupId+'/members/'+button.dataset.type+'/'+button.dataset.id,{method:'DELETE'}).then((r)=>r.json());if(result.success)load();});const box=document.getElementById('messages');box.innerHTML= (data.messages||[]).map((message)=>'<div class="flex '+(message.senderType===role?'justify-end':'justify-start')+'"><div class="max-w-[78%] rounded-2xl px-3 py-2 '+(message.senderType===role?'bg-red-700 text-white':'border bg-white text-gray-800')+'"><p class="text-[11px] font-bold opacity-75">'+esc(message.senderName)+'</p><p class="whitespace-pre-wrap text-sm">'+esc(message.text)+'</p>'+(message.attachment?'<a class="mt-2 block underline" href="'+esc(message.attachment.url)+'" target="_blank">'+esc(message.attachment.name||'Attachment')+'</a>':'')+'</div></div>').join('')||'<p class="text-center text-sm text-gray-400">No messages yet.</p>';box.scrollTop=box.scrollHeight;}
document.getElementById('members-button').onclick=()=>document.getElementById('members').classList.toggle('hidden');document.getElementById('attach-button').onclick=()=>document.getElementById('file-input').click();document.getElementById('file-input').onchange=async()=>{const form=new FormData();form.append('file',document.getElementById('file-input').files[0]);const result=await fetch('/api/chat/upload',{method:'POST',body:form}).then((r)=>r.json());if(result.success)pendingAttachment=result.attachment;};document.getElementById('message-form').onsubmit=async(event)=>{event.preventDefault();const input=document.getElementById('message-input');const result=await fetch('/api/group-chats/'+groupId+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:input.value.trim(),attachment:pendingAttachment})}).then((r)=>r.json());if(result.success){input.value='';pendingAttachment=null;load();}};load();setInterval(()=>{if(!document.hidden)load();},12000);
</script><script src="/assets/nav-auth.js"></script></body></html>
