<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group chat - Mozart Techniques</title><link rel="shortcut icon" href="/mozartLogo.jpg"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"><link rel="stylesheet" href="/assets/site.css"><style>body{font-family:Montserrat,Arial,sans-serif;background:#f8f8f8}.bubble{max-width:78%;width:max-content;overflow-wrap:anywhere}.mine{background:#cc0000;color:#fff}.other{background:#fff;color:#222;border:1px solid #eee}</style></head><body>
<header class="bg-white shadow-sm"><nav class="mx-auto flex h-16 max-w-3xl items-center justify-between px-4"><a href="/messages" class="font-bold text-gray-800"><i class="fa-solid fa-arrow-left mr-2 text-red-700"></i>Messages</a><div id="auth-state"></div></nav></header>
<main class="mx-auto flex max-w-3xl flex-col px-4 py-5" style="height:calc(100vh - 64px)"><section class="flex min-h-0 flex-1 flex-col overflow-hidden rounded-2xl bg-white shadow-lg"><div class="border-b px-5 py-4"><h1 id="group-name" class="text-lg font-bold text-gray-900">Group chat</h1><p id="group-course" class="mt-1 text-xs text-gray-500"></p></div><div id="messages" class="min-h-0 flex-1 space-y-3 overflow-y-auto bg-gray-50 p-4"><p class="text-center text-sm text-gray-400">Loading group…</p></div><form id="form" class="flex gap-2 border-t p-3"><textarea id="text" required rows="1" class="min-h-11 flex-1 resize-none rounded-xl border border-gray-200 px-3 py-2 text-sm" placeholder="Message the group"></textarea><button class="rounded-xl bg-red-700 px-4 text-white" title="Send"><i class="fa-solid fa-paper-plane"></i></button></form></section></main>
<script>const id=location.pathname.split('/').pop();let me=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const d=await fetch('/api/group-chats/'+id).then(r=>r.json());if(!d.success){document.getElementById('messages').innerHTML='<p class="text-center text-sm text-red-600">This group chat is unavailable.</p>';return}me=d.role;document.getElementById('group-name').textContent=d.group.title;document.getElementById('group-course').textContent=d.group.course||'Tutor group';const h=document.getElementById('messages');h.innerHTML=d.messages.length?d.messages.map(m=>`<div class="flex ${m.senderType===me?'justify-end':'justify-start'}"><div class="bubble rounded-2xl px-3 py-2 ${m.senderType===me?'mine':'other'}"><p class="mb-1 text-[11px] font-bold opacity-80">${esc(m.senderName)}</p><p class="whitespace-pre-wrap text-sm">${esc(m.text)}</p><p class="mt-1 text-[10px] opacity-70">${new Date(m.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</p></div></div>`).join(''):'<p class="text-center text-sm text-gray-400">No messages yet. Say hello to the group.</p>';h.scrollTop=h.scrollHeight}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const input=document.getElementById('text');const text=input.value.trim();if(!text)return;const d=await fetch('/api/group-chats/'+id+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})}).then(r=>r.json());if(d.success){input.value='';load()}else alert(d.error||'Message could not be sent.')});load();setInterval(()=>{if(!document.hidden)load()},12000);</script><script src="/assets/nav-auth.js"></script></body></html>
