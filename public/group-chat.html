<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group chat - Mozart Techniques</title><link rel="shortcut icon" href="/mozartLogo.jpg"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"><link rel="stylesheet" href="/assets/site.css"><style>body{font-family:Montserrat,Arial,sans-serif;background:#f8f8f8}.bubble{max-width:78%;width:max-content;overflow-wrap:anywhere}.mine{background:#cc0000;color:#fff}.other{background:#fff;color:#222;border:1px solid #eee}</style></head><body><header class="bg-white shadow-sm"><nav class="mx-auto flex h-16 max-w-3xl items-center justify-between px-4"><a href="/messages" class="font-bold text-gray-800"><i class="fa-solid fa-arrow-left mr-2 text-red-700"></i>Messages</a><div id="auth-state"></div></nav></header><main class="mx-auto flex max-w-3xl flex-col px-4 py-5" style="height:calc(100vh - 64px)"><section class="flex min-h-0 flex-1 flex-col overflow-hidden rounded-2xl bg-white shadow-lg"><div class="border-b px-5 py-4"><button id="members-toggle" type="button" class="text-left"><h1 id="group-name" class="text-lg font-bold">Group chat</h1><p id="group-course" class="mt-1 text-xs text-gray-500"></p><p id="group-count" class="mt-1 text-xs text-red-700"></p></button><div id="members" class="hidden mt-3 space-y-2 rounded-xl bg-gray-50 p-3"></div><button id="group-call" type="button" class="mt-3 rounded-lg bg-red-700 px-3 py-2 text-sm font-bold text-white"><i class="fa-solid fa-video mr-1"></i>Join group meeting</button></div><div id="messages" class="min-h-0 flex-1 space-y-3 overflow-y-auto bg-gray-50 p-4"></div><form id="form" class="flex gap-2 border-t p-3"><textarea id="text" required rows="1" class="min-h-11 flex-1 resize-none rounded-xl border border-gray-200 px-3 py-2 text-sm" placeholder="Message the group"></textarea><button class="rounded-xl bg-red-700 px-4 text-white"><i class="fa-solid fa-paper-plane"></i></button></form></section></main><script>const id=location.pathname.split('/').pop();let me=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const d=await fetch('/api/group-chats/'+id).then(r=>r.json());if(!d.success)return;me=d.role;const members=d.members||[];document.getElementById('group-name').textContent=d.group.title;document.getElementById('group-course').textContent=d.group.course||'Tutor group';document.getElementById('group-count').textContent=`${members.length} member${members.length===1?'':'s'} · View members`;document.getElementById('members').innerHTML=members.map(m=>`<div class="flex items-center gap-3 rounded-lg bg-white p-2"><img src="${esc(m.photoUrl||'/mozartLogo.jpg')}" class="h-9 w-9 rounded-full object-cover"><div><p class="text-sm font-bold">${esc(m.name)}</p><p class="text-xs text-gray-500">${esc(m.roleLabel)}</p></div></div>`).join('');const h=document.getElementById('messages');h.innerHTML=(d.messages||[]).map(m=>`<div class="flex ${m.senderType===me?'justify-end':'justify-start'}"><div class="bubble rounded-2xl px-3 py-2 ${m.senderType===me?'mine':'other'}"><p class="mb-1 text-[11px] font-bold opacity-80">${esc(m.senderName)}</p><p class="whitespace-pre-wrap text-sm">${esc(m.text)}</p></div></div>`).join('')||'<p class="text-center text-sm text-gray-400">No messages yet.</p>';h.scrollTop=h.scrollHeight}document.getElementById('members-toggle').onclick=()=>document.getElementById('members').classList.toggle('hidden');const call=document.getElementById('group-call');if(d.group.meetingLink){call.textContent='Join group meeting';call.onclick=()=>location.href=d.group.meetingLink;}else if(d.role==='tutor'){call.textContent='Start group meeting';call.onclick=async()=>{const meetingLink=prompt('Paste the Google Meet link for this group');if(!meetingLink)return;const result=await fetch('/api/group-chats/'+id+'/meeting',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({meetingLink})}).then(r=>r.json());if(result.success)location.href=meetingLink;else alert(result.error||'Could not create meeting.');};}else call.classList.add('hidden');document.getElementById('form').onsubmit=async e=>{e.preventDefault();const input=document.getElementById('text'),text=input.value.trim();if(!text)return;const d=await fetch('/api/group-chats/'+id+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})}).then(r=>r.json());if(d.success){input.value='';load()}};load();setInterval(()=>{if(!document.hidden)load()},12000);</script><script src="/assets/nav-auth.js"></script></body></html>
