<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment methods - Mozart Techniques</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/site.css"></head>
<body class="min-h-screen bg-gray-50"><header class="border-b bg-white shadow-sm"><nav class="mx-auto flex h-16 max-w-3xl items-center justify-between px-4"><a href="/dashboard" class="font-bold text-gray-900">Payment methods</a><a href="/dashboard" class="text-sm font-semibold text-red-700">Back</a></nav></header><main class="mx-auto max-w-3xl px-4 py-8 space-y-6"><section class="rounded-2xl bg-white p-6 shadow-lg"><h1 class="text-2xl font-extrabold">Manage payment methods</h1><p class="mt-2 text-sm text-gray-500">Your saved card can be charged automatically when you confirm a paid lesson.</p><div id="current-card" class="mt-6 rounded-xl border border-gray-200 p-4">Loading...</div><button id="add-card" type="button" class="mt-5 rounded-lg bg-red-700 px-4 py-2 font-semibold text-white">Add or change card</button><p id="status" class="mt-4 text-sm" role="status"></p></section><section class="rounded-2xl bg-white p-6 shadow-lg"><h2 class="text-xl font-bold">Class payment history</h2><div id="bill-history" class="mt-4 space-y-3"><p class="text-sm text-gray-400">Loading bills...</p></div></section></main><script>
const statusNode=document.getElementById('status');
async function loadBills(){const data=await fetch('/api/my-assignments').then((r)=>r.json());const rows=(data.asStudent||[]).flatMap((record)=>(record.sessions||[]).map((session)=>({record,session}))).sort((a,b)=>new Date(b.session.loggedAt||0)-new Date(a.session.loggedAt||0));document.getElementById('bill-history').innerHTML=rows.length?rows.map(({record,session})=>`<div class="flex flex-wrap items-center justify-between gap-3 rounded-xl border p-3"><div><strong>${record.category||'Lesson'}</strong><p class="text-xs text-gray-500">${session.durationMinutes} minutes · ${new Date(session.loggedAt).toLocaleDateString()}</p></div><div class="text-right"><strong>$${Number(session.totalUsd||0).toFixed(2)}</strong><p class="text-xs font-semibold ${session.paymentStatus==='released'||session.paymentStatus==='free'?'text-emerald-600':session.paymentStatus==='cancelled'?'text-gray-500':'text-amber-600'}">${session.paymentStatus==='free'?'Free':session.paymentStatus==='released'?'Paid':session.paymentStatus==='cancelled'?'Cancelled':'Not paid'}</p></div></div>`).join(''):'<p class="text-sm text-gray-400">No class bills yet.</p>';}
async function loadCard(){const card=document.getElementById('current-card');try{const response=await fetch('/api/payment-method');const data=await response.json();if(!response.ok||!data.success)throw new Error(data.error||'Could not check your saved card.');if(data.hasCard){card.innerHTML=`<div class="flex items-center justify-between gap-3"><span class="font-semibold">${data.brand||'Card'} ending in ${data.last4}</span><button id="remove-card" type="button" class="text-sm font-semibold text-red-700">Remove</button></div>`;document.getElementById('remove-card').onclick=async()=>{try{const result=await fetch('/api/payment-method',{method:'DELETE'}).then((r)=>r.json());if(!result.success)throw new Error(result.error||'Could not remove card.');statusNode.textContent='Payment method removed.';loadCard();}catch(error){statusNode.textContent=error.message||'Could not remove card.';}};}else card.textContent='No card saved.';}catch(error){card.textContent=error.message||'Could not check your saved card.';}}
document.getElementById('add-card').onclick=async()=>{const button=document.getElementById('add-card');button.disabled=true;statusNode.textContent='Opening Stripe...';try{const response=await fetch('/api/payment-method/checkout',{method:'POST'});const data=await response.json();if(!response.ok||!data.success||!data.url)throw new Error(data.error||'Could not open Stripe.');window.location.assign(data.url);}catch(error){statusNode.textContent=error.message||'Could not open Stripe. Please try again.';button.disabled=false;}};
const cardResult=new URLSearchParams(location.search).get('card');if(cardResult==='saved')statusNode.textContent='Your card was saved successfully.';else if(cardResult==='cancelled')statusNode.textContent='Card setup was cancelled.';else if(cardResult==='error')statusNode.textContent='Your card could not be saved. Please try again.';loadCard();
</script><script src="/assets/nav-auth.js"></script><script>loadBills();</script>  <script src="/assets/scroll-reveal.js?v=1" defer></script>
</body></html>
