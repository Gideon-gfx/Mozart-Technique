<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment methods - Mozart Techniques</title><script src="https://js.stripe.com/v3/"></script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/assets/site.css"></head>
<body class="min-h-screen bg-gray-50"><header class="border-b bg-white shadow-sm"><nav class="mx-auto flex h-16 max-w-3xl items-center justify-between px-4"><a href="/dashboard" class="font-bold text-gray-900">Payment methods</a><a href="/dashboard" class="text-sm font-semibold text-red-700">Back</a></nav></header><main class="mx-auto max-w-3xl px-4 py-8 space-y-6"><section class="rounded-2xl bg-white p-6 shadow-lg"><h1 class="text-2xl font-extrabold">Manage payment methods</h1><p class="mt-2 text-sm text-gray-500">Your saved card can be charged automatically when you confirm a paid lesson.</p><div id="current-card" class="mt-6 rounded-xl border border-gray-200 p-4">Loading...</div><button id="add-card" type="button" class="mt-5 rounded-lg bg-red-700 px-4 py-2 font-semibold text-white">Add or change card</button><div id="card-form" class="mt-5 hidden"><div id="payment-element" class="rounded-lg border border-gray-300 p-3"></div><button id="save-card" type="button" class="mt-4 rounded-lg bg-red-700 px-4 py-2 font-semibold text-white">Save card</button></div><p id="status" class="mt-4 text-sm"></p></section><section class="rounded-2xl bg-white p-6 shadow-lg"><h2 class="text-xl font-bold">Class payment history</h2><div id="bill-history" class="mt-4 space-y-3"><p class="text-sm text-gray-400">Loading bills...</p></div></section></main><script>
let stripe;let elements;
const statusNode=document.getElementById('status');
async function loadBills(){const data=await fetch('/api/my-assignments').then((r)=>r.json());const rows=(data.asStudent||[]).flatMap((record)=>(record.sessions||[]).map((session)=>({record,session}))).sort((a,b)=>new Date(b.session.loggedAt||0)-new Date(a.session.loggedAt||0));document.getElementById('bill-history').innerHTML=rows.length?rows.map(({record,session})=>`<div class="flex flex-wrap items-center justify-between gap-3 rounded-xl border p-3"><div><strong>${record.category||'Lesson'}</strong><p class="text-xs text-gray-500">${session.durationMinutes} minutes · ${new Date(session.loggedAt).toLocaleDateString()}</p></div><div class="text-right"><strong>$${Number(session.totalUsd||0).toFixed(2)}</strong><p class="text-xs font-semibold ${session.paymentStatus==='released'||session.paymentStatus==='free'?'text-emerald-600':session.paymentStatus==='cancelled'?'text-gray-500':'text-amber-600'}">${session.paymentStatus==='free'?'Free':session.paymentStatus==='released'?'Paid':session.paymentStatus==='cancelled'?'Cancelled':'Not paid'}</p></div></div>`).join(''):'<p class="text-sm text-gray-400">No class bills yet.</p>';}
async function loadCard(){const data=await fetch('/api/payment-method').then((r)=>r.json());const card=document.getElementById('current-card');if(data.hasCard){card.innerHTML=`<div class="flex items-center justify-between gap-3"><span class="font-semibold">${data.brand||'Card'} ending in ${data.last4}</span><button id="remove-card" type="button" class="text-sm font-semibold text-red-700">Remove</button></div>`;document.getElementById('remove-card').onclick=async()=>{const result=await fetch('/api/payment-method',{method:'DELETE'}).then((r)=>r.json());if(result.success){statusNode.textContent='Payment method removed.';loadCard();}};}else card.textContent='No card saved.';}
document.getElementById('add-card').onclick=async()=>{const config=await fetch('/api/stripe/config').then((r)=>r.json());if(!config.publishableKey){statusNode.textContent='Payments are not configured yet.';return;}const data=await fetch('/api/payment-method/setup-intent',{method:'POST'}).then((r)=>r.json());if(!data.success){statusNode.textContent=data.error||'Could not start card setup.';return;}stripe=Stripe(config.publishableKey);elements=stripe.elements({clientSecret:data.clientSecret});elements.create('payment').mount('#payment-element');document.getElementById('card-form').classList.remove('hidden');};
document.getElementById('save-card').onclick=async()=>{const result=await stripe.confirmSetup({elements,redirect:'if_required'});if(result.error){statusNode.textContent=result.error.message;return;}const saved=await fetch('/api/payment-method/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({setupIntentId:result.setupIntent.id})}).then((r)=>r.json());statusNode.textContent=saved.success?'Payment method saved.':(saved.error||'Could not save card.');if(saved.success){document.getElementById('card-form').classList.add('hidden');loadCard();}};loadCard();
</script><script src="/assets/nav-auth.js"></script><script>loadBills();</script></body></html>
