<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Organization Tutor Dashboard</title>
  <link rel="shortcut icon" href="/mozartLogo.jpg" type="image/x-icon">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#c41822">
    <link rel="apple-touch-icon" href="/assets/icon-512.png">
    <script src="/assets/install-prompt.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{'primary-red':'#cc0000'}}}}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/chat-kit.css">
  <script src="/assets/teaching-tools-launcher.js" defer></script>
  <style>
    .org-tutor-thread{border:1px solid #eaded8;border-radius:14px;background:#fff;display:flex;flex-direction:column;overflow:hidden}
    .org-tutor-thread-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #eaded8;gap:8px}
    .org-tutor-call-btn{border:none;background:#fff0ec;color:#cc0000;width:32px;height:32px;border-radius:999px;cursor:pointer;flex-shrink:0}
    /* Thread list rows, matching messages.html's own copy of this pattern -
       the trigger stays visible at all times (chat-kit.css's default is
       opacity:0-until-hover, invisible with no fallback on touch), and
       long-pressing the row itself opens the same menu on mobile. */
    .thread-row{position:relative}
    .thread-row .ck-trigger{opacity:1!important;display:flex!important}
    .unread-badge{background:#cc0000;color:#fff;font-size:11px;font-weight:800;border-radius:999px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
    .thread-pin-icon{color:#9ca3af;font-size:11px;margin-right:4px}
    .cal-day{min-height:40px;border-radius:8px;padding:4px 0 0;font-size:.72rem;font-weight:600;position:relative;cursor:pointer;background:#f8f5f1;border:none;color:#241f1c}
    .cal-day:hover{background:#f1e8e3}
    .cal-day.other-month{opacity:.35}
    .cal-day.today{box-shadow:inset 0 0 0 2px #cc0000}
    .cal-day.selected{background:#ffe1de}
    .cal-day .cal-dot{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:999px;background:#cc0000}
    .spinner{width:2.1rem;height:2.1rem;border:3px solid #eaded8;border-top-color:#cc0000;border-radius:50%;animation:org-spin .7s linear infinite}
    .spinner.small{width:1.4rem;height:1.4rem;border-width:2px}
    .spinner-wrap{display:flex;align-items:center;justify-content:center;padding:48px 0;grid-column:1/-1}
    @keyframes org-spin{to{transform:rotate(360deg)}}
    .org-tutor-page-loader{position:fixed;inset:0;z-index:200;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .25s ease}
    .org-tutor-page-loader.hidden{opacity:0;pointer-events:none}
    .org-tutor-page-loader img{width:56px;height:56px;border-radius:16px;object-fit:cover;box-shadow:0 10px 24px rgba(204,0,0,.22);animation:org-loader-pulse 1.1s ease-in-out infinite}
    .org-tutor-page-loader span{font-family:'Science Gothic',Montserrat,system-ui,sans-serif;font-weight:700;font-size:1.05rem;color:#241f1c;letter-spacing:.01em}
    @keyframes org-loader-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.75}}
    body{font-family:'Science Gothic',Montserrat,system-ui,sans-serif;font-size:.8125rem;background:linear-gradient(135deg,#fff,#f8f5f1);color:#241f1c}
    .org-tutor-shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 72px)}
    .org-tutor-sidebar{position:sticky;top:72px;align-self:start;display:flex;flex-direction:column;height:calc(100vh - 72px);height:calc(100dvh - 72px);overflow:hidden;background:#fff;border-right:1px solid #eaded8}
    .org-tutor-sidebar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;flex-shrink:0;margin-bottom:12px}
    .org-tutor-nav{flex:1;min-height:0;align-content:start;grid-auto-rows:min-content;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain}
    .org-tutor-nav::-webkit-scrollbar{width:4px}
    .org-tutor-nav::-webkit-scrollbar-track{background:transparent}
    .org-tutor-nav::-webkit-scrollbar-thumb{background:#c8c8c8;border-radius:999px}
    .org-tutor-nav::-webkit-scrollbar-button{display:none;width:0;height:0}
    #org-tutor-sidebar-name{font-size:.9rem;font-weight:600}
    .org-tutor-nav button{font-size:.875rem;font-weight:500;transition:transform .2s ease,background .2s ease}
    .org-tutor-nav button:hover{transform:translateX(3px);background:#f5f5f5}
    .org-tutor-nav button.active{background:#f5f5f5;color:#9f1520;box-shadow:inset 3px 0 0 #c41822}
    .org-tutor-main .text-sm{font-size:.8125rem}
    .org-tutor-main h2{font-size:1.1rem;line-height:1.35;font-weight:700}
    .org-tutor-main h3{font-size:.95rem;line-height:1.4}
    #notifications-list{gap:6px}
    #notifications-list .org-notification{justify-self:start;width:min(100%,390px);padding:6px 8px;border-radius:6px;line-height:1.3}
    #notifications-list .org-notification strong,#notifications-list .org-notification p{display:inline;font-size:11px;line-height:1.3}
    #notifications-list .org-notification p{margin:0 0 0 6px}
    #mark-read{padding:6px 9px;font-size:.75rem}
    .org-tutor-panel{display:none}
    .org-tutor-panel.active{display:block}
    .edit-library-btn,.delete-library-btn{transition:all .2s ease;font-size:.75rem;padding:.375rem .75rem;border-radius:.5rem;border:none;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:.25rem;box-shadow:0 2px 4px rgba(0,0,0,.1)}
    .edit-library-btn{background:#2563eb;color:#fff}
    .delete-library-btn{background:#dc2626;color:#fff}
    /* The "Create group" popup (built in JS, appended to document.body) is
       styled with these two classes but this page never defined them -
       ngo-dashboard.html/sponsor-dashboard.html do, this page just never
       loaded that CSS. Without them the popup rendered as a bare, unstyled
       block flowing at the very end of <body> (no overlay, no centering),
       which made it look like stray content sitting on whatever panel -
       Library, most often - happened to be tall enough to scroll past.
       Same values as those two pages' own .modal-backdrop/.modal-panel. */
    .modal-backdrop{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:60}
    .modal-panel{width:min(480px,100%);background:#fff;border-radius:18px;border:1px solid #eaded8;box-shadow:0 28px 50px rgba(0,0,0,.18);padding:22px;max-height:80vh;overflow-y:auto}
    .btn-primary{background:linear-gradient(135deg,#cc0000,#a30000);color:#fff;border:none;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;box-shadow:0 10px 18px rgba(204,0,0,.2)}
    .btn-secondary{background:#fff;color:#241f1c;border:1px solid #eaded8;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
    .content-reactions{border-top:1px solid #f1ebdf;padding-top:10px}
    .react-btn{width:32px;height:32px;border-radius:999px;border:none;background:#f8f5f1;font-size:1rem;line-height:1;cursor:pointer;transition:background .15s ease,transform .15s ease}
    .react-btn:hover{transform:translateY(-1px)}
    .react-btn.active{background:#ffe1de}
    .react-count{margin-left:2px;font-size:.78rem;font-weight:700;color:#6b7280}
    @keyframes slideInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    details{animation:slideInUp .3s ease-out}
    @media(max-width:768px){
      body{min-width:0}
      .org-tutor-shell{display:block;min-height:calc(100vh - 72px)}
      .org-tutor-sidebar{position:fixed;top:72px;bottom:auto;left:0;width:min(86vw,300px);height:calc(100vh - 72px);height:calc(100dvh - 72px);min-height:0;z-index:40;transform:translateX(calc(-100% + 52px));transition:transform .25s ease}
      .org-tutor-sidebar.open{transform:translateX(0)}
      .org-tutor-sidebar:not(.open) #org-tutor-sidebar-name,.org-tutor-sidebar:not(.open) .org-tutor-nav{visibility:hidden}
      #org-tutor-mobile{flex:0 0 44px;width:44px;height:44px;margin-right:-12px;border:0;border-radius:0;background:transparent;font-size:1.1rem}
      .org-tutor-shell > .org-tutor-main{width:calc(100% - 52px);margin-left:52px;margin-right:0;padding:16px 12px}
      .org-tutor-main h2{font-size:1.1rem}
      .org-tutor-nav button{min-height:42px;font-size:.82rem}
      .org-tutor-mobile{display:inline-flex!important;align-items:center;justify-content:center}
      .org-tutor-panel>div,.org-tutor-panel article{max-width:100%}
      .org-tutor-panel .flex{flex-wrap:wrap}
      .org-tutor-panel .flex>a,.org-tutor-panel .flex>button{max-width:100%}
      .org-tutor-panel details{padding:12px}
      .org-tutor-panel details>summary{font-size:.9rem}
      .org-tutor-panel input,.org-tutor-panel textarea,.org-tutor-panel select{max-width:100%}
    }
  </style>
</head>
  <div id="org-tutor-page-loader" class="org-tutor-page-loader" aria-hidden="true"><img src="/mozartLogo.jpg" alt=""><span>Mozart Techniques</span></div>
  <header class="sticky top-0 z-30 border-b border-red-100 bg-white">
    <div class="mx-auto flex h-[72px] max-w-7xl items-center justify-between gap-4 px-4 sm:px-6">
      <div class="flex items-center gap-3"><a href="/tutor" id="org-tutor-back" class="rounded-lg p-2 text-red-700 hover:bg-red-50" aria-label="Back to tutor dashboard" title="Back"><i class="fa-solid fa-arrow-left"></i></a><a href="/org-tutor" class="flex items-center gap-3"><div id="org-tutor-logo" class="h-10 w-10 flex-shrink-0 rounded-xl bg-red-700 text-white flex items-center justify-center font-bold overflow-hidden"></div><div><p id="org-tutor-org-name" class="text-xs font-bold uppercase tracking-wide text-red-700">Organization</p><h1 class="font-bold text-gray-900">Tutor Dashboard</h1></div></a></div>
      <div class="flex items-center gap-3"><button id="org-tutor-notifications" class="relative rounded-lg p-2 text-gray-600 hover:text-red-700" aria-label="Notifications" title="Notifications"><i class="fa-solid fa-bell"></i><span id="org-tutor-badge" class="absolute right-0 top-0 hidden rounded-full bg-red-700 px-1 text-[10px] text-white">0</span></button><div id="auth-state"></div></div>
    </div>
  </header>
  <div class="org-tutor-shell">
    <aside id="org-tutor-sidebar" class="org-tutor-sidebar p-4">
      <div class="org-tutor-sidebar-head"><strong id="org-tutor-sidebar-name">Organization</strong><button id="org-tutor-mobile" class="org-tutor-mobile hidden text-red-700" aria-label="Open sidebar" aria-controls="org-tutor-sidebar" aria-expanded="false" title="Open sidebar"><i id="org-tutor-mobile-icon" class="fa-solid fa-angles-right" aria-hidden="true"></i></button></div>
      <nav class="org-tutor-nav grid gap-2"><button class="active rounded-lg px-3 py-2 text-left font-semibold" data-panel="requests"><i class="fa-solid fa-envelope-open-text mr-2"></i>Requests</button><button class="rounded-lg px-3 py-2 text-left font-semibold" data-panel="messages"><i class="fa-solid fa-comments mr-2"></i>Messages</button><button class="rounded-lg px-3 py-2 text-left font-semibold" data-panel="schedules"><i class="fa-solid fa-calendar-days mr-2"></i>Schedules</button><button class="rounded-lg px-3 py-2 text-left font-semibold" data-panel="announcements"><i class="fa-solid fa-newspaper mr-2"></i>Announcements</button><button class="rounded-lg px-3 py-2 text-left font-semibold" data-panel="feeds"><i class="fa-solid fa-rss mr-2"></i>Feeds</button><button class="rounded-lg px-3 py-2 text-left font-semibold" data-panel="library"><i class="fa-solid fa-folder-open mr-2"></i>Uploads & Library</button><button class="rounded-lg px-3 py-2 text-left font-semibold" data-panel="notifications"><i class="fa-solid fa-bell mr-2"></i>Notifications</button><button class="rounded-lg px-3 py-2 text-left font-semibold" data-panel="settings"><i class="fa-solid fa-gear mr-2"></i>Settings</button></nav>
    </aside>
    <main class="org-tutor-main mx-auto w-full max-w-6xl p-8">
      <section id="panel-requests" class="org-tutor-panel active"><h2 class="text-2xl font-extrabold">Requests</h2><div id="requests-list" class="mt-5 grid gap-3"></div></section>

      <section id="panel-messages" class="org-tutor-panel">
        <div id="org-tutor-messages-list-view">
          <div class="mb-4 flex items-center justify-between gap-3"><div><h2 class="text-2xl font-extrabold">Messages</h2><span id="org-tutor-thread-count" class="text-xs text-gray-500"></span></div><div class="flex items-center gap-2"><button id="org-tutor-new-group-btn" type="button" class="grid h-10 w-10 place-items-center rounded-full bg-red-700 text-white shadow" aria-label="Create group chat" title="New group"><i class="fa-solid fa-plus"></i></button><button id="org-tutor-messages-more-btn" type="button" class="grid h-10 w-10 place-items-center rounded-full text-gray-600 hover:bg-gray-100" aria-label="More options" title="More options"><i class="fa-solid fa-ellipsis-vertical"></i></button></div></div>
          <div class="mb-4 flex flex-col items-start gap-2"><div class="relative w-full max-w-lg"><i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i><input type="text" id="org-tutor-thread-search" placeholder="Search conversations" class="w-full rounded-full border border-gray-200 bg-white py-2.5 pl-11 pr-4 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-red-200"></div><button type="button" id="org-tutor-archive-view-link" class="hidden text-xs font-semibold text-gray-500 hover:text-red-700"><i class="fa-solid fa-box-archive mr-1"></i>Archived</button></div>
          <section class="overflow-hidden rounded-2xl bg-white shadow-lg"><div id="org-tutor-thread-list"><p class="p-10 text-center text-sm text-gray-400">Loading conversations...</p></div></section>
        </div>
        <div id="org-tutor-chat-view" class="hidden org-tutor-thread" style="height:calc(100vh - 220px);min-height:26rem">
          <div class="org-tutor-thread-head"><div class="flex min-w-0 items-center gap-2"><button type="button" id="org-tutor-chat-back" class="rounded-lg p-2 text-gray-500 hover:bg-gray-100" title="Back"><i class="fa-solid fa-arrow-left"></i></button><h3 id="org-tutor-thread-title" class="truncate font-bold text-sm">Select a conversation</h3></div><button type="button" id="org-tutor-call-btn" class="org-tutor-call-btn" title="Start a call"><i class="fa-solid fa-video"></i></button></div>
          <div id="org-tutor-chat-mount" class="flex min-h-0 flex-1 flex-col"></div>
        </div>
      </section>

      <section id="panel-schedules" class="org-tutor-panel">
        <div class="flex items-center justify-between gap-3 flex-wrap"><h2 class="text-2xl font-extrabold">Schedules</h2><button id="schedule-class" class="rounded-lg bg-red-700 px-4 py-2 font-semibold text-white"><i class="fa-solid fa-calendar-plus mr-2"></i>Schedule meeting</button></div>
        <div class="mt-5 grid gap-5" style="grid-template-columns:minmax(0,320px) minmax(0,1fr)">
          <div class="rounded-xl border border-gray-200 bg-white p-4 self-start">
            <div class="mb-3 flex items-center justify-between"><button type="button" id="cal-prev" class="rounded-lg p-2 text-gray-500 hover:bg-gray-100" aria-label="Previous month"><i class="fa-solid fa-chevron-left"></i></button><strong id="cal-label" class="text-sm"></strong><button type="button" id="cal-next" class="rounded-lg p-2 text-gray-500 hover:bg-gray-100" aria-label="Next month"><i class="fa-solid fa-chevron-right"></i></button></div>
            <div class="mb-1 grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-gray-400"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
            <div id="cal-grid" class="grid grid-cols-7 gap-1"></div>
          </div>
          <div>
            <div class="mb-3 flex gap-2 border-b border-gray-200"><button class="schedule-tab active pb-2 px-3 font-semibold text-red-700 border-b-2 border-red-700" data-schedule-tab="upcoming">Upcoming</button><button class="schedule-tab pb-2 px-3 font-semibold text-gray-600 hover:text-gray-800" data-schedule-tab="today">Today</button><button class="schedule-tab pb-2 px-3 font-semibold text-gray-600 hover:text-gray-800" data-schedule-tab="past">Past</button></div>
            <div id="schedule-list" class="grid gap-3"></div>
          </div>
        </div>
      </section>

      <section id="panel-announcements" class="org-tutor-panel"><h2 class="text-2xl font-extrabold">Announcements</h2><div id="announcements-list" class="mt-5 grid gap-3"></div></section>
      <section id="panel-feeds" class="org-tutor-panel"><h2 class="text-2xl font-extrabold">Organization Feeds</h2><div id="feeds-list" class="mt-5 grid gap-3"></div></section>
      <section id="panel-library" class="org-tutor-panel"><div class="flex items-center justify-between gap-3 flex-wrap"><h2 class="text-2xl font-extrabold">Uploads & Library</h2><button id="library-upload-btn" type="button" class="rounded-lg bg-red-700 px-4 py-2 text-sm font-semibold text-white"><i class="fa-solid fa-upload mr-2"></i>Upload</button></div><div class="mt-4 flex gap-2 border-b border-gray-200"><button class="library-view-tab active pb-3 px-3 font-semibold text-red-700 border-b-2 border-red-700" data-library-view="general">General</button><button class="library-view-tab pb-3 px-3 font-semibold text-gray-600 hover:text-gray-800" data-library-view="shared">Shared</button><button class="library-view-tab pb-3 px-3 font-semibold text-gray-600 hover:text-gray-800" data-library-view="mine">My Uploads</button></div><div id="org-library-grid" class="mt-5 grid gap-4"></div></section>
      <section id="panel-notifications" class="org-tutor-panel"><div class="flex items-center justify-between gap-3"><h2 class="text-2xl font-extrabold">Notifications</h2><button id="mark-read" class="rounded-lg border border-gray-200 px-3 py-2 text-sm font-semibold">Mark all as read</button></div><div id="notifications-list" class="mt-5 grid gap-3"></div></section>
      <section id="panel-settings" class="org-tutor-panel"><h2 class="text-2xl font-extrabold">Edit Profile</h2><form id="settings-form" class="mt-5 max-w-xl space-y-3"><input id="settings-name" required class="w-full rounded-lg border border-gray-300 px-3 py-2" placeholder="Name"><input id="settings-phone" class="w-full rounded-lg border border-gray-300 px-3 py-2" placeholder="Phone"><button class="rounded-lg bg-red-700 px-4 py-2 font-semibold text-white">Save changes</button></form></section>
    </main>

    <div class="ck-popover" id="org-messages-more-menu" hidden style="min-width:200px;">
      <button type="button" data-more="new-group"><i class="fa-solid fa-user-group"></i> New group</button>
      <button type="button" data-more="mark-all-read"><i class="fa-solid fa-envelope-open"></i> Mark all as read</button>
    </div>
    <div class="ck-popover" id="org-row-menu" hidden style="min-width:210px;">
      <button type="button" data-row-action="archive"><i class="fa-solid fa-box-archive"></i> <span id="org-row-archive-label">Archive chat</span></button>
      <div style="position:relative;">
        <button type="button" data-row-action="mute-toggle" id="org-row-mute-toggle"><i class="fa-solid fa-bell"></i> <span id="org-row-mute-label">Mute notification</span> <i class="fa-solid fa-chevron-right" style="margin-left:auto;font-size:10px;"></i></button>
        <div class="ck-popover" id="org-row-mute-submenu" hidden style="min-width:140px;"><button type="button" data-mute="8h">8 hours</button><button type="button" data-mute="1w">1 week</button><button type="button" data-mute="always">Always</button></div>
      </div>
      <button type="button" data-row-action="pin"><i class="fa-solid fa-thumbtack"></i> <span id="org-row-pin-label">Pin chat</span></button>
      <button type="button" data-row-action="mark-unread"><i class="fa-regular fa-envelope"></i> Mark as unread</button>
      <button type="button" data-row-action="favorite"><i class="fa-regular fa-star"></i> <span id="org-row-favorite-label">Add to Favourite</span></button>
      <hr style="margin:6px 0;border-color:#eee;">
      <button type="button" data-row-action="block" class="danger" id="org-row-block-btn"><i class="fa-solid fa-ban"></i> <span id="org-row-block-label">Block</span></button>
      <button type="button" data-row-action="clear" class="danger"><i class="fa-solid fa-broom"></i> Clear chat</button>
      <button type="button" data-row-action="delete" class="danger"><i class="fa-solid fa-trash"></i> Delete chat</button>
    </div>
  </div>
  <script src="/assets/nav-auth.js"></script><script src="/assets/chat-kit.js"></script><script>
    const state={data:null, tutorProfile:null}; const esc=(v)=>String(v||'').replace(/[&<>"']/g,(m)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const initials=(name)=>String(name||'?').split(/\s+/).map((part)=>part[0]||'').join('').slice(0,2).toUpperCase();
    const timeLabel=(value)=>value?new Date(value).toLocaleDateString([],{day:'2-digit',month:'short'}):'';
    let myUserId=null, tutorChatController=null;
    let orgMessageRows=[]; // merged roster: assigned-org-students (real assignment threads) + tutor's course groups + this org's own channel/groups
    let activeEmbeddedRow=null; // the currently open row when it has no dedicated page (org channel / org-created group)
    function orgChatActionUrls(convId){return{edit:async(id,text)=>fetch(`/api/org-chat/conversations/${convId}/messages/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})}).then((r)=>r.json()),del:async(id,mode)=>mode==='me'?fetch(`/api/org-chat/conversations/${convId}/messages/${id}/delete-for-me`,{method:'POST'}).then((r)=>r.json()):fetch(`/api/org-chat/conversations/${convId}/messages/${id}`,{method:'DELETE'}).then((r)=>r.json()),react:async(id,emoji)=>fetch(`/api/org-chat/conversations/${convId}/messages/${id}/react`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({emoji})}).then((r)=>r.json()),pin:async(id)=>fetch(`/api/org-chat/conversations/${convId}/messages/${id}/pin`,{method:'POST'}).then((r)=>r.json()),vote:async(id,optionId)=>fetch(`/api/org-chat/conversations/${convId}/messages/${id}/poll-vote`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({optionId})}).then((r)=>r.json())};}

    // A row's "type" segment for the shared /api/threads/:type/:id/... prefs
    // routes (archive/pin/mute/favorite/mark-unread/clear/delete/block) -
    // these already exist for every kind of thread this dashboard shows.
    function rowThreadType(row){return row.kind==='assignment'?'assignment':row.kind==='tutorGroup'?'group':'org';}

    async function loadOrgMessages(){
      const list=document.getElementById('org-tutor-thread-list');
      list.innerHTML='<div class="spinner-wrap"><div class="spinner"></div></div>';
      const orgStudentIds=new Set((state.data?.students||[]).map((s)=>Number(s.studentId)));
      try{
        const [convRes,groupRes,orgRes]=await Promise.all([
          fetch('/api/conversations').then((r)=>r.json()),
          fetch('/api/group-chats').then((r)=>r.json()),
          fetch('/api/organizations/mine/conversations').then((r)=>r.json()),
        ]);
        const studentRows=(convRes.success?convRes.conversations:[])
          .filter((c)=>c.role==='tutor'&&orgStudentIds.has(Number(c.otherPartyUserId)))
          .map((c)=>({kind:'assignment',key:`assignment:${c.assignmentId}`,apiId:c.assignmentId,otherPartyUserId:c.otherPartyUserId,title:c.name,subtitle:c.lastMessage||'No messages yet',lastAt:c.lastAt,unread:c.unread,photoUrl:c.photoUrl,pinned:c.pinned,muted:c.muted,favorite:c.favorite,blocked:c.blocked,archived:c.archived,href:`/messages/chat?name=${encodeURIComponent(c.name||'')}&back=${encodeURIComponent('/org-tutor')}`}));
        const groupRows=(groupRes.success?groupRes.chats:[])
          .map((g)=>({kind:'tutorGroup',key:`group:${g.id}`,apiId:g.id,title:g.name,subtitle:g.lastMessage||`${g.studentCount||0} students`,lastAt:g.lastAt,unread:0,photoUrl:g.photoUrl,pinned:g.pinned,muted:g.muted,favorite:g.favorite,archived:g.archived,isGroup:true,href:`/messages/group?name=${encodeURIComponent(g.name||'')}&back=${encodeURIComponent('/org-tutor')}`}));
        const orgRows=(orgRes.success?orgRes.conversations:[])
          .map((c)=>{const last=(c.messages||[]).slice(-1)[0];return {kind:'org',key:`org:${c.id}`,apiId:c.id,title:c.title||(c.type==='group'?'Group chat':orgRes.organizationName||'Organization'),subtitle:last?(last.text||'Attachment'):(c.type==='group'?`${(c.participants||[]).filter((p)=>p.type==='student').length} students`:'No messages yet'),lastAt:last?last.createdAt:c.createdAt,unread:c.unreadCount,photoUrl:c.groupImageUrl||null,pinned:c.pinned,muted:c.muted,favorite:c.favorite,archived:c.archived,isGroup:c.type==='group',href:null};});
        orgMessageRows=[...orgRows,...groupRows,...studentRows].sort((a,b)=>(b.pinned-a.pinned)||(new Date(b.lastAt||0)-new Date(a.lastAt||0)));
        renderOrgMessageList();
      }catch(e){list.innerHTML='<p class="p-10 text-center text-sm text-red-600">Could not load messages. Please refresh.</p>';}
    }
    let orgArchiveView=false;
    function renderOrgMessageList(){
      const query=(document.getElementById('org-tutor-thread-search').value||'').trim().toLowerCase();
      const archivedCount=orgMessageRows.filter((r)=>r.archived).length;
      const archiveLink=document.getElementById('org-tutor-archive-view-link');
      archiveLink.innerHTML=orgArchiveView?'<i class="fa-solid fa-arrow-left mr-1"></i>Back to Messages':`<i class="fa-solid fa-box-archive mr-1"></i>Archived (${archivedCount})`;
      archiveLink.classList.toggle('hidden',!orgArchiveView&&!archivedCount);
      let rows=orgMessageRows.filter((r)=>Boolean(r.archived)===orgArchiveView);
      if(query)rows=rows.filter((r)=>String(r.title||'').toLowerCase().includes(query));
      document.getElementById('org-tutor-thread-count').textContent=orgArchiveView?`${rows.length} archived`:`${rows.length} conversation${rows.length===1?'':'s'}`;
      const list=document.getElementById('org-tutor-thread-list');
      if(!rows.length){list.innerHTML=`<p class="p-10 text-center text-sm text-gray-400">${orgArchiveView?'No archived chats.':query?'No conversations found.':'No conversations yet.'}</p>`;return;}
      list.innerHTML=rows.map((item)=>{
        const avatar=item.photoUrl?`<img src="${esc(item.photoUrl)}" alt="" class="h-11 w-11 rounded-full object-cover">`:`<div class="grid h-11 w-11 place-items-center rounded-full bg-red-700 font-bold text-white">${item.isGroup?'<i class="fa-solid fa-users"></i>':initials(item.title)}</div>`;
        const pinIcon=item.pinned?'<i class="fa-solid fa-thumbtack thread-pin-icon"></i>':'';
        const muteIcon=item.muted?'<i class="fa-solid fa-bell-slash text-gray-300 text-xs ml-1"></i>':'';
        const favIcon=item.favorite?'<i class="fa-solid fa-star text-amber-400 text-xs ml-1"></i>':'';
        const unread=Number(item.unread||0);
        return `<div class="ck-row thread-row flex items-center gap-3 border-b border-gray-100 p-4 transition hover:bg-red-50" data-key="${esc(item.key)}">
          <div class="shrink-0">${avatar}</div>
          <div class="min-w-0 flex-1 cursor-pointer" data-open>
            <div class="flex items-center justify-between gap-3"><strong class="truncate text-gray-900">${pinIcon}${esc(item.title)}${muteIcon}${favIcon}</strong><span class="shrink-0 text-xs text-gray-400">${timeLabel(item.lastAt)}</span></div>
            <div class="mt-1 flex items-center justify-between gap-2"><p class="truncate text-sm text-gray-500">${esc(item.subtitle||'')}</p>${unread?`<span class="unread-badge shrink-0">${unread}</span>`:''}</div>
          </div>
          <button type="button" class="ck-trigger" data-row-trigger aria-label="Chat options"><i class="fa-solid fa-chevron-down"></i></button>
        </div>`;
      }).join('');
      list.querySelectorAll('.thread-row').forEach((row)=>{
        const key=row.dataset.key;
        row.querySelector('[data-open]').addEventListener('click',()=>openOrgThreadRow(key));
        let pressTimer=null;
        row.addEventListener('touchstart',()=>{pressTimer=setTimeout(()=>openOrgRowMenu(key,row),500);},{passive:true});
        ['touchend','touchmove','touchcancel'].forEach((evt)=>row.addEventListener(evt,()=>clearTimeout(pressTimer)));
        row.querySelector('[data-row-trigger]').addEventListener('click',(e)=>{e.preventDefault();e.stopPropagation();openOrgRowMenu(key,e.currentTarget);});
      });
    }
    document.getElementById('org-tutor-thread-search').addEventListener('input',renderOrgMessageList);
    document.getElementById('org-tutor-archive-view-link').addEventListener('click',()=>{orgArchiveView=!orgArchiveView;renderOrgMessageList();});

    function openOrgThreadRow(key){
      const item=orgMessageRows.find((r)=>r.key===key);
      if(!item)return;
      if(item.href){window.location.href=item.href;return;}
      openEmbeddedOrgThread(item);
    }
    function openEmbeddedOrgThread(item){
      activeEmbeddedRow=item;
      document.getElementById('org-tutor-messages-list-view').classList.add('hidden');
      document.getElementById('org-tutor-chat-view').classList.remove('hidden');
      document.getElementById('org-tutor-thread-title').textContent=item.title||'Conversation';
      if(tutorChatController){tutorChatController.destroy();tutorChatController=null;}
      const actions=orgChatActionUrls(item.apiId);
      tutorChatController=ChatKit.mount(document.getElementById('org-tutor-chat-mount'),{
        me:{id:myUserId,role:'tutor'}, isGroup:Boolean(item.isGroup), onAlert:(m)=>alert(m),
        api:{
          list:async()=>{const d=await fetch(`/api/org-chat/conversations/${item.apiId}/messages`).then((r)=>r.json());return{success:d.success,messages:d.messages||[]};},
          send:async(payload)=>fetch(`/api/org-chat/conversations/${item.apiId}/messages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then((r)=>r.json()),
          ...actions,
        },
      });
    }
    document.getElementById('org-tutor-chat-back').addEventListener('click',()=>{
      if(tutorChatController){tutorChatController.destroy();tutorChatController=null;}
      activeEmbeddedRow=null;
      document.getElementById('org-tutor-chat-view').classList.add('hidden');
      document.getElementById('org-tutor-messages-list-view').classList.remove('hidden');
      loadOrgMessages();
    });
    document.getElementById('org-tutor-call-btn').addEventListener('click',async()=>{
      if(!activeEmbeddedRow)return;
      const existing=await fetch(`/api/org-chat/conversations/${activeEmbeddedRow.apiId}/messages`).then((r)=>r.json()).catch(()=>null);
      if(existing&&existing.success&&existing.conversation&&existing.conversation.meetingLink){window.location.href=existing.conversation.meetingLink;return;}
      const win=window.open('https://meet.google.com/new','_blank','noopener');
      if(!win)window.location.href='https://meet.google.com/new';
    });

    // --- Row menu (archive/mute/pin/mark-unread/favorite/block/clear/delete) - same routes and behavior as messages.html's row-menu ---
    const orgRowMenu=document.getElementById('org-row-menu');
    const orgRowMuteSubmenu=document.getElementById('org-row-mute-submenu');
    let orgRowMenuKey=null;
    function closeOrgRowMenu(){orgRowMenu.hidden=true;orgRowMuteSubmenu.hidden=true;orgRowMenuKey=null;}
    function openOrgRowMenu(key,anchor){
      orgRowMenuKey=key;
      const item=orgMessageRows.find((r)=>r.key===key);
      if(!item)return;
      document.getElementById('org-row-block-btn').classList.toggle('hidden',item.kind!=='assignment');
      document.getElementById('org-row-archive-label').textContent=item.archived?'Unarchive chat':'Archive chat';
      document.getElementById('org-row-pin-label').textContent=item.pinned?'Unpin chat':'Pin chat';
      document.getElementById('org-row-favorite-label').textContent=item.favorite?'Remove Favourite':'Add to Favourite';
      document.getElementById('org-row-mute-label').textContent=item.muted?'Muted (tap to unmute)':'Mute notification';
      document.getElementById('org-row-block-label').textContent=item.blocked?'Unblock':'Block';
      const rect=anchor.getBoundingClientRect();
      orgRowMenu.style.left=`${Math.max(8,rect.right-210)}px`;
      orgRowMenu.style.top=`${rect.bottom+4}px`;

    }
    document.addEventListener('click',(e)=>{if(!orgRowMenu.hidden&&!e.target.closest('#org-row-menu'))closeOrgRowMenu();});
    document.getElementById('org-row-mute-toggle').addEventListener('click',(e)=>{
      e.stopPropagation();
      const item=orgMessageRows.find((r)=>r.key===orgRowMenuKey);
      if(item&&item.muted){setOrgRowMute(null);return;}
      const rect=e.currentTarget.getBoundingClientRect();
      orgRowMuteSubmenu.style.left=`${rect.right+4}px`;
      orgRowMuteSubmenu.style.top=`${rect.top}px`;
      orgRowMuteSubmenu.hidden=!orgRowMuteSubmenu.hidden;
    });
    orgRowMuteSubmenu.addEventListener('click',(e)=>{const btn=e.target.closest('button[data-mute]');if(btn)setOrgRowMute(btn.dataset.mute);});
    async function setOrgRowMute(duration){
      const item=orgMessageRows.find((r)=>r.key===orgRowMenuKey);
      closeOrgRowMenu();
      if(!item)return;
      await fetch(`/api/threads/${rowThreadType(item)}/${item.apiId}/mute`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({duration})});
      loadOrgMessages();
    }
    orgRowMenu.addEventListener('click',async(e)=>{
      const btn=e.target.closest('button[data-row-action]');
      if(!btn)return;
      const action=btn.dataset.rowAction;
      if(action==='mute-toggle')return;
      const item=orgMessageRows.find((r)=>r.key===orgRowMenuKey);
      closeOrgRowMenu();
      if(!item)return;
      const base=`/api/threads/${rowThreadType(item)}/${item.apiId}`;
      if(action==='archive'){await fetch(`${base}/archive`,{method:'POST'});loadOrgMessages();}
      else if(action==='pin'){await fetch(`${base}/pin`,{method:'POST'});loadOrgMessages();}
      else if(action==='mark-unread'){await fetch(`${base}/mark-unread`,{method:'POST'});loadOrgMessages();}
      else if(action==='favorite'){await fetch(`${base}/favorite`,{method:'POST'});loadOrgMessages();}
      else if(action==='block'){if(!confirm('Change block status for this person?'))return;await fetch(`${base}/block`,{method:'POST'});loadOrgMessages();}
      else if(action==='clear'){if(!confirm('Clear this chat? This removes all messages for you only.'))return;await fetch(`${base}/clear`,{method:'POST'});loadOrgMessages();}
      else if(action==='delete'){if(!confirm('Delete this chat? It will disappear until a new message arrives.'))return;await fetch(`${base}/delete`,{method:'POST'});loadOrgMessages();}
    });

    // --- Header "..." menu: New group / Mark all as read ---
    const orgMessagesMoreMenu=document.getElementById('org-messages-more-menu');
    document.getElementById('org-tutor-messages-more-btn').addEventListener('click',(e)=>{
      e.stopPropagation();
      if(orgMessagesMoreMenu.hidden){const rect=e.currentTarget.getBoundingClientRect();orgMessagesMoreMenu.style.left=`${Math.max(8,rect.right-200)}px`;orgMessagesMoreMenu.style.top=`${rect.bottom+6}px`;}
      orgMessagesMoreMenu.hidden=!orgMessagesMoreMenu.hidden;
    });
    document.addEventListener('click',(e)=>{if(!orgMessagesMoreMenu.hidden&&!e.target.closest('#org-messages-more-menu')&&!e.target.closest('#org-tutor-messages-more-btn'))orgMessagesMoreMenu.hidden=true;});
    orgMessagesMoreMenu.addEventListener('click',(e)=>{
      const btn=e.target.closest('button[data-more]');
      if(!btn)return;
      orgMessagesMoreMenu.hidden=true;
      if(btn.dataset.more==='new-group')document.getElementById('org-tutor-new-group-btn').click();
      else if(btn.dataset.more==='mark-all-read'){fetch('/api/threads/mark-all-read',{method:'POST'}).then(loadOrgMessages);}
    });

    // --- Calendar / Schedules ---
    let calMonth=new Date(); calMonth.setDate(1);
    let scheduleTab='upcoming';
    function eventsForOrg(){return state.data?.events||[];}
    function renderCalendar(){
      const grid=document.getElementById('cal-grid');
      document.getElementById('cal-label').textContent=calMonth.toLocaleDateString([],{month:'long',year:'numeric'});
      const year=calMonth.getFullYear(), month=calMonth.getMonth();
      const startOffset=new Date(year,month,1).getDay();
      const daysInMonth=new Date(year,month+1,0).getDate();
      const cells=[];
      for(let i=startOffset;i>0;i--)cells.push(new Date(year,month,1-i));
      for(let d=1;d<=daysInMonth;d++)cells.push(new Date(year,month,d));
      while(cells.length%7!==0)cells.push(new Date(year,month,daysInMonth+(cells.length-startOffset-daysInMonth+1)));
      const today=new Date();
      grid.innerHTML=cells.map((date)=>{
        const otherMonth=date.getMonth()!==month;
        const isToday=date.toDateString()===today.toDateString();
        const hasEvents=eventsForOrg().some((ev)=>new Date(ev.scheduledAt).toDateString()===date.toDateString());
        return `<button type="button" class="cal-day${otherMonth?' other-month':''}${isToday?' today':''}" data-date="${date.toISOString()}">${date.getDate()}${hasEvents?'<span class="cal-dot"></span>':''}</button>`;
      }).join('');
      grid.querySelectorAll('.cal-day').forEach((btn)=>btn.addEventListener('click',()=>{
        grid.querySelectorAll('.cal-day').forEach((b)=>b.classList.remove('selected'));
        btn.classList.add('selected');
        renderScheduleList(new Date(btn.dataset.date));
      }));
    }
    document.getElementById('cal-prev').addEventListener('click',()=>{calMonth.setMonth(calMonth.getMonth()-1);renderCalendar();});
    document.getElementById('cal-next').addEventListener('click',()=>{calMonth.setMonth(calMonth.getMonth()+1);renderCalendar();});
    function renderScheduleList(dayFilter){
      const now=new Date();
      let items=eventsForOrg().slice().sort((a,b)=>new Date(a.scheduledAt)-new Date(b.scheduledAt));
      if(dayFilter instanceof Date)items=items.filter((e)=>new Date(e.scheduledAt).toDateString()===dayFilter.toDateString());
      else if(scheduleTab==='upcoming')items=items.filter((e)=>new Date(e.scheduledAt)>=now);
      else if(scheduleTab==='today')items=items.filter((e)=>new Date(e.scheduledAt).toDateString()===now.toDateString());
      else if(scheduleTab==='past')items=items.filter((e)=>new Date(e.scheduledAt)<now).reverse();
      const list=document.getElementById('schedule-list');
      list.innerHTML=items.map((e)=>{
        const when=new Date(e.scheduledAt);
        const isPast=when<now;
        return `<article class="rounded-xl border bg-white p-4"><strong>${esc(e.title)}</strong><p class="text-sm text-gray-500">${when.toLocaleString()}</p>${e.meetLink&&!isPast?`<a class="mt-3 inline-flex rounded-lg bg-red-700 px-3 py-2 text-sm font-semibold text-white" href="${esc(e.meetLink)}" target="_blank" rel="noopener">Join meeting</a>`:isPast?'<span class="mt-2 inline-block text-xs font-semibold text-gray-400">Past</span>':''}</article>`;
      }).join('')||'<p class="text-gray-500">No meetings.</p>';
    }
    document.querySelectorAll('.schedule-tab').forEach((btn)=>btn.addEventListener('click',()=>{
      document.querySelectorAll('.schedule-tab').forEach((b)=>b.classList.remove('active','border-b-2','border-red-700','text-red-700'));
      btn.classList.add('active','border-b-2','border-red-700','text-red-700');
      document.querySelectorAll('#cal-grid .cal-day').forEach((b)=>b.classList.remove('selected'));
      scheduleTab=btn.dataset.scheduleTab;
      renderScheduleList();
    }));
    let libraryLoadedOnce=false;
    function activate(panel){document.querySelectorAll('.org-tutor-panel').forEach((node)=>node.classList.toggle('active',node.id==='panel-'+panel));document.querySelectorAll('.org-tutor-nav button').forEach((node)=>node.classList.toggle('active',node.dataset.panel===panel));document.getElementById('org-tutor-sidebar').classList.remove('open');if(panel==='messages')loadOrgMessages();else if(panel==='schedules'){renderCalendar();renderScheduleList();}else if(panel==='library'&&!libraryLoadedOnce){libraryLoadedOnce=true;loadOrgLibrary('general');}}
    function render(){const d=state.data; document.getElementById('org-tutor-org-name').textContent=d.organization.name;document.getElementById('org-tutor-sidebar-name').textContent=d.organization.name; document.getElementById('org-tutor-logo').innerHTML=d.organization.logoUrl?`<img src="${esc(d.organization.logoUrl)}" alt="" class="h-full w-full object-cover">`:esc((d.organization.name||'O').trim().charAt(0).toUpperCase());document.getElementById('requests-list').innerHTML=(d.requests||[]).map((r)=>`<article class="rounded-xl border border-amber-200 bg-amber-50 p-4"><strong>${esc(r.studentName||'Student')}</strong><p class="mt-1 text-sm">${esc(r.category)} · ${esc(r.lessonType)}</p></article>`).join('')||'<p class="text-gray-500">No organization requests.</p>';const content=d.content||[];document.getElementById('announcements-list').innerHTML=content.filter((i)=>i.type==='announcement').map((i)=>`<article class="rounded-xl border bg-white p-4"><strong>${esc(i.title)}</strong><p class="mt-2 text-sm text-gray-600">${esc(i.text)}</p>${contentAttachmentHtml(i)}${reactionsHtml(i)}</article>`).join('')||'<p class="text-gray-500">No announcements.</p>';document.getElementById('feeds-list').innerHTML=content.filter((i)=>['feed','photo','video'].includes(i.type)).map((i)=>`<article class="rounded-xl border bg-white p-4"><strong>${esc(i.title)}</strong><p class="mt-2 text-sm text-gray-600">${esc(i.text)}</p>${contentAttachmentHtml(i)}${reactionsHtml(i)}</article>`).join('')||'<p class="text-gray-500">No feeds.</p>';wireReactionButtons(content,render);document.getElementById('notifications-list').innerHTML=(d.notifications||[]).map((n,index)=>`<button class="org-notification rounded-xl border bg-white p-4 text-left ${n.read?'':'border-l-4 border-l-red-700'}" data-index="${index}"><strong>${esc(n.type||'Update')}</strong><p class="mt-1 text-sm text-gray-600">${esc(n.message)}</p></button>`).join('')||'<p class="text-gray-500">No notifications.</p>';document.querySelectorAll('.org-notification').forEach((button)=>button.addEventListener('click',async()=>{const item=d.notifications[Number(button.dataset.index)];if(item&&item.id&&!item.read)await fetch(`/api/notifications/${encodeURIComponent(item.id)}/read`,{method:'POST'});button.classList.remove('border-l-4','border-l-red-700');}));document.getElementById('settings-name').value=(state.tutorProfile&&state.tutorProfile.name)||'';document.getElementById('settings-phone').value=(state.tutorProfile&&state.tutorProfile.phone)||'';}
    const PAGE_LOADER_MIN_MS=600; // same floor as the mobile app's splash - long enough to read as a real branded load, not a flash
    const pageLoadStartedAt=Date.now();
    function hidePageLoader(){const elapsed=Date.now()-pageLoadStartedAt;const wait=Math.max(0,PAGE_LOADER_MIN_MS-elapsed);setTimeout(()=>document.getElementById('org-tutor-page-loader').classList.add('hidden'),wait);}
    async function load(){const params=new URLSearchParams(location.search);const [r,sessionRes,tutorRes]=await Promise.all([fetch('/api/organizations/tutor-workspace?orgId='+encodeURIComponent(params.get('orgId')||'')),fetch('/api/session'),fetch('/api/tutors/me')]);const d=await r.json();const session=await sessionRes.json();const tutorData=await tutorRes.json().catch(()=>null);if(session.user)myUserId=session.user.id;if(tutorData&&tutorData.success)state.tutorProfile=tutorData.profile;if(!d.success){location.href='/tutor';return}state.data=d;render();const unread=(d.notifications||[]).filter((n)=>!n.read).length;const badge=document.getElementById('org-tutor-badge');badge.textContent=unread;badge.classList.toggle('hidden',!unread);hidePageLoader();}
    document.querySelectorAll('.org-tutor-nav button').forEach((b)=>b.addEventListener('click',()=>activate(b.dataset.panel)));
    let currentLibraryView='general';
    document.querySelectorAll('.library-view-tab').forEach((btn)=>btn.addEventListener('click',()=>{document.querySelectorAll('.library-view-tab').forEach((b)=>b.classList.remove('active','border-b-2','border-red-700','text-red-700'));btn.classList.add('active','border-b-2','border-red-700','text-red-700');currentLibraryView=btn.dataset.libraryView;loadOrgLibrary(currentLibraryView);}));
    document.getElementById('library-upload-btn').addEventListener('click',()=>{if(currentLibraryView==='mine')openMyLibraryUploadModal();else if(currentLibraryView==='shared')openSharedUploadModal();else alert('Switch to "My Uploads" or "Shared" to upload something there.');});
    function openMyLibraryUploadModal(){
      const categories=(state.tutorProfile&&state.tutorProfile.categories)||[];
      const modal=document.createElement('div');
      modal.className='modal-backdrop';
      modal.innerHTML=`<div class="modal-panel"><div class="row mb-4"><h3 class="text-xl font-bold">Add a video to your library</h3><button type="button" class="btn-secondary" data-close><i class="fa-solid fa-xmark"></i></button></div>
        <label class="block text-sm font-semibold mb-1">Subject</label>
        <select id="my-lib-category" class="w-full rounded-lg border border-gray-300 px-3 py-2 mb-3">${categories.map((c)=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')||'<option value="">General</option>'}</select>
        <label class="block text-sm font-semibold mb-1">Title</label>
        <input id="my-lib-title" class="w-full rounded-lg border border-gray-300 px-3 py-2 mb-3" placeholder="Video title">
        <label class="block text-sm font-semibold mb-1">Description (optional)</label>
        <textarea id="my-lib-description" rows="2" class="w-full rounded-lg border border-gray-300 px-3 py-2 mb-3"></textarea>
        <label class="block text-sm font-semibold mb-1">Video file</label>
        <input id="my-lib-file" type="file" accept="video/*" class="w-full rounded-lg border border-gray-300 px-3 py-2 mb-3">
        <label class="block text-sm font-semibold mb-1">Or paste a link instead</label>
        <input id="my-lib-url" type="url" placeholder="https://..." class="w-full rounded-lg border border-gray-300 px-3 py-2 mb-4">
        <button type="button" id="my-lib-send" class="btn-primary w-full"><i class="fa-solid fa-upload mr-2"></i>Add to my library</button>
      </div>`;
      document.body.appendChild(modal);
      modal.querySelector('[data-close]').onclick=()=>modal.remove();
      modal.addEventListener('click',(e)=>{if(e.target===modal)modal.remove();});
      modal.querySelector('#my-lib-send').onclick=async()=>{
        const title=modal.querySelector('#my-lib-title').value.trim();
        const description=modal.querySelector('#my-lib-description').value.trim();
        const category=modal.querySelector('#my-lib-category').value;
        const file=modal.querySelector('#my-lib-file').files[0];
        let url=modal.querySelector('#my-lib-url').value.trim();
        if(!title)return alert('Give this video a title.');
        if(!file&&!url)return alert('Choose a video file or paste a link.');
        const btn=modal.querySelector('#my-lib-send');
        btn.disabled=true;btn.textContent='Uploading...';
        try{
          let isFile=false;
          if(file){
            const body=new FormData();body.append('video',file);
            const up=await fetch('/api/tutor-library/upload',{method:'POST',body}).then((r)=>r.json());
            if(!up.success)throw new Error(up.error||'Upload failed.');
            url=up.url;isFile=true;
          }
          const res=await fetch('/api/tutor-library',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,description,url,category,isFile})}).then((r)=>r.json());
          if(!res.success)throw new Error(res.error||'Could not add this video.');
          modal.remove();
          loadOrgLibrary('mine');
        }catch(error){
          alert(error.message||'Could not add this video.');
          btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-upload mr-2"></i>Add to my library';
        }
      };
    }
    function openSharedUploadModal(){
      const orgId=state.data?.organization?.id;
      const modal=document.createElement('div');
      modal.className='modal-backdrop';
      modal.innerHTML=`<div class="modal-panel"><div class="row mb-4"><h3 class="text-xl font-bold">Share with your organization</h3><button type="button" class="btn-secondary" data-close><i class="fa-solid fa-xmark"></i></button></div>
        <label class="block text-sm font-semibold mb-1">Title</label>
        <input id="shared-up-title" class="w-full rounded-lg border border-gray-300 px-3 py-2 mb-3" placeholder="e.g. Signed intake form">
        <label class="block text-sm font-semibold mb-1">Attach a file</label>
        <input id="shared-up-file" type="file" class="w-full rounded-lg border border-gray-300 px-3 py-2 mb-3">
        <label class="block text-sm font-semibold mb-1">Or paste a link instead</label>
        <input id="shared-up-url" type="url" placeholder="https://..." class="w-full rounded-lg border border-gray-300 px-3 py-2 mb-3">
        <label class="block text-sm font-semibold mb-1">Note (optional)</label>
        <textarea id="shared-up-note" rows="2" class="w-full rounded-lg border border-gray-300 px-3 py-2 mb-4"></textarea>
        <button type="button" id="shared-up-send" class="btn-primary w-full"><i class="fa-solid fa-paper-plane mr-2"></i>Send to organization</button>
      </div>`;
      document.body.appendChild(modal);
      modal.querySelector('[data-close]').onclick=()=>modal.remove();
      modal.addEventListener('click',(e)=>{if(e.target===modal)modal.remove();});
      modal.querySelector('#shared-up-send').onclick=async()=>{
        const title=modal.querySelector('#shared-up-title').value.trim();
        const file=modal.querySelector('#shared-up-file').files[0];
        const url=modal.querySelector('#shared-up-url').value.trim();
        const text=modal.querySelector('#shared-up-note').value.trim();
        if(!file&&!url)return alert('Attach a file or paste a link.');
        const btn=modal.querySelector('#shared-up-send');
        btn.disabled=true;btn.textContent='Sending...';
        try{
          let fileUrl=null;
          if(file){
            const type=file.type.startsWith('image/')?'photo':file.type.startsWith('video/')?'video':'document';
            const body=new FormData();body.append('media',file);
            const up=await fetch(`/api/organizations/upload-media?type=${type}`,{method:'POST',body}).then((r)=>r.json());
            if(!up.success)throw new Error(up.error||'File upload failed.');
            fileUrl=up.url;
          }
          const res=await fetch(`/api/organizations/${orgId}/library/shared-uploads`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,url:url||null,fileUrl,text})}).then((r)=>r.json());
          if(!res.success)throw new Error(res.error||'Could not share this.');
          modal.remove();
          loadOrgLibrary('shared');
        }catch(error){
          alert(error.message||'Could not share this.');
          btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-paper-plane mr-2"></i>Send to organization';
        }
      };
    }
    // Announcements/feed items can carry an uploaded file (photo, video, or
    // a document like a PDF) or a pasted link - `type` on these items is
    // always 'announcement'/'feed' itself, never 'photo'/'video', so the
    // attachment kind is sniffed from the file's extension instead.
    function contentAttachmentHtml(item){
      if (item.fileUrl && /\.(png|jpe?g|gif|webp|heic)(\?|$)/i.test(item.fileUrl)) {
        return `<img src="${esc(item.fileUrl)}" alt="${esc(item.title)}" class="mt-3 max-h-72 w-full rounded-lg object-cover">`;
      }
      if (item.fileUrl && /\.(mp4|webm|mov|m4v)(\?|$)/i.test(item.fileUrl)) {
        return `<video src="${esc(item.fileUrl)}" controls preload="metadata" class="mt-3 max-h-72 w-full rounded-lg bg-black"></video>`;
      }
      if (item.fileUrl) {
        return `<a href="${esc(item.fileUrl)}" target="_blank" rel="noreferrer" class="mt-2 inline-flex items-center gap-1 text-xs font-semibold text-red-700 underline"><i class="fa-solid fa-file-arrow-down"></i>Open attachment</a>`;
      }
      if (item.url) {
        return `<a href="${esc(item.url)}" target="_blank" rel="noreferrer" class="mt-2 inline-flex items-center gap-1 text-xs font-semibold text-red-700 underline"><i class="fa-solid fa-arrow-up-right-from-square"></i>Open link</a>`;
      }
      return '';
    }
    // Same 5-emoji set/toggle behavior as the mobile app's Feeds screen
    // (OrgFeedsScreen.tsx) - tap an emoji to react, tap it again to remove
    // your reaction. The server (/api/organizations/content/:id/react)
    // already supports this for every content item; only the UI was
    // missing here.
    const REACTIONS = ['\u{1F44D}', '❤️', '\u{1F602}', '\u{1F622}', '\u{1F64F}'];
    function reactionsHtml(item){
      const reactions = item.reactions || [];
      const buttons = REACTIONS.map((emoji) => `<button type="button" class="react-btn${item.myReaction===emoji?' active':''}" data-content-id="${item.id}" data-emoji="${emoji}">${emoji}</button>`).join('');
      const count = reactions.length ? `<span class="react-count">${reactions.length}</span>` : '';
      return `<div class="content-reactions mt-3 flex items-center gap-1 flex-wrap">${buttons}${count}</div>`;
    }
    async function reactToContent(contentList, contentId, emoji, rerender){
      const item = contentList.find((c) => String(c.id) === String(contentId));
      if (!item) return;
      try {
        const res = await fetch(`/api/organizations/content/${encodeURIComponent(contentId)}/react`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ emoji }) });
        const data = await res.json();
        if (data.success) { Object.assign(item, data.item); rerender(); }
      } catch (e) { /* not fatal - reaction just doesn't update */ }
    }
    function wireReactionButtons(contentList, rerender){
      document.querySelectorAll('.react-btn').forEach((btn) => btn.addEventListener('click', () => reactToContent(contentList, btn.dataset.contentId, btn.dataset.emoji, rerender)));
    }
    function libraryItemLinkHtml(item){
      if (item.fileUrl) return `<a href="${esc(item.fileUrl)}" target="_blank" rel="noreferrer" class="text-xs font-semibold text-red-700 underline"><i class="fa-solid fa-file-arrow-down mr-1"></i>Open</a>`;
      if (item.url) return `<a href="${esc(item.url)}" target="_blank" rel="noreferrer" class="text-xs font-semibold text-red-700 underline"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>Open</a>`;
      return '';
    }
    async function loadOrgLibrary(view){document.getElementById('org-library-grid').innerHTML='<div class="spinner-wrap"><div class="spinner"></div></div>';const res=await fetch(`/api/organizations/library?view=${view}`);const d=await res.json();if(!d.success)return;const grouped={};(d[view]||[]).forEach((item)=>{const folder=item.folderId||'Uncategorized';if(!grouped[folder])grouped[folder]=[];grouped[folder].push(item);});const grid=document.getElementById('org-library-grid');grid.innerHTML=Object.keys(grouped).length?Object.entries(grouped).map(([folder,items])=>`<details class="rounded-lg border border-gray-200 bg-white p-4"><summary class="cursor-pointer font-bold flex items-center gap-2"><i class="fa-solid fa-folder"></i>${esc(folder)} <span class="text-xs text-gray-500 ml-auto">${items.length} item${items.length!==1?'s':''}</span></summary><div class="mt-3 grid gap-2">${items.map((item)=>`<div class="p-3 bg-gray-50 rounded-lg"><div class="flex items-start justify-between gap-2"><div class="min-w-0"><strong class="text-sm">${esc(item.title)}</strong>${item.category?`<p class="text-xs text-gray-500">${esc(item.category)}</p>`:''}</div>${libraryItemLinkHtml(item)}</div>${item.requiresSubmission?`<span class="mt-1 inline-block text-[10px] font-bold uppercase tracking-wide text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full">Every tutor must send this back</span>`:''}${item.text?`<p class="mt-1 text-xs text-gray-600">${esc(item.text)}</p>`:''}${item.requiresSubmission?(item.mySubmission?`<p class="mt-2 text-xs font-semibold text-emerald-700"><i class="fa-solid fa-circle-check mr-1"></i>You sent this back ${new Date(item.mySubmission.createdAt).toLocaleDateString()}</p>`:`<button type="button" class="submit-library-response-btn mt-2 text-xs font-semibold px-2 py-1 bg-red-700 text-white rounded hover:bg-red-800" data-item-id="${item.id}" data-item-title="${esc(item.title)}"><i class="fa-solid fa-upload mr-1"></i>Upload response</button>`):''}</div>`).join('')}</div></details>`).join(''):'<p class="text-gray-500">No uploads in this view yet.</p>';
      grid.querySelectorAll('.submit-library-response-btn').forEach((btn)=>btn.addEventListener('click',()=>openSubmitResponseModal(btn.dataset.itemId, btn.dataset.itemTitle, view)));
    }
    function openSubmitResponseModal(itemId, itemTitle, view){
      const orgId = state.data?.organization?.id;
      const modal = document.createElement('div');
      modal.className = 'modal-backdrop';
      modal.innerHTML = `<div class="modal-panel"><div class="row mb-4"><h3 class="text-xl font-bold">Send back "${esc(itemTitle)}"</h3><button type="button" class="btn-secondary" data-close><i class="fa-solid fa-xmark"></i></button></div>
        <label class="block text-sm font-semibold mb-1">Attach a file</label>
        <input id="submit-response-file" type="file" class="w-full rounded-lg border border-gray-300 px-3 py-2 mb-3">
        <label class="block text-sm font-semibold mb-1">Or paste a link instead</label>
        <input id="submit-response-url" type="url" placeholder="https://..." class="w-full rounded-lg border border-gray-300 px-3 py-2 mb-3">
        <label class="block text-sm font-semibold mb-1">Note (optional)</label>
        <textarea id="submit-response-note" rows="2" class="w-full rounded-lg border border-gray-300 px-3 py-2 mb-4"></textarea>
        <button type="button" id="submit-response-send" class="btn-primary w-full"><i class="fa-solid fa-paper-plane mr-2"></i>Send to organization</button>
      </div>`;
      document.body.appendChild(modal);
      modal.querySelector('[data-close]').onclick = () => modal.remove();
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
      modal.querySelector('#submit-response-send').onclick = async () => {
        const file = modal.querySelector('#submit-response-file').files[0];
        const url = modal.querySelector('#submit-response-url').value.trim();
        const text = modal.querySelector('#submit-response-note').value.trim();
        if (!file && !url) return alert('Attach a file or paste a link.');
        const btn = modal.querySelector('#submit-response-send');
        btn.disabled = true; btn.textContent = 'Sending...';
        try {
          let fileUrl = null;
          if (file) {
            const type = file.type.startsWith('image/') ? 'photo' : file.type.startsWith('video/') ? 'video' : 'document';
            const body = new FormData(); body.append('media', file);
            const upload = await fetch(`/api/organizations/upload-media?type=${type}`, { method: 'POST', body });
            const uploadData = await upload.json();
            if (!uploadData.success) throw new Error(uploadData.error || 'File upload failed.');
            fileUrl = uploadData.url;
          }
          const res = await fetch(`/api/organizations/${orgId}/library/${itemId}/submissions`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: url || null, fileUrl, text }) });
          const data = await res.json();
          if (!data.success) throw new Error(data.error || 'Could not send this back.');
          modal.remove();
          alert('Sent to your organization.');
          loadOrgLibrary(view);
        } catch (error) {
          alert(error.message || 'Could not send this back.');
          btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i>Send to organization';
        }
      };
    }
    const mobileSidebarButton=document.getElementById('org-tutor-mobile');
    const mobileSidebar=document.getElementById('org-tutor-sidebar');
    new MutationObserver(()=>{const isOpen=mobileSidebar.classList.contains('open');mobileSidebarButton.setAttribute('aria-expanded',String(isOpen));mobileSidebarButton.setAttribute('aria-label',isOpen?'Close sidebar':'Open sidebar');mobileSidebarButton.title=isOpen?'Close sidebar':'Open sidebar';document.getElementById('org-tutor-mobile-icon').classList.toggle('fa-angles-right',!isOpen);document.getElementById('org-tutor-mobile-icon').classList.toggle('fa-angles-left',isOpen);}).observe(mobileSidebar,{attributes:true,attributeFilter:['class']});
    document.addEventListener('pointerdown',(event)=>{if(window.matchMedia('(max-width:768px)').matches&&mobileSidebar.classList.contains('open')&&!mobileSidebar.contains(event.target))mobileSidebar.classList.remove('open');});
    document.getElementById('org-tutor-mobile').addEventListener('click',()=>document.getElementById('org-tutor-sidebar').classList.toggle('open'));document.getElementById('org-tutor-notifications').addEventListener('click',()=>activate('notifications'));document.getElementById('mark-read').addEventListener('click',async()=>{const orgId=state.data?.organization?.id;await fetch(`/api/organizations/tutor-workspace/notifications/read-all?orgId=${encodeURIComponent(orgId||'')}`,{method:'POST'});load()});document.getElementById('settings-form').addEventListener('submit',async(e)=>{e.preventDefault();await Promise.all([fetch('/api/profile/name',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('settings-name').value})}),fetch('/api/tutors/me/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:document.getElementById('settings-phone').value})})]);load();});document.getElementById('schedule-class').addEventListener('click',()=>activate('schedules'));document.getElementById('org-tutor-new-group-btn').addEventListener('click',()=>{const students=state.data?.students||[];const modal=document.createElement('div');modal.className='modal-backdrop';modal.innerHTML='<div class="modal-panel"><div class="row mb-4"><h3 class="text-2xl font-bold">Create student group</h3><button type="button" class="btn-secondary" data-close><i class="fa-solid fa-xmark"></i></button></div><input id="group-name-input" class="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="Group name"><div class="mt-3 space-y-2 max-h-48 overflow-y-auto">'+(students.length?students.map((student)=>'<label class="flex items-center gap-2"><input type="checkbox" class="group-student" value="'+student.studentId+'" checked><span>'+esc(student.studentName)+'</span></label>').join(''):'<p class="text-gray-500">No students have applied to you yet.</p>')+'</div><button type="button" id="save-group-btn" class="btn-primary mt-4 w-full">Create group</button></div>';document.body.appendChild(modal);modal.querySelector('[data-close]').onclick=()=>modal.remove();modal.querySelector('#save-group-btn').onclick=async()=>{const groupName=modal.querySelector('#group-name-input').value.trim();const selected=[...modal.querySelectorAll('.group-student:checked')];if(!groupName||!selected.length)return;const members=selected.map((input)=>{const student=students.find((item)=>String(item.studentId)===input.value);return {id:Number(input.value),type:'student',name:student?.studentName||'Student'};});const response=await fetch('/api/organizations/group-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({groupName,members})});const result=await response.json();if(!result.success)return;modal.remove();loadOrgMessages();};});load().catch(()=>location.href='/tutor');
  </script>
