<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Organization Tutor Dashboard</title>
  <link rel="shortcut icon" href="/mozartLogo.jpg" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{'primary-red':'#cc0000'}}}}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/chat-kit.css">
  <style>
    .org-tutor-roster{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;height:32rem}
    .org-tutor-roster-list{border:1px solid #eaded8;border-radius:14px;background:#fff8f6;padding:12px;overflow-y:auto}
    .org-tutor-roster-item{display:block;width:100%;text-align:left;border:1px solid #eaded8;border-radius:10px;background:#fff;padding:10px 12px;margin-bottom:8px;font-size:.85rem;font-weight:600;cursor:pointer}
    .org-tutor-roster-item.active{background:#cc0000;color:#fff;border-color:#cc0000}
    .org-tutor-roster-item small{display:block;font-weight:500;opacity:.7;font-size:.72rem;margin-top:2px}
    .org-tutor-thread{border:1px solid #eaded8;border-radius:14px;background:#fff;display:flex;flex-direction:column;overflow:hidden}
    .org-tutor-thread-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #eaded8}
    .org-tutor-call-btn{border:none;background:#fff0ec;color:#cc0000;width:32px;height:32px;border-radius:999px;cursor:pointer}
    body{font-family:Montserrat,system-ui,sans-serif;background:linear-gradient(135deg,#fff,#f8f5f1);color:#241f1c}
    .org-tutor-shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 72px)}
    .org-tutor-sidebar{background:#fff8f6;border-right:1px solid #eaded8}
    .org-tutor-nav button{transition:transform .2s ease,background .2s ease}
    .org-tutor-nav button:hover{transform:translateX(3px);background:#fff0ec}
    .org-tutor-nav button.active{background:#cc0000;color:#fff}
    .org-tutor-panel{display:none}
    .org-tutor-panel.active{display:block}
    .edit-library-btn,.delete-library-btn{transition:all .2s ease;font-size:.75rem;padding:.375rem .75rem;border-radius:.5rem;border:none;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:.25rem;box-shadow:0 2px 4px rgba(0,0,0,.1)}
    .edit-library-btn{background:#2563eb;color:#fff}
    .delete-library-btn{background:#dc2626;color:#fff}
    #create-group-chat{bottom:6rem}
    @keyframes slideInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    details{animation:slideInUp .3s ease-out}
    @media(max-width:768px){
      body{min-width:0}
      .org-tutor-shell{display:block;min-height:calc(100vh - 72px)}
      .org-tutor-sidebar{position:fixed;top:72px;bottom:0;left:0;width:min(86vw,300px);z-index:40;transform:translateX(-105%);transition:transform .25s ease;box-shadow:12px 0 28px rgba(36,31,28,.16)}
      .org-tutor-sidebar.open{transform:translateX(0)}
      .org-tutor-main{width:100%;padding:16px 12px}
      .org-tutor-main h2{font-size:1.35rem}
      .org-tutor-nav button{min-height:46px}
      .org-tutor-mobile{display:inline-flex!important}
      .org-tutor-panel>div,.org-tutor-panel article{max-width:100%}
      .org-tutor-panel .flex{flex-wrap:wrap}
      .org-tutor-panel .flex>a,.org-tutor-panel .flex>button{max-width:100%}
      .org-tutor-panel details{padding:12px}
      .org-tutor-panel details>summary{font-size:.9rem}
      .org-tutor-panel input,.org-tutor-panel textarea,.org-tutor-panel select{max-width:100%}
    }
  </style>
</head>
  <header class="sticky top-0 z-30 border-b border-red-100 bg-white">
    <div class="mx-auto flex h-[72px] max-w-7xl items-center justify-between gap-4 px-4 sm:px-6">
      <div class="flex items-center gap-3"><a href="/tutor" id="org-tutor-back" class="rounded-lg p-2 text-red-700 hover:bg-red-50" aria-label="Back to tutor dashboard" title="Back"><i class="fa-solid fa-arrow-left"></i></a><a href="/org-tutor" class="flex items-center gap-3"><img id="org-tutor-logo" src="/mozartLogo.jpg" alt="Organization" class="h-10 w-10 rounded-xl object-cover"><div><p id="org-tutor-org-name" class="text-xs font-bold uppercase tracking-wide text-red-700">Organization</p><h1 class="font-bold text-gray-900">Tutor Dashboard</h1></div></a></div>
      <div class="flex items-center gap-3"><button id="org-tutor-notifications" class="relative rounded-lg p-2 text-gray-600 hover:text-red-700" aria-label="Notifications" title="Notifications"><i class="fa-solid fa-bell"></i><span id="org-tutor-badge" class="absolute right-0 top-0 hidden rounded-full bg-red-700 px-1 text-[10px] text-white">0</span></button><button id="org-tutor-mobile" class="org-tutor-mobile hidden rounded-lg p-2 text-red-700" aria-label="Open sidebar"><i class="fa-solid fa-bars"></i></button><div id="auth-state"></div></div>
    </div>
  </header>
  <div class="org-tutor-shell">
    <aside id="org-tutor-sidebar" class="org-tutor-sidebar p-4"><div class="mb-5 flex items-center gap-3"><button id="org-tutor-sidebar-toggle" class="rounded-lg p-2 text-red-700 hover:bg-red-50" aria-label="Collapse sidebar" title="Collapse sidebar"><i class="fa-solid fa-bars"></i></button><strong id="org-tutor-sidebar-name">Organization</strong></div><nav class="org-tutor-nav grid gap-2"><button class="active rounded-lg px-3 py-2 text-left font-semibold" data-panel="requests"><i class="fa-solid fa-inbox mr-2"></i>Requests</button><button class="rounded-lg px-3 py-2 text-left font-semibold" data-panel="students"><i class="fa-solid fa-users mr-2"></i>Students</button><button class="rounded-lg px-3 py-2 text-left font-semibold" data-panel="classes"><i class="fa-solid fa-calendar-days mr-2"></i>Classes</button><button class="rounded-lg px-3 py-2 text-left font-semibold" data-panel="messages"><i class="fa-solid fa-comments mr-2"></i>Messages</button><button class="rounded-lg px-3 py-2 text-left font-semibold" data-panel="announcements"><i class="fa-solid fa-bullhorn mr-2"></i>Announcements</button><button class="rounded-lg px-3 py-2 text-left font-semibold" data-panel="feeds"><i class="fa-solid fa-rss mr-2"></i>Feeds</button><button class="rounded-lg px-3 py-2 text-left font-semibold" data-panel="library"><i class="fa-solid fa-book mr-2"></i>Uploads & Library</button><button class="rounded-lg px-3 py-2 text-left font-semibold" data-panel="notifications"><i class="fa-solid fa-bell mr-2"></i>Notifications</button><button class="rounded-lg px-3 py-2 text-left font-semibold" data-panel="settings"><i class="fa-solid fa-gear mr-2"></i>Settings</button></nav></aside>
    <main class="org-tutor-main mx-auto w-full max-w-6xl p-8"><section id="panel-requests" class="org-tutor-panel active"><h2 class="text-2xl font-extrabold">Requests</h2><div id="requests-list" class="mt-5 grid gap-3"></div></section><section id="panel-students" class="org-tutor-panel"><div class="flex items-center justify-between gap-3"><h2 class="text-2xl font-extrabold">Students</h2><button id="create-group-chat" class="fixed bottom-6 right-6 grid h-12 w-12 place-items-center rounded-full bg-red-700 text-xl text-white shadow-xl" aria-label="Create group chat" title="Create group chat"><i class="fa-solid fa-plus"></i></button></div><div id="students-list" class="mt-5 grid gap-3"></div></section><section id="panel-classes" class="org-tutor-panel"><h2 class="text-2xl font-extrabold">Classes</h2><button id="schedule-class" class="mt-4 rounded-lg bg-red-700 px-4 py-2 font-semibold text-white"><i class="fa-solid fa-calendar-plus mr-2"></i>Schedule meeting</button><div id="classes-list" class="mt-5 grid gap-3"></div></section><section id="panel-messages" class="org-tutor-panel"><h2 class="text-2xl font-extrabold">Messages</h2><p class="mt-1 text-sm text-gray-500">Talk directly with your organization and any classroom groups you're part of.</p><div class="org-tutor-roster mt-5"><div class="org-tutor-roster-list" id="org-tutor-roster"></div><div class="org-tutor-thread"><div class="org-tutor-thread-head"><h3 id="org-tutor-thread-title" class="font-bold text-sm">Select a conversation</h3><button type="button" id="org-tutor-call-btn" class="org-tutor-call-btn" title="Start a call"><i class="fa-solid fa-video"></i></button></div><div id="org-tutor-chat-mount" class="flex min-h-0 flex-1 flex-col"></div></div></div></section><section id="panel-announcements" class="org-tutor-panel"><h2 class="text-2xl font-extrabold">Announcements</h2><div id="announcements-list" class="mt-5 grid gap-3"></div></section><section id="panel-feeds" class="org-tutor-panel"><h2 class="text-2xl font-extrabold">Organization Feeds</h2><div id="feeds-list" class="mt-5 grid gap-3"></div></section><section id="panel-library" class="org-tutor-panel"><h2 class="text-2xl font-extrabold">Uploads & Library</h2><div class="mt-4 flex gap-2 border-b border-gray-200"><button class="library-view-tab active pb-3 px-3 font-semibold text-red-700 border-b-2 border-red-700" data-library-view="general">General</button><button class="library-view-tab pb-3 px-3 font-semibold text-gray-600 hover:text-gray-800" data-library-view="shared">Shared</button><button class="library-view-tab pb-3 px-3 font-semibold text-gray-600 hover:text-gray-800" data-library-view="mine">My Uploads</button></div><div id="org-library-grid" class="mt-5 grid gap-4"></div></section><section id="panel-notifications" class="org-tutor-panel"><div class="flex items-center justify-between gap-3"><h2 class="text-2xl font-extrabold">Notifications</h2><button id="mark-read" class="rounded-lg border border-gray-200 px-3 py-2 text-sm font-semibold">Mark all as read</button></div><div id="notifications-list" class="mt-5 grid gap-3"></div></section><section id="panel-settings" class="org-tutor-panel"><h2 class="text-2xl font-extrabold">Edit Profile</h2><form id="settings-form" class="mt-5 max-w-xl space-y-3"><input id="settings-name" required class="w-full rounded-lg border border-gray-300 px-3 py-2" placeholder="Name"><input id="settings-phone" class="w-full rounded-lg border border-gray-300 px-3 py-2" placeholder="Phone"><button class="rounded-lg bg-red-700 px-4 py-2 font-semibold text-white">Save changes</button></form></section></main>
  </div>
  <script src="/assets/nav-auth.js"></script><script src="/assets/chat-kit.js"></script><script>
    const state={data:null}; const esc=(v)=>String(v||'').replace(/[&<>"']/g,(m)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    let myUserId=null, tutorConversations=[], tutorChatController=null, tutorActiveConvId=null;
    function orgChatActionUrls(getConvId){return{edit:async(id,text)=>fetch(`/api/org-chat/conversations/${getConvId()}/messages/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})}).then((r)=>r.json()),del:async(id,mode)=>mode==='me'?fetch(`/api/org-chat/conversations/${getConvId()}/messages/${id}/delete-for-me`,{method:'POST'}).then((r)=>r.json()):fetch(`/api/org-chat/conversations/${getConvId()}/messages/${id}`,{method:'DELETE'}).then((r)=>r.json()),react:async(id,emoji)=>fetch(`/api/org-chat/conversations/${getConvId()}/messages/${id}/react`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({emoji})}).then((r)=>r.json()),pin:async(id)=>fetch(`/api/org-chat/conversations/${getConvId()}/messages/${id}/pin`,{method:'POST'}).then((r)=>r.json()),vote:async(id,optionId)=>fetch(`/api/org-chat/conversations/${getConvId()}/messages/${id}/poll-vote`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({optionId})}).then((r)=>r.json())};}
    async function loadTutorMessages(){
      const res=await fetch('/api/organizations/mine/conversations');
      const data=await res.json();
      const list=document.getElementById('org-tutor-roster');
      if(!data.success){list.innerHTML='<p class="text-sm text-gray-500 p-2">Not linked to an organization.</p>';return;}
      tutorConversations=data.conversations||[];
      list.innerHTML=tutorConversations.map((c)=>`<button type="button" class="org-tutor-roster-item${c.id===tutorActiveConvId?' active':''}" data-conv-id="${c.id}">${esc(c.title||(c.type==='group'?'Group chat':data.organizationName||'Organization'))}${c.unreadCount?`<small>${c.unreadCount} unread</small>`:''}</button>`).join('')||'<p class="text-sm text-gray-500 p-2">No conversations yet.</p>';
      list.querySelectorAll('[data-conv-id]').forEach((btn)=>btn.addEventListener('click',()=>openTutorConversation(Number(btn.dataset.convId))));
      if(tutorActiveConvId==null&&tutorConversations.length)openTutorConversation(tutorConversations[0].id);
    }
    function openTutorConversation(convId){
      tutorActiveConvId=convId;
      document.querySelectorAll('.org-tutor-roster-item').forEach((btn)=>btn.classList.toggle('active',Number(btn.dataset.convId)===convId));
      const conv=tutorConversations.find((c)=>c.id===convId);
      document.getElementById('org-tutor-thread-title').textContent=(conv&&conv.title)||'Conversation';
      if(tutorChatController){tutorChatController.destroy();tutorChatController=null;}
      const actions=orgChatActionUrls(()=>tutorActiveConvId);
      tutorChatController=ChatKit.mount(document.getElementById('org-tutor-chat-mount'),{
        me:{id:myUserId,role:'tutor'}, isGroup:Boolean(conv&&conv.type==='group'||conv&&conv.type==='tutor-group'), onAlert:(m)=>alert(m),
        api:{
          list:async()=>{const d=await fetch(`/api/org-chat/conversations/${convId}/messages`).then((r)=>r.json());return{success:d.success,messages:d.messages||[]};},
          send:async(payload)=>fetch(`/api/org-chat/conversations/${convId}/messages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then((r)=>r.json()),
          ...actions,
        },
      });
    }
    document.getElementById('org-tutor-call-btn').addEventListener('click',async()=>{
      if(!tutorActiveConvId)return;
      const existing=await fetch(`/api/org-chat/conversations/${tutorActiveConvId}/messages`).then((r)=>r.json()).catch(()=>null);
      if(existing&&existing.success&&existing.conversation&&existing.conversation.meetingLink){window.location.href=existing.conversation.meetingLink;return;}
      const win=window.open('https://meet.google.com/new','_blank','noopener');
      if(!win)window.location.href='https://meet.google.com/new';
    });
    function activate(panel){document.querySelectorAll('.org-tutor-panel').forEach((node)=>node.classList.toggle('active',node.id==='panel-'+panel));document.querySelectorAll('.org-tutor-nav button').forEach((node)=>node.classList.toggle('active',node.dataset.panel===panel));document.getElementById('org-tutor-sidebar').classList.remove('open');if(panel==='messages')loadTutorMessages();}
    function render(){const d=state.data; document.getElementById('org-tutor-org-name').textContent=d.organization.name;document.getElementById('org-tutor-sidebar-name').textContent=d.organization.name; if(d.organization.logoUrl)document.getElementById('org-tutor-logo').src=d.organization.logoUrl; document.getElementById('requests-list').innerHTML=(d.requests||[]).map((r)=>`<article class="rounded-xl border border-amber-200 bg-amber-50 p-4"><strong>${esc(r.studentName||'Student')}</strong><p class="mt-1 text-sm">${esc(r.category)} · ${esc(r.lessonType)}</p></article>`).join('')||'<p class="text-gray-500">No organization requests.</p>';document.getElementById('students-list').innerHTML=(d.students||[]).map((s)=>{const name=s.studentName||s.name||'Student';return `<article class="flex items-center justify-between gap-3 rounded-xl border bg-white p-4"><div><strong>${esc(name)}</strong><p class="text-xs text-gray-500">${esc(s.email||'')}</p></div><a class="rounded-lg bg-red-700 px-3 py-2 text-sm font-semibold text-white" href="/messages/chat?name=${encodeURIComponent(name)}">Chat</a></article>`}).join('')||'<p class="text-gray-500">No students linked.</p>';const events=d.events||[];document.getElementById('classes-list').innerHTML=events.map((e)=>`<article class="rounded-xl border bg-white p-4"><strong>${esc(e.title)}</strong><p class="text-sm text-gray-500">${new Date(e.scheduledAt).toLocaleString()}</p>${e.meetLink?`<a class="mt-3 inline-flex rounded-lg bg-red-700 px-3 py-2 text-sm font-semibold text-white" href="${esc(e.meetLink)}" target="_blank" rel="noopener">Join meeting</a>`:''}</article>`).join('')||'<p class="text-gray-500">No classes scheduled.</p>';const content=d.content||[];document.getElementById('announcements-list').innerHTML=content.filter((i)=>i.type==='announcement').map((i)=>`<article class="rounded-xl border bg-white p-4"><strong>${esc(i.title)}</strong><p class="mt-2 text-sm text-gray-600">${esc(i.text)}</p></article>`).join('')||'<p class="text-gray-500">No announcements.</p>';document.getElementById('feeds-list').innerHTML=content.filter((i)=>['feed','photo','video'].includes(i.type)).map((i)=>`<article class="rounded-xl border bg-white p-4"><strong>${esc(i.title)}</strong><p class="mt-2 text-sm text-gray-600">${esc(i.text)}</p></article>`).join('')||'<p class="text-gray-500">No feeds.</p>';document.getElementById('notifications-list').innerHTML=(d.notifications||[]).map((n,index)=>`<button class="org-notification rounded-xl border bg-white p-4 text-left ${n.read?'':'border-l-4 border-l-red-700'}" data-index="${index}"><strong>${esc(n.type||'Update')}</strong><p class="mt-1 text-sm text-gray-600">${esc(n.message)}</p></button>`).join('')||'<p class="text-gray-500">No notifications.</p>';document.querySelectorAll('.org-notification').forEach((button)=>button.addEventListener('click',async()=>{const item=d.notifications[Number(button.dataset.index)];if(item&&item.id&&!item.read)await fetch(`/api/notifications/${encodeURIComponent(item.id)}/read`,{method:'POST'});button.classList.remove('border-l-4','border-l-red-700');}));document.getElementById('settings-name').value=d.organization.name;}
    async function load(){const params=new URLSearchParams(location.search);const [r,sessionRes]=await Promise.all([fetch('/api/organizations/tutor-workspace?orgId='+encodeURIComponent(params.get('orgId')||'')),fetch('/api/session')]);const d=await r.json();const session=await sessionRes.json();if(session.user)myUserId=session.user.id;if(!d.success){location.href='/tutor';return}state.data=d;render();const unread=(d.notifications||[]).filter((n)=>!n.read).length;const badge=document.getElementById('org-tutor-badge');badge.textContent=unread;badge.classList.toggle('hidden',!unread);}
    document.querySelectorAll('.org-tutor-nav button').forEach((b)=>b.addEventListener('click',()=>activate(b.dataset.panel)));
    document.querySelectorAll('.library-view-tab').forEach((btn)=>btn.addEventListener('click',()=>{document.querySelectorAll('.library-view-tab').forEach((b)=>b.classList.remove('active','border-b-2','border-red-700','text-red-700'));btn.classList.add('active','border-b-2','border-red-700','text-red-700');loadOrgLibrary(btn.dataset.libraryView);}));
    async function loadOrgLibrary(view){const res=await fetch(`/api/organizations/library?view=${view}`);const d=await res.json();if(!d.success)return;const grouped={};(d[view]||[]).forEach((item)=>{const folder=item.folderId||'Uncategorized';if(!grouped[folder])grouped[folder]=[];grouped[folder].push(item);});const grid=document.getElementById('org-library-grid');grid.innerHTML=Object.keys(grouped).length?Object.entries(grouped).map(([folder,items])=>`<details class="rounded-lg border border-gray-200 bg-white p-4"><summary class="cursor-pointer font-bold flex items-center gap-2"><i class="fa-solid fa-folder"></i>${esc(folder)} <span class="text-xs text-gray-500 ml-auto">${items.length} item${items.length!==1?'s':''}</span></summary><div class="mt-3 grid gap-2">${items.map((item)=>`<div class="flex items-center justify-between gap-2 p-2 bg-gray-50 rounded"><div><strong class="text-sm">${esc(item.title)}</strong><p class="text-xs text-gray-500">${esc(item.category||'')}</p></div><div class="flex gap-2"><button data-item-id="${item.id}" class="edit-library-btn text-xs px-2 py-1 bg-blue-500 text-white rounded hover:bg-blue-600"><i class="fa-solid fa-edit mr-1"></i>Edit</button><button data-item-id="${item.id}" class="delete-library-btn text-xs px-2 py-1 bg-red-500 text-white rounded hover:bg-red-600"><i class="fa-solid fa-trash mr-1"></i>Delete</button></div></div>`).join('')}</div></details>`).join(''):'<p class="text-gray-500">No uploads in this view yet.</p>';}
    document.getElementById('org-tutor-mobile').addEventListener('click',()=>document.getElementById('org-tutor-sidebar').classList.toggle('open'));document.getElementById('org-tutor-sidebar-toggle').addEventListener('click',()=>document.getElementById('org-tutor-sidebar').classList.remove('open'));document.getElementById('org-tutor-notifications').addEventListener('click',()=>activate('notifications'));document.getElementById('mark-read').addEventListener('click',async()=>{await fetch('/api/notifications/read-all',{method:'POST'});load()});document.getElementById('settings-form').addEventListener('submit',async(e)=>{e.preventDefault();await fetch('/api/profile/name',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('settings-name').value})});});document.getElementById('schedule-class').addEventListener('click',()=>activate('classes'));document.getElementById('create-group-chat').addEventListener('click',()=>{const students=state.data?.students||[];const modal=document.createElement('div');modal.className='modal-backdrop';modal.innerHTML='<div class="modal-panel"><div class="row mb-4"><h3 class="text-2xl font-bold">Create student group</h3><button type="button" class="btn-secondary" data-close><i class="fa-solid fa-xmark"></i></button></div><input id="group-name-input" class="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="Group name"><div class="mt-3 space-y-2 max-h-48 overflow-y-auto">'+(students.length?students.map((student)=>'<label class="flex items-center gap-2"><input type="checkbox" class="group-student" value="'+student.studentId+'" checked><span>'+esc(student.studentName)+'</span></label>').join(''):'<p class="text-gray-500">No students have applied to you yet.</p>')+'</div><button type="button" id="save-group-btn" class="btn-primary mt-4 w-full">Create group</button></div>';document.body.appendChild(modal);modal.querySelector('[data-close]').onclick=()=>modal.remove();modal.querySelector('#save-group-btn').onclick=async()=>{const groupName=modal.querySelector('#group-name-input').value.trim();const selected=[...modal.querySelectorAll('.group-student:checked')];if(!groupName||!selected.length)return;const members=selected.map((input)=>{const student=students.find((item)=>String(item.studentId)===input.value);return {id:Number(input.value),type:'student',name:student?.studentName||'Student'};});const response=await fetch('/api/organizations/group-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({groupName,members})});const result=await response.json();if(!result.success)return;modal.remove();activate('students');};});load().catch(()=>location.href='/tutor');
  </script>
</body>
</html>
