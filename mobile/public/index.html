<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- 
      This viewport works for phones with notches.
      It's optimized for gestures by disabling global zoom.
     -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.00001, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/app/manifest.json" />
    <meta name="theme-color" content="#c41822" />
    <link rel="apple-touch-icon" href="/app/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mozart Techniques" />
    <style>
      /**
       * Extend the react-native-web reset:
       * https://github.com/necolas/react-native-web/blob/master/packages/react-native-web/src/exports/StyleSheet/initialRules.js
       */
      html,
      body,
      #root {
        width: 100%;
        /* To smooth any scrolling behavior */
        -webkit-overflow-scrolling: touch;
        margin: 0px;
        padding: 0px;
        /* Allows content to fill the viewport and go beyond the bottom */
        min-height: 100%;
      }
      #root {
        flex-shrink: 0;
        flex-basis: auto;
        flex-grow: 1;
        display: flex;
        flex: 1;
      }

      html {
        scroll-behavior: smooth;
        /* Prevent text size change on orientation change https://gist.github.com/tfausak/2222823#file-ios-8-web-app-html-L138 */
        -webkit-text-size-adjust: 100%;
        height: calc(100% + env(safe-area-inset-top));
      }

      body {
        display: flex;
        /* Allows you to scroll below the viewport; default value is visible */
        overflow-y: auto;
        overscroll-behavior-y: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -ms-overflow-style: scrollbar;
      }
      /* Enable for apps that support dark-theme */
      /*@media (prefers-color-scheme: dark) {
        body {
          background-color: black;
        }
      }*/

      /* The install nudge - a visible banner, not just the easy-to-miss
         address-bar icon. Only ever shown when the browser actually fires
         beforeinstallprompt (so never on an already-installed launch, and
         never on a browser that doesn't support installing at all). */
      #install-banner {
        display: none;
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        z-index: 9998;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        background: #17130f;
        color: #fff;
        border-radius: 16px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        font-family: Helvetica, Arial, sans-serif;
      }
      #install-banner.visible {
        display: flex;
      }
      #install-banner img {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        flex-shrink: 0;
      }
      #install-banner-text {
        flex: 1;
        min-width: 0;
      }
      #install-banner-text strong {
        display: block;
        font-size: 14px;
      }
      #install-banner-text span {
        display: block;
        font-size: 12px;
        opacity: 0.75;
        margin-top: 2px;
      }
      #install-banner-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
      #install-banner-install {
        background: #c41822;
        color: #fff;
        border: none;
        border-radius: 999px;
        padding: 9px 16px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      #install-banner-dismiss {
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.6);
        font-size: 20px;
        line-height: 1;
        padding: 6px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <!-- 
      A generic no script element with a reload button and a message.
      Feel free to customize this however you'd like.
    -->
    <noscript>
      <form
        action=""
        style="
          background-color: #fff;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 9999;
        "
      >
        <div
          style="
            font-size: 18px;
            font-family: Helvetica, sans-serif;
            line-height: 24px;
            margin: 10%;
            width: 80%;
          "
        >
          <p>Oh no! It looks like JavaScript is not enabled in your browser.</p>
          <p style="margin: 20px 0;">
            <button
              type="submit"
              style="
                background-color: #4630eb;
                border-radius: 100px;
                border: none;
                box-shadow: none;
                color: #fff;
                cursor: pointer;
                font-weight: bold;
                line-height: 20px;
                padding: 6px 16px;
              "
            >
              Reload
            </button>
          </p>
        </div>
      </form>
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <div id="install-banner">
      <img src="/app/icon-192.png" alt="" />
      <div id="install-banner-text">
        <strong>Install Mozart Techniques</strong>
        <span>Add it to your desktop for the full app experience.</span>
      </div>
      <div id="install-banner-actions">
        <button id="install-banner-install" type="button">Install</button>
        <button id="install-banner-dismiss" type="button" aria-label="Dismiss">&times;</button>
      </div>
    </div>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/app/service-worker.js', { scope: '/app/' }).catch(() => {});
        });
      }

      // Chrome/Edge fire this instead of showing their own prompt
      // automatically - capturing it is what lets a custom, visible banner
      // trigger the real native install dialog on demand, rather than
      // relying on someone noticing the small icon in the address bar.
      var deferredInstallPrompt = null;
      var installBanner = document.getElementById('install-banner');
      var DISMISS_KEY = 'mt-install-dismissed-at';
      var DISMISS_SNOOZE_MS = 1000 * 60 * 60 * 24 * 7; // a week, not forever

      function recentlyDismissed() {
        try {
          var at = Number(localStorage.getItem(DISMISS_KEY) || 0);
          return Date.now() - at < DISMISS_SNOOZE_MS;
        } catch (e) {
          return false;
        }
      }

      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        deferredInstallPrompt = event;
        if (!recentlyDismissed()) {
          installBanner.classList.add('visible');
        }
      });

      window.addEventListener('appinstalled', function () {
        installBanner.classList.remove('visible');
        deferredInstallPrompt = null;
      });

      document.getElementById('install-banner-install').addEventListener('click', function () {
        if (!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.finally(function () {
          deferredInstallPrompt = null;
          installBanner.classList.remove('visible');
        });
      });

      document.getElementById('install-banner-dismiss').addEventListener('click', function () {
        installBanner.classList.remove('visible');
        try {
          localStorage.setItem(DISMISS_KEY, String(Date.now()));
        } catch (e) {}
      });
    </script>
  </body>
</html>
