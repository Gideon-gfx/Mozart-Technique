<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Music studio · Mozart Techniques</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <style>
      @font-face {
        font-family: Bravura;
        src: url("./bravura.woff2");
      }
      @font-face {
        font-family: Academico;
        src: url("./academico.woff2");
      }
    </style>
    <div class="studio-art" aria-hidden="true"></div>
    <div class="studio-topbar"><button id="studio-back" class="back-button" aria-label="Back to chat"><span aria-hidden="true">←</span><span id="back-label">Back to chat</span></button><span id="studio-context">Teaching tools</span></div>
    <header class="studio-header">
      <div class="studio-intro">
        <small>MOZART TECHNIQUES</small>
        <h1>Music <span>Studio</span></h1>
        <p>Music, Dance and Theatre tools for students and teachers. Your files stay on this device.</p>
      </div>
    </header>
    <nav aria-label="Teaching tools" id="tabs"></nav>
    <p id="status" role="status" aria-live="polite"></p>
    <main id="tool" hidden tabindex="-1"></main>
    <footer>
      Use headphones to avoid feedback. Audio starts only after you tap a
      control. This studio does not transmit sound to your lesson call.
    </footer>
    <script type="module" src="./main.js"></script>
  </body>
</html>
